# The rule set is declared, not inherited. `ruff check` with no config uses
# whatever `select` the installed ruff defaults to, and that default has widened
# between releases -- so an unpinned ruff made the gate report a different set of
# findings on every machine. This is the same reason .yamllint and
# .github/actionlint.yaml exist.
#
# E4/E7/E9 + F is ruff's documented default and the set the gate's baseline was
# measured against. Widening it is a deliberate change: at the time of writing a
# broader default reports 21 more findings (5 PLW1510 `subprocess.run` without
# `check=`, 4 I001 import order, 3 BLE001 blind `except Exception`, 2 TRY002,
# 2 FURB167 `re.S`, 2 EXE002, 2 EXE001 shebang/exec-bit). Those are worth doing;
# they are not this PR.
[lint]
select = ["E4", "E7", "E9", "F"]
