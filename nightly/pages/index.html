<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMM Nightly Reports</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#59636e; --line:#d1d9e0; --pass:#1a7f37; --fail:#cf222e; --skip:#9a6700; --row:#f6f8fa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --pass:#3fb950; --fail:#f85149; --skip:#d29922; --row:#151b23; }
  }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .badge { display:inline-block; font-size:12px; padding:0 8px; border-radius:10px; border:1px solid currentColor; vertical-align:middle; }
  .pass, .success { color:var(--pass); } .fail, .failure, .cancelled, .timed_out { color:var(--fail); } .skipped { color:var(--skip); }
  a { color:inherit; }
  .wrap { overflow-x:auto; }
  .actions { white-space:nowrap; text-align:right; }
  .btn { display:inline-block; font-size:12px; padding:2px 10px; border:1px solid var(--line); border-radius:6px; text-decoration:none; margin-left:4px; }
  .btn:hover { background:var(--row); }
  .btn.primary { border-color:var(--fg); font-weight:600; }
  details.group { border:1px solid var(--line); border-radius:8px; margin:0 0 12px; }
  details.group > summary { cursor:pointer; padding:10px 12px; display:flex; justify-content:space-between; gap:12px; list-style:none; }
  details.group > summary::-webkit-details-marker { display:none; }
  details.group > summary::before { content:'▸'; margin-right:6px; }
  details.group[open] > summary::before { content:'▾'; }
  .gname { font-weight:600; flex:1; }
  .counts { color:var(--muted); white-space:nowrap; }
  summary .btn { margin-left:8px; align-self:center; }
  @media (max-width:640px) { details.group > summary { flex-wrap:wrap; } summary .btn { margin-left:0; } }
  table.jobs { border-top:1px solid var(--line); table-layout:fixed; }
  table.jobs th:nth-child(2) { width:110px; } table.jobs th:nth-child(3) { width:90px; } table.jobs th:nth-child(4) { width:80px; }
  table.jobs td:first-child { overflow-wrap:anywhere; }
  @media (max-width:640px) { table.jobs th:nth-child(3), table.jobs td.dur { display:none; } table.jobs th:nth-child(4) { width:auto; } .actions { white-space:normal; } .btn { margin:2px 0 2px 4px; } }
  tr.row-fail td { background:var(--row); }
  .dur { color:var(--muted); white-space:nowrap; }
  .inv { margin:0; padding:8px 12px 12px 30px; border-top:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <div id="app">Loading…</div>
</main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https:\/\//.test(u || '') ? u : '#';
const FAILED = ['failure', 'cancelled', 'timed_out'];
const fmtDate = d => (d || '').replace('T', ' ').slice(0, 16);
const fmtDur = s => s == null ? '' : s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.round(s % 3600 / 60)}m` : `${Math.floor(s / 60)}m ${s % 60}s`;
const investigateUrl = (r, group, failed) => 'https://claude.ai/code?' + new URLSearchParams({
  repositories: 'percona/pmm-qa',
  prompt: `Read .claude/agents/investigator.md in percona/pmm-qa (main) and act as that role, following it exactly.\n\n` +
    `In the Nightly Test Suite run for image tag ${r.image_tag}, suite "${group}" had ${failed.length} failed job(s):\n` +
    failed.map(j => `- ${j.name} (${j.result}): ${j.url || r.run_url}`).join('\n') + `\nRun: ${r.run_url}\n\n` +
    `Investigate all of them together: dedup, group failures that share a root cause, reproduce, classify, ` +
    `then publish the findings to this run's nightly report (run_id ${r.run_id}, see nightly/README.md). ultrathink`
}).toString().replace(/\+/g, '%20');
const badge = res => `<span class="badge ${esc(res)}">${esc(res)}</span>`;
const app = document.getElementById('app');
let runs = [];

function detailsOf(r) {
  if (r.job_details && r.job_details.length) return r.job_details;
  return (r.jobs || []).map(j => ({ group: j.name, name: j.name, result: j.result, url: r.run_url }));
}

function overview() {
  document.title = 'PMM Nightly Reports';
  if (!runs.length) { app.innerHTML = '<h1>PMM Nightly Reports</h1><p class="sub">No runs published yet.</p>'; return; }
  app.innerHTML = `<h1>PMM Nightly Reports</h1>
  <p class="sub">One row per Nightly Test Suite run. <a href="../">Performance reports</a></p>
  <div class="wrap"><table>
    <thead><tr><th>Date</th><th>Tag</th><th>Status</th><th>Summary</th><th>Failed</th><th>Findings</th><th></th></tr></thead>
    <tbody>${runs.slice().reverse().map(r => {
      const failed = detailsOf(r).filter(j => FAILED.includes(j.result)).length;
      return `<tr><td>${esc(fmtDate(r.date))}</td><td>${esc(r.image_tag)}</td><td>${badge(r.status)}</td>
        <td>${esc(r.summary)}</td><td class="${failed ? 'failure' : ''}">${failed}</td><td>${(r.investigations || []).length}</td>
        <td class="actions"><a class="btn primary" href="#run=${encodeURIComponent(r.run_id)}">Details</a>
        <a class="btn" href="${esc(safeUrl(r.run_url))}" target="_blank" rel="noopener">GitHub run</a></td></tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

function runView(id) {
  const r = runs.find(x => x.run_id === id);
  if (!r) { app.innerHTML = '<p><a href="#">← All runs</a></p><p>Run not found.</p>'; return; }
  document.title = `${r.image_tag} · PMM Nightly`;
  const jobs = detailsOf(r);
  const groups = [...new Set(jobs.map(j => j.group))].map(g => ({ g, jobs: jobs.filter(j => j.group === g) }));
  groups.sort((a, b) => b.jobs.filter(j => FAILED.includes(j.result)).length - a.jobs.filter(j => FAILED.includes(j.result)).length);
  const inv = r.investigations || [];
  app.innerHTML = `<p><a href="#">← All runs</a></p>
  <h1>${esc(r.image_tag)} ${badge(r.status)}</h1>
  <p class="sub">${esc(fmtDate(r.date))} UTC · ${esc(r.summary)} · <a href="${esc(safeUrl(r.run_url))}" target="_blank" rel="noopener">GitHub run</a></p>
  ${groups.map(({ g, jobs }) => {
    const failed = jobs.filter(j => FAILED.includes(j.result));
    const nFail = failed.length;
    const nOk = jobs.filter(j => j.result === 'success').length;
    const finds = inv.filter(f => f.job === g || jobs.some(j => j.name === f.job));
    return `<details class="group" ${nFail ? 'open' : ''}>
      <summary><span class="gname">${esc(g)}</span>
        <span class="counts">${nOk}/${jobs.length} passed${nFail ? ` · <span class="failure">${nFail} failed</span>` : ''}</span>
        ${nFail ? `<a class="btn primary" href="${esc(investigateUrl(r, g, failed))}" onclick="event.stopPropagation(); window.open(this.href, '_blank', 'noopener'); return false;">Investigate ${nFail} failure${nFail > 1 ? 's' : ''} in Claude</a>` : ''}</summary>
      <table class="jobs"><thead><tr><th>Job</th><th>Result</th><th>Duration</th><th></th></tr></thead><tbody>
      ${jobs.map(j => `<tr class="${FAILED.includes(j.result) ? 'row-fail' : ''}"><td>${esc(j.name)}</td><td>${badge(j.result)}</td>
        <td class="dur">${esc(fmtDur(j.duration_s))}</td>
        <td class="actions"><a class="btn" href="${esc(safeUrl(j.url))}" target="_blank" rel="noopener">Logs</a></td></tr>`).join('')}
      </tbody></table>
      ${finds.length ? `<ul class="inv">${finds.map(f => `<li><b>${esc(f.verdict)}</b>: ${esc(f.summary)}` +
        (f.link ? ` (<a href="${esc(safeUrl(f.link))}" target="_blank" rel="noopener">link</a>)` : '') + '</li>').join('')}</ul>` : ''}
    </details>`;
  }).join('')}`;
}

function route() {
  const m = location.hash.match(/^#run=(.+)$/);
  m ? runView(decodeURIComponent(m[1])) : overview();
  window.scrollTo(0, 0);
}

fetch('data/index.json', { cache: 'no-store' }).then(r => r.json()).then(d => { runs = d; route(); window.addEventListener('hashchange', route); })
  .catch(() => { app.innerHTML = 'Could not load data/index.json.'; });
</script>
</body>
</html>
