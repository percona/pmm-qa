<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMM Nightly Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --sunken: #eef1f5;
    --ink: #151a23; --ink-2: #4a5566; --ink-3: #697586;
    --line: #dde2ea; --line-strong: #c3cad6;
    --pass: #137a3a; --pass-bg: #e3f4e9;
    --fail: #c0262d; --fail-bg: #fbe7e8;
    --warn: #93600a; --warn-bg: #fbf0da;
    --idle: #697586; --idle-bg: #eef1f5;
    --accent: #2447d6; --accent-ink: #ffffff;
    --focus: #2447d6; --gh: #181717;
    --shadow: 0 1px 2px rgba(21, 26, 35, .06), 0 4px 12px rgba(21, 26, 35, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --surface: #161b23; --sunken: #1c222c;
      --ink: #e8ecf2; --ink-2: #b1bac8; --ink-3: #8c97a8;
      --line: #262e3a; --line-strong: #364152;
      --pass: #4cc47a; --pass-bg: #16301f;
      --fail: #ff6b6f; --fail-bg: #3a1a1c;
      --warn: #e8b04a; --warn-bg: #362a12;
      --idle: #8c97a8; --idle-bg: #1c222c;
      --accent: #7c95ff; --accent-ink: #0f1218;
      --focus: #7c95ff; --gh: #f0f3f6;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 12px rgba(0, 0, 0, .25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218; --surface: #161b23; --sunken: #1c222c;
    --ink: #e8ecf2; --ink-2: #b1bac8; --ink-3: #8c97a8;
    --line: #262e3a; --line-strong: #364152;
    --pass: #4cc47a; --pass-bg: #16301f;
    --fail: #ff6b6f; --fail-bg: #3a1a1c;
    --warn: #e8b04a; --warn-bg: #362a12;
    --idle: #8c97a8; --idle-bg: #1c222c;
    --accent: #7c95ff; --accent-ink: #0f1218;
    --focus: #7c95ff; --gh: #f0f3f6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 12px rgba(0, 0, 0, .25);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 14px/1.5 "IBM Plex Sans", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  a { color: inherit; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; }
  .muted { color: var(--ink-3); }
  svg.logo { fill: currentColor; stroke: none; }
  svg.logo.jenkins { color: #d24939; }
  svg.logo.github { color: var(--gh); }
  svg.logo.claude { color: #d97757; }
  .src { display: inline-flex; gap: 4px; vertical-align: -3px; margin-right: 6px; }
  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  header.top { border-bottom: 1px solid var(--line); background: var(--surface); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  header.top .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
  .brand { font-weight: 600; letter-spacing: -.01em; text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
  header.top nav { margin-left: auto; display: flex; gap: 16px; }
  header.top nav a { color: var(--ink-2); text-decoration: none; }
  header.top nav a:hover { color: var(--ink); }

  main.wrap { padding: 32px 16px 64px; }
  h1 { font-size: 24px; line-height: 1.25; font-weight: 600; letter-spacing: -.015em; margin: 0; text-wrap: balance; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 40px 0 12px; }
  .lede { color: var(--ink-2); margin: 6px 0 0; }

  .pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px;
    font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .s-pass { color: var(--pass); background: var(--pass-bg); }
  .s-fail { color: var(--fail); background: var(--fail-bg); }
  .s-warn { color: var(--warn); background: var(--warn-bg); }
  .s-idle { color: var(--idle); background: var(--idle-bg); }

  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
    font: inherit; font-weight: 500; text-decoration: none; white-space: nowrap; cursor: pointer;
    transition: background-color .15s, border-color .15s; }
  .btn:hover { background: var(--sunken); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); padding: 0 8px; }
  .btn.ghost:hover { background: var(--sunken); color: var(--ink); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }

  /* Overview */
  .trend { display: flex; gap: 4px; height: 28px; margin-top: 24px; }
  .trend a { flex: 1; max-width: 16px; border-radius: 4px; }
  .trend a:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
  .trend-legend { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--ink-3); }

  .runs { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .run-row { display: grid; grid-template-columns: 4px 150px 1fr 150px 120px auto; align-items: center; gap: 16px;
    padding: 14px 16px 14px 0; border-top: 1px solid var(--line); text-decoration: none; }
  .run-row:first-child { border-top: 0; }
  .run-row:hover { background: var(--sunken); }
  .rail { align-self: stretch; }
  .rail.s-pass { background: var(--pass); } .rail.s-fail { background: var(--fail); } .rail.s-warn { background: var(--warn); } .rail.s-idle { background: var(--idle); }
  .run-row .tag { font-weight: 600; }
  .run-row .when { color: var(--ink-3); font-size: 13px; }
  .meter { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--sunken); }
  .meter span { display: block; }
  .meter .m-pass { background: var(--pass); } .meter .m-fail { background: var(--fail); } .meter .m-warn { background: var(--warn); }
  .run-row .counts { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  .findings { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .run-row .go { color: var(--ink-3); justify-self: end; }

  /* Run view */
  .crumbs { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; }
  .run-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .run-head .title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 16px 0 0; padding: 0; list-style: none; color: var(--ink-2); }
  .facts b { font-weight: 500; color: var(--ink); }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; margin-top: 24px;
    background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .stat { background: var(--surface); padding: 14px 16px; }
  .stat .n { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
  .stat .l { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .stat.fail .n { color: var(--fail); } .stat.warn .n { color: var(--warn); } .stat.pass .n { color: var(--pass); }

  .groups { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  details.group { border-top: 1px solid var(--line); }
  details.group:first-child { border-top: 0; }
  details.group > summary { list-style: none; cursor: pointer; display: grid;
    grid-template-columns: 4px 20px minmax(0, 1fr) 240px 36px; align-items: center; gap: 12px; padding: 12px 16px 12px 0; }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary:hover { background: var(--sunken); }
  details.group .chev { color: var(--ink-3); transition: transform .2s cubic-bezier(.16, 1, .3, 1); }
  details.group[open] .chev { transform: rotate(90deg); }
  .gname { font-weight: 600; overflow-wrap: anywhere; }
  .gsub { font-size: 13px; color: var(--ink-3); }
  .gmeter .counts { font-size: 12px; color: var(--ink-3); margin-top: 4px; text-align: right; }
  .gaction { justify-self: end; width: 36px; height: 36px; }
  .ask { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line-strong);
    background: var(--surface); transition: background-color .15s, border-color .15s, transform .15s cubic-bezier(.16, 1, .3, 1); }
  .ask:hover { background: color-mix(in srgb, #d97757 12%, var(--surface)); border-color: #d97757; transform: translateY(-1px); }
  .ask svg { width: 18px; height: 18px; }
  .tip { position: relative; }
  .tip:hover::after, .tip:focus-visible::after { content: attr(data-tip); position: absolute; right: 0; top: calc(100% + 6px); z-index: 2;
    white-space: nowrap; font-size: 12px; font-weight: 500; padding: 4px 8px; border-radius: 6px; background: var(--ink); color: var(--surface); }
  .gbody { border-top: 1px solid var(--line); background: var(--bg); }
  details.group[open] .gbody { animation: reveal .25s cubic-bezier(.16, 1, .3, 1); }
  @keyframes reveal { from { opacity: 0; transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { details.group[open] .gbody { animation: none; } details.group .chev { transition: none; } }

  .verdicts { margin: 0; padding: 12px 16px 12px 40px; list-style: none; display: grid; gap: 8px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .verdict { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
  .verdict .why { color: var(--ink-2); }
  .verdict .also { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .pending { display: flex; align-items: center; gap: 8px; padding: 12px 16px 12px 40px; color: var(--ink-3);
    border-bottom: 1px solid var(--line); background: var(--surface); }

  table.jobs { width: 100%; border-collapse: collapse; }
  table.jobs th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 8px 12px; }
  table.jobs th:first-child, table.jobs td:first-child { padding-left: 40px; }
  table.jobs td { padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
  table.jobs td.name { overflow-wrap: anywhere; }
  table.jobs td.dur { color: var(--ink-3); white-space: nowrap; width: 90px; }
  table.jobs td.res { width: 120px; }
  table.jobs td.act { width: 72px; text-align: right; padding-right: 16px; }
  table.jobs tr.bad td.name { font-weight: 500; }

  .state { padding: 48px 24px; text-align: center; color: var(--ink-2); background: var(--surface);
    border: 1px dashed var(--line-strong); border-radius: 12px; }
  .state h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; color: var(--ink); }
  .skel { height: 64px; border-radius: 12px; background: linear-gradient(90deg, var(--sunken), var(--surface), var(--sunken));
    background-size: 200% 100%; animation: shimmer 1.2s linear infinite; margin-bottom: 8px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  @media (max-width: 760px) {
    main.wrap { padding-top: 24px; }
    .run-row { grid-template-columns: 4px 1fr auto; row-gap: 8px; }
    .run-row .col-meter, .run-row .findings { grid-column: 2 / 4; }
    .run-row .go { grid-row: 1; grid-column: 3; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    details.group > summary { grid-template-columns: 4px 20px minmax(0, 1fr) 36px; row-gap: 8px; }
    details.group .gmeter { grid-column: 3; grid-row: 2; }
    details.group .gmeter .counts { text-align: left; }
    details.group .gaction { grid-column: 4; grid-row: 1; }
    table.jobs th:first-child, table.jobs td:first-child, .verdicts, .pending { padding-left: 16px; }
    table.jobs td.dur, table.jobs th.dur { display: none; }
    table.jobs td.res, table.jobs td.act { width: 1%; white-space: nowrap; }
    table.jobs td.act { padding-right: 8px; }
    table.jobs td { padding: 8px 6px; }
    .verdict { grid-template-columns: 1fr; gap: 4px; justify-items: start; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><span class="dot" aria-hidden="true"></span>PMM Nightly</a>
    <nav><a href="../">Performance</a><a href="https://github.com/percona/pmm-qa" target="_blank" rel="noopener">pmm-qa</a></nav>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite">
  <div class="skel"></div><div class="skel"></div><div class="skel"></div>
</main>

  claude: '<svg class="i logo claude" viewBox="0 0 24 24" aria-hidden="true"><path d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/></svg>',
  clock: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
};
const fmtDate = d => {
  const t = new Date(d);
  if (isNaN(t)) return '';
  return t.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }) + ' UTC';
};
const fmtDur = s => s == null ? '' : s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.round(s % 3600 / 60)}m` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s`;
const cls = res => FAILED.includes(res) || res === 'fail' ? 's-fail' : WARN.includes(res) ? 's-warn' : res === 'success' || res === 'pass' ? 's-pass' : 's-idle';
const label = res => ({ success: 'passed', pass: 'passed', failure: 'failed', fail: 'failed', cancelled: 'cancelled', timed_out: 'timed out',
  unstable: 'unstable', unknown: 'no result', skipped: 'skipped' }[res] || res);
const pill = res => `<span class="pill ${cls(res)}">${esc(label(res))}</span>`;
const GROUP_ORDER = ['Package AMD', 'Package ARM', 'Upgrade AMD', 'Upgrade AMI', 'Nightly', 'Nightly Compatibility', 'UI',
  'HA, OpenShift & GSSAPI', 'E2E Tests', 'CLI Integration', 'CLI Integration Compatibility', 'Integrations', 'Other'];
const orderOf = g => { const i = GROUP_ORDER.indexOf(g); return i < 0 ? GROUP_ORDER.length : i; };
const srcIcons = jobs => `<span class="src">${[...new Set(jobs.map(j => j.source).filter(Boolean))].map(s => icon[s] || '').join('')}</span>`;
const detailsOf = r => (r.jobs || []).map(j => ({ group: j.group || j.name, ...j }));
const suitesOf = f => f.suites || (f.job ? [f.job] : []);
const tally = jobs => ({
  total: jobs.length,
  pass: jobs.filter(j => j.result === 'success').length,
  fail: jobs.filter(j => FAILED.includes(j.result)).length,
  warn: jobs.filter(j => WARN.includes(j.result)).length,
});
const meter = t => {
  const pct = n => t.total ? (n / t.total * 100).toFixed(2) + '%' : '0';
  return `<div class="meter" role="img" aria-label="${t.pass} passed, ${t.fail} failed, ${t.warn} unstable of ${t.total}">
    <span class="m-pass" style="width:${pct(t.pass)}"></span><span class="m-fail" style="width:${pct(t.fail)}"></span><span class="m-warn" style="width:${pct(t.warn)}"></span></div>`;
};
const investigateUrl = (r, group, failed) => 'https://claude.ai/code?' + new URLSearchParams({
  repositories: 'percona/pmm-qa',
  prompt: `Read .claude/agents/investigator.md in percona/pmm-qa (main) and act as that role, following it exactly.\n\n` +
    `In nightly orchestrator build ${r.run_id} (image tag ${r.image_tag}, client ${r.client_version}), suite "${group}" had ${failed.length} failed job(s):\n` +
    failed.map(j => `- ${j.name} (${j.result}): ${j.url || r.run_url}`).join('\n') + `\nBuild: ${r.run_url}\n\n` +
    `Investigate all of them together: dedup, group failures that share a root cause, reproduce, classify, ` +
    `then publish the findings to this run's nightly report (run_id ${r.run_id}, see nightly/README.md). ultrathink`
}).toString().replace(/\+/g, '%20');

const app = document.getElementById('app');
let runs = [];

function overview() {
  document.title = 'PMM Nightly Reports';
  if (!runs.length) {
    app.innerHTML = `<h1>Nightly reports</h1>
      <div class="state" style="margin-top:24px"><h3>No builds published yet</h3>
      The nightly orchestrator adds a report here at the end of every build.</div>`;
    return;
  }
  const newest = runs.slice().reverse();
  const recent = runs.slice(-30);
  const trend = recent.map(r => {
    return `<a href="#run=${encodeURIComponent(r.run_id)}" class="rail ${cls(r.status)}"
      title="${esc(r.image_tag)} · ${esc(fmtDate(r.date))} · ${esc(r.summary)}" aria-label="${esc(r.image_tag)} ${esc(label(r.status))}"></a>`;
  }).join('');
  app.innerHTML = `<h1>Nightly reports</h1>
    <p class="lede">One entry per nightly orchestrator build, newest first. Open a build for every job, grouped by suite.</p>
    <div class="trend" aria-label="Last ${recent.length} builds">${trend}</div>
    <div class="trend-legend"><span>Last ${recent.length} builds, oldest to newest</span><span>Hover for the tag, click to open</span></div>
    <h2>Builds</h2>
    <div class="runs">${newest.map(r => {
      const t = tally(detailsOf(r));
      const inv = (r.investigations || []).length;
      return `<a class="run-row" href="#run=${encodeURIComponent(r.run_id)}">
        <span class="rail ${cls(r.status)}" aria-hidden="true"></span>
        <div><div class="tag">${esc(r.image_tag)}</div><div class="when">${esc(fmtDate(r.date))}</div></div>
        <div class="col-meter">${meter(t)}<div class="counts">${t.pass}/${t.total} passed${t.fail ? ` · ${t.fail} failed` : ''}${t.warn ? ` · ${t.warn} unstable` : ''}</div></div>
        <div>${pill(r.status)}</div>
        <div class="findings">${inv ? `${icon.note}${inv} finding${inv > 1 ? 's' : ''}` : t.fail ? '<span class="muted">Not investigated</span>' : ''}</div>
        <span class="go">${icon.chev}</span>
      </a>`;
    }).join('')}</div>`;
}

function runView(id) {
  const r = runs.find(x => x.run_id === id);
  if (!r) {
    app.innerHTML = `<div class="crumbs"><a class="btn ghost" href="#">${icon.back}All builds</a></div>
      <div class="state"><h3>Build not found</h3>No report named ${esc(id)} has been published.</div>`;
    return;
  }
  document.title = `${r.image_tag} · PMM Nightly`;
  const jobs = detailsOf(r);
  const t = tally(jobs);
  const inv = r.investigations || [];
  const groups = [...new Set(jobs.map(j => j.group))].map(g => ({ g, jobs: jobs.filter(j => j.group === g) }));
  groups.sort((a, b) => orderOf(a.g) - orderOf(b.g) || a.g.localeCompare(b.g));
  const covered = new Set(inv.flatMap(suitesOf));
  const openGroups = groups.filter(({ jobs }) => tally(jobs).fail).length;
  const pendingGroups = groups.filter(({ g, jobs }) => tally(jobs).fail && !covered.has(g)).length;

  app.innerHTML = `<div class="crumbs"><a class="btn ghost" href="#">${icon.back}All builds</a></div>
    <div class="run-head">
      <div class="title"><h1>${esc(r.image_tag)}</h1>${pill(r.status)}</div>
      <a class="btn" href="${esc(safeUrl(r.run_url))}" target="_blank" rel="noopener" aria-label="Open the Jenkins build">${icon.jenkins}Build${icon.ext}</a>
    </div>
    <ul class="facts">
      <li>${esc(fmtDate(r.date))}</li>
      <li>Client <b>${esc(r.client_version || '—')}</b></li>
      <li>Report <span class="mono">${esc(r.run_id)}</span></li>
    </ul>
    <div class="stats">
      <div class="stat pass"><div class="n">${t.pass}</div><div class="l">passed of ${t.total}</div></div>
      <div class="stat ${t.fail ? 'fail' : ''}"><div class="n">${t.fail}</div><div class="l">failed jobs, in ${openGroups} suite${openGroups === 1 ? '' : 's'}</div></div>
      <div class="stat ${t.warn ? 'warn' : ''}"><div class="n">${t.warn}</div><div class="l">unstable or no result</div></div>
      <div class="stat"><div class="n">${inv.length}</div><div class="l">findings${pendingGroups ? `, ${pendingGroups} suite${pendingGroups === 1 ? '' : 's'} pending` : ''}</div></div>
    </div>
    <h2>Suites</h2>
    <div class="groups">${groups.map(({ g, jobs }) => {
      const x = tally(jobs);
      const failed = jobs.filter(j => FAILED.includes(j.result));
      const finds = inv.filter(f => suitesOf(f).includes(g));
      const state = x.fail ? 'fail' : x.warn ? 'warn' : 'pass';
      const verdicts = finds.length ? `<ul class="verdicts">${finds.map(f => {
        const others = suitesOf(f).filter(s => s !== g);
        return `<li class="verdict"><span class="pill ${{ 'product bug': 's-fail', 'test fix': 's-warn' }[f.verdict] || 's-idle'}">${esc(f.verdict)}</span>
          <div><div class="why">${esc(f.summary)}${f.link ? ` <a href="${esc(safeUrl(f.link))}" target="_blank" rel="noopener">Open${icon.ext}</a>` : ''}</div>
          ${others.length ? `<div class="also">Same cause as ${others.map(esc).join(', ')}</div>` : ''}</div></li>`;
      }).join('')}</ul>` : x.fail ? `<div class="pending">${icon.clock}Not investigated yet.</div>` : '';
      return `<details class="group" ${x.fail || x.warn ? 'open' : ''}>
        <summary>
          <span class="rail s-${state}" aria-hidden="true"></span>
          ${icon.chev}
          <div><div class="gname">${srcIcons(jobs)}${esc(g)}</div><div class="gsub">${x.total} job${x.total === 1 ? '' : 's'}${finds.length ? ` · ${finds.length} finding${finds.length > 1 ? 's' : ''}` : ''}</div></div>
          <div class="gmeter">${meter(x)}<div class="counts">${x.pass}/${x.total} passed${x.fail ? ` · ${x.fail} failed` : ''}${x.warn ? ` · ${x.warn} unstable` : ''}</div></div>
          <div class="gaction">${x.fail ? `<a class="ask tip" href="${esc(investigateUrl(r, g, failed))}" data-open
            data-tip="Investigate ${x.fail} failure${x.fail > 1 ? 's' : ''} in Claude" aria-label="Investigate ${x.fail} failure${x.fail > 1 ? 's' : ''} of ${esc(g)} in Claude">${icon.claude}</a>` : ''}</div>
        </summary>
        <div class="gbody">${verdicts}
          <table class="jobs"><thead><tr><th>Job</th><th>Result</th><th class="dur">Duration</th><th></th></tr></thead><tbody>
          ${jobs.map(j => `<tr class="${FAILED.includes(j.result) ? 'bad' : ''}"><td class="name">${esc(j.name)}</td><td class="res">${pill(j.result)}</td>
            <td class="dur">${esc(fmtDur(j.duration_s))}</td>
            <td class="act"><a class="btn ghost sm" href="${esc(safeUrl(j.url))}" target="_blank" rel="noopener" aria-label="Logs for ${esc(j.name)}">${icon[j.source] || ''}Logs</a></td></tr>`).join('')}
          </tbody></table>
        </div>
      </details>`;
    }).join('')}</div>`;
}

app.addEventListener('click', e => {
  const a = e.target.closest('a[data-open]');
  if (!a) return;
  e.preventDefault();
  e.stopPropagation();
  window.open(a.href, '_blank', 'noopener');
});

function route() {
  const m = location.hash.match(/^#run=(.+)$/);
  m ? runView(decodeURIComponent(m[1])) : overview();
  window.scrollTo(0, 0);
}

fetch('data/index.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { runs = d; route(); window.addEventListener('hashchange', route); })
  .catch(() => {
    app.innerHTML = `<div class="state"><h3>Could not load the reports</h3>
      <span class="mono">data/index.json</span> did not load. Reload the page, or check that the gh-pages branch has been published.</div>`;
  });
</script>
</body>
</html>
