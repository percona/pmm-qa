---

volumes:
  pmm-volume:
  pmm-encryption-upgrade-volume:
    name: pmm-encryption-upgrade-volume

networks:
  pmm-network:
    driver: bridge
  pmm-qa:
    external: true

services:
  pmm-server:
    image: ${DOCKER_VERSION:-perconalab/pmm-server:3-dev-latest}
    container_name: pmm-server
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      - PMM_DEBUG=1
      - PMM_ENABLE_ACCESS_CONTROL=1
      - GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP=1
      - PMM_ENABLE_TELEMETRY=0
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=https://pmm-server:8443/graph
      - PMM_ENABLE_NOMAD=${PMM_ENABLE_NOMAD:-0}
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=mailpit:1025
      - GF_SMTP_FROM_ADDRESS=pmm@example.com
    volumes:
      - pmm-volume:/srv
    networks:
      - pmm-network
      - pmm-qa

  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: mailpit
    ports:
      - "8025:8025"
    networks:
      - pmm-network

  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: renderer
    environment:
      - GF_RENDERER_PLUGIN_IGNORE_HTTPS_ERRORS=true
      - BROWSER_FLAG=--ignore-certificate-errors
    networks:
      - pmm-network
      - pmm-qa

  webhookd:
    image: ncarlier/webhookd
    profiles: [webhookd]
    container_name: webhookd
    environment:
      - WHD_SCRIPTS=/var/opt/webhookd/scripts
      - WHD_PASSWD_FILE=/var/opt/webhookd/scripts/.htpasswd
    volumes:
      - ./testdata/ia/scripts:/var/opt/webhookd/scripts
    networks:
      - pmm-qa

  sftp-server:
    image: jmcombs/sftp
    profiles: [sftp]
    container_name: sftp-server
    command: foo:password
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/22"]
      interval: 1s
      retries: 30
    volumes:
      - ./output/sftp:/home/foo/upload
    networks:
      - pmm-qa

  pmm-server-encryption:
    image: ${DOCKER_VERSION:-perconalab/pmm-server:3-dev-latest}
    profiles: [encryption]
    container_name: pmm-server-encryption
    environment:
      - PMM_DEBUG=1
      - PMM_ENCRYPTION_KEY_PATH=/srv/non-default.key
    healthcheck:
      start_period: 2m

  valkey-encryption:
    image: valkey/valkey:8
    profiles: [encryption]
    container_name: valkey-encryption
    command: >-
      valkey-server --port 0 --tls-port 6379 --tls-auth-clients yes
      --tls-cert-file /tls/server.crt --tls-key-file /tls/server.key --tls-ca-cert-file /tls/ca.crt
    volumes:
      - ./output/valkey-encryption-tls:/tls:ro
    networks:
      - pmm-qa

  minio-encryption:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    profiles: [encryption]
    container_name: minio-encryption
    command: server /data
    environment:
      - MINIO_ROOT_USER=pmm-encryption-access
      - MINIO_ROOT_PASSWORD=pmm-encryption-secret
    networks:
      - pmm-qa

  pmm-server-encryption-upgrade:
    image: ${ENCRYPTION_UPGRADE_IMAGE:-percona/pmm-server:3.10.0}
    profiles: [encryption-upgrade]
    container_name: pmm-server-encryption-upgrade
    ports:
      - "4443:8443"
    environment:
      - PMM_DEBUG=1
      - PMM_ENABLE_TELEMETRY=0
      - GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    volumes:
      - pmm-encryption-upgrade-volume:/srv
    networks:
      - pmm-qa
    healthcheck:
      start_period: 2m

  postgres:
    image: perconalab/percona-distribution-postgresql:15
    profiles: [encryption]
    container_name: postgres
    command: -c shared_preload_libraries=pg_stat_monitor,pg_stat_statements
    environment:
      - POSTGRES_PASSWORD=pmm-^*&@agent-password
    networks:
      - pmm-qa
