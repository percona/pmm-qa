---
- hosts: all
  become: true
  become_method: sudo
  remote_user: root

  vars:
    repo: "{{ lookup('env', 'install_repo') | default('testing', true) }}"
    version: "{{ lookup('env', 'version') | default('3.7.0', true) }}"

  tasks:

    - name: Copy upgrade script
      ansible.builtin.copy:
        src: ./upgrade_all_v3.sh
        dest: /tmp/upgrade_all_v3.sh
        mode: '0755'

    - name: Remove old log
      shell: rm -f /tmp/update.log

    - name: Start PMM client upgrade
      shell: |
        nohup bash /tmp/upgrade_all_v3.sh \
        --repo {{ repo }} \
        --version {{ version }} \
        > /tmp/update.log 2>&1 &
      async: 7200
      poll: 10
      register: upgrade_result

    - name: Show async job details
      debug:
        var: upgrade_result

    - name: Wait for upgrade script completion
      async_status:
        jid: "{{ upgrade_result.ansible_job_id }}"
      register: job_result
      until: job_result.finished
      retries: 240
      delay: 30

    - name: Show final status
      debug:
        var: job_result
