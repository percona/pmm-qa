#### export install_repo=testing                                     
#### export ANSIBLE_HOST_KEY_CHECKING=False
- hosts: all
  become: true
  become_method: sudo
  remote_user: root
  vars:
    repo: "{{ lookup('vars', 'extra_repo', default=lookup('env','install_repo') | default('testing', true) ) }}"
    version: "{{ lookup('vars', 'extra_version', default=lookup('env','version') | default('3.7.0', true) ) }}"

  tasks:
  - name: Copy Install Client Script
    ansible.builtin.copy:
      src: ./upgrade_all_v3.sh
      dest: /tmp/upgrade_all_v3.sh
      mode: '0655'

  - name: run the script to setup needed repo and install pmm-client inside container
    shell: bash /tmp/upgrade_all_v3.sh --repo {{ repo }} --version {{ version }} >> /tmp/update.log 2>&1
    async: 3600
    poll: 0

