display_information:
  name: PMM AI
  description: Relays PMM QA requests to Claude Code Routines when mentioned in Slack
  background_color: "#611f69"

features:
  bot_user:
    display_name: pmm-ai
    always_online: true

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - reactions:write
      - channels:history

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
