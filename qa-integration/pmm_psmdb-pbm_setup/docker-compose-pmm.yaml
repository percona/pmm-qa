version: "3"
services:
  pmm-server:
    image: ${PMM_SERVER_IMAGE:-${PMM_IMAGE:-perconalab/pmm-server:3-dev-latest}}
    container_name: pmm-server
    environment:
      - "PMM_DEBUG=1"
      - "ENABLE_BACKUP_MANAGEMENT=1"
      - "GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}"
    ports:
      - "443:8443"
      - "8081:8080"
    networks:
      - qa-integration
    volumes:
      - pmm-server:/srv

networks:
  qa-integration:
    external: true

volumes:
  pmm-server: null
