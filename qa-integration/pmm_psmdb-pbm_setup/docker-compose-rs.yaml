      PMM_AGENT_SERVER_ADDRESS: ${PMM_SERVER_CONTAINER_ADDRESS:-pmm-server:8443}
      PMM_AGENT_SERVER_USERNAME: admin
      PMM_AGENT_SERVER_PASSWORD: ${ADMIN_PASSWORD:-password}
      PMM_AGENT_SERVER_INSECURE_TLS: 1
    hostname: rs203
    entrypoint: bash -c "chown -R mongod:mongod /keytabs && exec /usr/sbin/init"

  # Shared, single-instance object store for PBM backups. Kept behind its own
  # "minio" profile (not classic/extra) and pinned to the fixed container_name
  # "minio" so the start scripts can share ONE minio across concurrent PSMDB
  # projects: whichever setup runs first creates it under its own project, the
  # others detect it by name and reuse it. If it were also in classic/extra a
  # second project's `up` would try to manage the already-owned "minio"
  # container and collide.
  minio:
    image: minio/minio
    profiles: ["minio"]
    container_name: minio
    ports:
      - "9001:9000"
    depends_on:
      - build_member
    networks:
      - pmm-qa
      - pmm-ui-tests1
      - qa-integration
      - pmm-ui-tests2
      - pmm-ui-tests3
    volumes:
      - /tmp/minio/backups:/backups
    environment:
      - "MINIO_ACCESS_KEY=minio1234"
      - "MINIO_SECRET_KEY=minio1234"
    command: server /backups

  createbucket:
    container_name: createbucket
    image: minio/mc
    profiles: ["minio"]
    networks:
      - pmm-qa
      - pmm-ui-tests1
      - qa-integration
      - pmm-ui-tests2
      - pmm-ui-tests3
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " sleep 5; /usr/bin/mc alias set myminio http://minio:9000 minio1234 minio1234; /usr/bin/mc mb myminio/bcp; exit 0; "

  kerberos:
    image: kerberos/local
    build:
      dockerfile: ./Dockerfile-kerberos
      context: .
    container_name: kerberos
    hostname: kerberos
    networks:
      - pmm-qa
      - pmm-ui-tests1
      - qa-integration
      - pmm-ui-tests3
      - pmm-ui-tests2
    environment:
      - "KRB5_TRACE=/dev/stderr"
    volumes:
      - keytabs:/keytabs
    healthcheck:
      test: ["CMD", "kadmin.local", "-q", "listprincs"]
      interval: 2s
      timeout: 1s
      retries: 5

networks:
  # Per-project inter-node network. Compose names it <project>_mongo-internal,
  # so the replica-set members of each PSMDB stack resolve each other here
  # without clashing with an identically named member in a sibling project on
  # the shared pmm-qa network.
  mongo-internal:
  qa-integration:
    external: true
  pmm-ui-tests1:
    external: true
    name: pmm-ui-tests_pmm-network
  pmm-ui-tests2:
    external: true
    name: pmm2-upgrade-tests_pmm-network
  pmm-ui-tests3:
    external: true
    name: pmm2-ui-tests_pmm-network
  pmm-qa:
    name: pmm-qa
    external: true

volumes:
  keytabs:
    driver: local
