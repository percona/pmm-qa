# Test harness for the sharded PSMDB stack, kept out of docker-compose-sharded.yaml
# on purpose: `docker compose ... up -d` must never create the fixed-name "test"
# container (its global name clashes with the other PSMDB stacks running in
# parallel). This file is merged in ONLY for the test run, and only when
# TESTS=yes, via:
#   docker compose -f docker-compose-sharded.yaml -f docker-compose-test.yaml \
#     --profile tests run --rm test pytest ...
services:
  test:
    profiles: ["tests"]
    build:
      dockerfile: ./Dockerfile-testinfra
      context: .
    environment:
      PMM_SERVER_CONTAINER_ADDRESS: ${PMM_SERVER_CONTAINER_ADDRESS:-pmm-server:8443}
    volumes:
      - ./test:/test
      - /var/run/docker.sock:/var/run/docker.sock:ro
    container_name: test
    hostname: test
    networks:
      - pmm-qa
      - pmm-ui-tests1
      - qa-integration
      - pmm-ui-tests3
      - pmm-ui-tests2

networks:
  qa-integration:
    external: true
  pmm-ui-tests1:
    external: true
    name: pmm-ui-tests_pmm-network
  pmm-ui-tests2:
    external: true
    name: pmm2-upgrade-tests_pmm-network
  pmm-ui-tests3:
    external: true
    name: pmm2-ui-tests_pmm-network
  pmm-qa:
    name: pmm-qa
    external: true
