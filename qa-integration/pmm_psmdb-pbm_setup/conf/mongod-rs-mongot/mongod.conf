storage:
  dbPath: /var/lib/mongo
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1

systemLog:
  destination: syslog

net:
  port: 27017
  bindIp: 0.0.0.0

replication:
  replSetName: "rs"

operationProfiling:
  mode: all
  slowOpThresholdMs: 1

security:
  keyFile: /etc/keyfile
  authorization: enabled
setParameter:
  # mongot's Java driver authenticates with SCRAM-SHA-256.
  authenticationMechanisms: SCRAM-SHA-1,SCRAM-SHA-256,GSSAPI
  # Each member's own mongot shares its network namespace.
  mongotHost: localhost:27028
  searchIndexManagementHostAndPort: localhost:27028
  skipAuthenticationToSearchIndexManagementServer: false
  useGrpcForSearch: true
