systemLog:
  destination: syslog

net:
  port: 27017
  bindIp: 0.0.0.0

security:
  keyFile: /etc/keyfile

sharding:
  configDB: rscfg/rscfg01:27017,rscfg02:27017,rscfg03:27017

# FTDC (full-time diagnostic data capture) is OFF by default on a mongos, unlike
# mongod. The PMM mongodb_exporter sources the entire mongodb_ss_* serverStatus
# family from getDiagnosticData().data.serverStatus, so with FTDC disabled the
# router exposes only mongodb_mongos_* sharding metrics + mongodb_up and the
# MongoDB Router Summary dashboard's serverStatus panels (Command Operations,
# Connections, Latencies, Queued Operations, Reads & Writes) stay empty. Turning
# it on makes the mongos populate getDiagnosticData with serverStatus.
setParameter:
  diagnosticDataCollectionEnabled: true
