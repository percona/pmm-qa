# Percona Search for MongoDB, one per replica set member, run by setup_psmdb
# with MONGOT=true in that member's network namespace.
syncSource:
  replicaSet:
    hostAndPort: "localhost:27017"
    scramAuth:
      username: mongotUser
      passwordFile: "/etc/mongot/secrets/passwordFile"
      authSource: admin
      tls:
        enabled: false
storage:
  dataPath: "/var/lib/mongot"
server:
  grpc:
    address: "localhost:27028"
    tls:
      mode: "disabled"
# Scraped by the member's pmm-agent through its container address.
metrics:
  enabled: true
  address: "0.0.0.0:9946"
healthCheck:
  address: "localhost:8080"
logging:
  verbosity: INFO
