# This playbook does following:
#   enables Percona testing repository

- hosts: all
  become: true
  become_method: sudo
  vars:
    pxc_version: "{{ lookup('vars', 'extra_pxc_version', default=lookup('env','PXC_VERSION') | default('8.0', true) ) }}"
    pxc_tarball: "{{ lookup('vars', 'extra_pxc_tarball', default=lookup('env','PXC_TARBALL') | default('', true) ) }}"
    proxysql_version: "{{ lookup('vars', 'extra_proxysql_version', default=lookup('env','PROXYSQL_VERSION') | default('2', true) ) }}"
    proxysql_package: "{{ lookup('vars', 'extra_proxysql_package', default=lookup('env','PROXYSQL_PACKAGE') | default('', true) ) }}"
    pxc_container: "{{ lookup('vars', 'extra_pxc_container', default=lookup('env','PXC_CONTAINER') | default('pxc_container', true) ) }}"
    pmm_server_ip: "{{ lookup('vars', 'extra_pmm_server_ip', default=lookup('env','PMM_SERVER_IP') | default('host.docker.internal', true) ) }}"
    client_version: "{{ lookup('vars', 'extra_client_version', default=lookup('env','CLIENT_VERSION') | default('dev-latest', true) ) }}"
    admin_password: "{{ lookup('vars', 'extra_admin_password', default=lookup('env','ADMIN_PASSWORD') | default('admin', true) ) }}"
    pmm_qa_branch: "{{ lookup('vars', 'extra_pmm_qa_branch', default=lookup('env','PMM_QA_GIT_BRANCH') | default('main', true) ) }}"
    number_of_nodes: "{{ lookup('vars', 'extra_number_of_nodes', default=lookup('env','PXC_NODES') | default('3', true) ) }}"
    pxc_dev_cluster: "{{ lookup('vars', 'extra_pxc_cluster_name', default=lookup('env','PXC_CLUSTER_NAME') | default('pxc-dev-cluster', true) ) }}"
    query_source: "{{ lookup('vars', 'extra_query_source', default=lookup('env','QUERY_SOURCE') | default('perfschema', true) ) }}"
    # Set to 'caching_sha2_password' to make ProxySQL itself advertise that plugin
    # (reproduces K8SPXC-1830: proxysql_exporter full-auth failure without TLS).
    proxysql_auth_plugin: "{{ lookup('vars', 'extra_proxysql_auth_plugin', default=lookup('env','PROXYSQL_AUTH_PLUGIN') | default('', true) ) }}"
    # Which ProxySQL interface the PMM exporter is registered against.
    #   6032 = admin interface (default; always mysql_native_password)
    #   6033 = mysql interface (honours mysql-default_authentication_plugin)
    proxysql_pmm_port: "{{ lookup('vars', 'extra_proxysql_pmm_port', default=lookup('env','PROXYSQL_PMM_PORT') | default('6032', true) ) }}"
    proxysql_pmm_user: "{{ lookup('vars', 'extra_proxysql_pmm_user', default=lookup('env','PROXYSQL_PMM_USER') | default('admin', true) ) }}"
    proxysql_pmm_password: "{{ lookup('vars', 'extra_proxysql_pmm_password', default=lookup('env','PROXYSQL_PMM_PASSWORD') | default('admin', true) ) }}"
    # Store mysql_users passwords as caching_sha2 hashes instead of cleartext.
    # Removes ProxySQL's fast-auth path, forcing "full authentication" - which
    # fails without TLS/RSA (K8SPXC-1830). Requires ProxySQL >= 2.6.2.
    proxysql_hash_passwords: "{{ lookup('vars', 'extra_proxysql_hash_passwords', default=lookup('env','PROXYSQL_HASH_PASSWORDS') | default('false', true) ) | bool }}"
    debug_client: "{{ lookup('env', 'CLIENT_DEBUG') | default(false, true) | bool }}"

  tasks:
  - name: cleanup container for client and DB setup
    shell: >
      docker ps -a --filter "name={{ pxc_container }}" | grep -q . && docker stop {{ pxc_container }} && docker rm -fv {{ pxc_container }}
    ignore_errors: true
    tags:
      - cleanup

  - name: Create pmm-qa network if not exist
    shell: docker network create pmm-qa
    ignore_errors: true

  - name: Prepare Container for PXC and Proxysql
    shell: >
      docker run -d --platform linux/amd64 --name={{ pxc_container }}
      -p 6033:6033
      phusion/baseimage:jammy-1.0.1
  
  - name: Copy all required Artifacts to the docker pxc_container
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} mkdir -p artifacts
      - docker cp ./client_container_pxc_setup.sh {{ pxc_container }}:/
      - docker cp ./client_container_proxysql_setup.sh {{ pxc_container }}:/
      - docker cp ./pmm3-client-setup.sh {{ pxc_container }}:/

  - name: Get PXC Product tarball URL based on the version
    shell: cat product_version_download_helper | grep pxc | grep "\-{{ pxc_version }}" | head -1 | awk -F'# ' '{print $3}'
    register: tarball
    when: lookup('env', 'PXC_TARBALL') == ''

  - name: Set PXC Product URL if environment or paramater are not defined
    set_fact:
      pxc_tarball: "{{tarball.stdout | default(pxc_tarball,true)}}"

  - name: Get ProxySQL Product package URL based on the version
    shell: cat product_version_download_helper | grep proxysql | grep "\-{{ proxysql_version }}" | head -1 | awk -F'# ' '{print $3}'
    register: package
    when: lookup('env', 'PROXYSQL_PACKAGE') == ''

  - name: Set ProxySQL Product URL if environment or paramater are not defined
    set_fact:
      proxysql_package: "{{package.stdout | default(proxysql_package,true)}}"

  - name : Get filename from URL for ProxySQL
    shell: basename {{ proxysql_package }}    
    register: file_name

  - name: Execute User & Proxysql Setup inside the PXC pxc_container
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} apt-get update
      - docker exec {{ pxc_container }} apt-get -y install wget curl git gnupg2 lsb-release debconf-utils
      - docker exec {{ pxc_container }} apt-get -y install libaio1 libaio-dev libnuma-dev socat
      - docker exec {{ pxc_container }} adduser --disabled-password --gecos "" pxc
      - docker exec {{ pxc_container }} wget {{ proxysql_package }}
      - docker exec {{ pxc_container }} dpkg -i {{ file_name.stdout }}
      - docker exec {{ pxc_container }} apt install -y sysbench

  - name: Install pmm2-client on the pxc_container
    shell: "{{ item }}"
    with_items:
      - docker network connect pmm-qa {{ pxc_container }}
      - docker exec {{ pxc_container }} bash -x ./pmm3-client-setup.sh --pmm_server_ip {{ pmm_server_ip }} --client_version {{ client_version }} --admin_password {{ admin_password }}{{ (debug_client | default(false) | bool) | ternary(' --debug', '') }} --use_metrics_mode no

  - name: Configure PXC for PMM Client if non-tarball install
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} usermod -aG pmm-agent pxc
    when: "'http' not in client_version"

  - name: Execute User & Proxysql Setup inside the PXC pxc_container
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} percona-release enable-only pxb-24 release
      - docker exec {{ pxc_container }} apt-get update
      - docker exec {{ pxc_container }} apt-get install -y percona-xtrabackup-24
    when: pxc_version == "5.7"

  - name: Execute Setup script inside the PXC pxc_container
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} chmod 1777 /tmp
      - docker exec --user pxc {{ pxc_container }} bash -xe ./client_container_pxc_setup.sh --pxc_version {{ pxc_version }} --pxc_tarball {{ pxc_tarball }} --number_of_nodes {{ number_of_nodes }} --pxc_dev_cluster {{ pxc_dev_cluster }} --query_source {{query_source}} > setup_pxc_{{ pxc_version }}.log

  - name: Set Random Number Fact
    set_fact:
      random_number: "{{ (10000 | random) | int }}"

  # PXC 8.4 ships mysql_native_password disabled, but proxysql-admin hardcodes it
  # when creating its monitor/cluster users. Point it at caching_sha2_password.
  - name: Patch proxysql-admin auth plugin for PXC 8.4
    shell: >
      docker exec {{ pxc_container }} bash -c
      "sed -i 's/mysql_native_password/caching_sha2_password/g' \$(command -v proxysql-admin)"
    when: pxc_version is match('^8\.4')

  - name: Start ProxySQL inside the PXC extra_pxc_container
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} bash -c 'sed -i s#3306#'"\$(grep 'port' /home/pxc/PXC/node1.cnf | cut -d= -f2)"'# /etc/proxysql.cnf'
      - docker exec {{ pxc_container }} proxysql -c /etc/proxysql.cnf
      - docker exec {{ pxc_container }} sleep 20
      - docker exec {{ pxc_container }} bash -c 'sed -i s#3306#'"\$(grep 'port' /home/pxc/PXC/node1.cnf | cut -d= -f2)"'# /etc/proxysql-admin.cnf'
      - docker exec {{ pxc_container }} proxysql-admin --config-file=/etc/proxysql-admin.cnf --enable
      - docker exec {{ pxc_container }} sleep 20
      - docker exec {{ pxc_container }} mysql -h 127.0.0.1 -P 6032 -u admin -padmin -e "SET admin-stats_credentials='read_user:read_user';"
      - docker exec {{ pxc_container }} mysql -h 127.0.0.1 -P 6032 -u admin -padmin -e "LOAD ADMIN VARIABLES TO RUNTIME;"
      - docker exec {{ pxc_container }} mysql -h 127.0.0.1 -P 6032 -u admin -padmin -e "SAVE ADMIN VARIABLES TO DISK;"

  # Make ProxySQL advertise caching_sha2_password to clients (incl. the PMM
  # proxysql_exporter). Needs cleartext passwords, so admin-hash_passwords=false.
  - name: Configure ProxySQL authentication plugin
    shell: "{{ item }}"
    with_items:
      # separate statements: an unsupported variable must not abort the rest
      - docker exec {{ pxc_container }} mysql -h 127.0.0.1 -P 6032 -u admin -padmin -e "SET mysql-default_authentication_plugin='{{ proxysql_auth_plugin }}';"
      - docker exec {{ pxc_container }} mysql -h 127.0.0.1 -P 6032 -u admin -padmin -e "SET admin-hash_passwords=false;" || true
      - docker exec {{ pxc_container }} mysql -h 127.0.0.1 -P 6032 -u admin -padmin -e "LOAD MYSQL VARIABLES TO RUNTIME; SAVE MYSQL VARIABLES TO DISK;"
      - docker exec {{ pxc_container }} mysql -h 127.0.0.1 -P 6032 -u admin -padmin -e "INSERT OR REPLACE INTO mysql_users(username,password,default_hostgroup) VALUES ('monitor','monitor',10); LOAD MYSQL USERS TO RUNTIME; SAVE MYSQL USERS TO DISK;"
      - docker exec {{ pxc_container }} mysql -h 127.0.0.1 -P 6032 -u admin -padmin -e "SELECT variable_name, variable_value FROM global_variables WHERE variable_name IN ('mysql-default_authentication_plugin','admin-hash_passwords');"
    when: proxysql_auth_plugin | length > 0

  - name: Add ProxySQL to PMM
    shell: >
      docker exec {{ pxc_container }} pmm-admin add proxysql
      --username={{ proxysql_pmm_user }} --password={{ proxysql_pmm_password }}
      --service-name=my-new-proxysql_{{ pxc_container }}_{{ random_number }}
      --host=127.0.0.1 --port={{ proxysql_pmm_port }}

  # Hash the passwords only AFTER the service is registered. pmm-admin's
  # pre-flight connection check would otherwise fail and the service would never
  # be added - we want the *running* exporter to fail at scrape time, which is
  # what K8SPXC-1830 reports (component=agent-process, source=exporter.go).
  - name: Hash ProxySQL mysql_users passwords (force caching_sha2 full auth)
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} mysql -h 127.0.0.1 -P 6032 -u admin -padmin -e "UPDATE mysql_users SET password=CACHING_SHA2_PASSWORD(password) WHERE password NOT LIKE '$A$%'; LOAD MYSQL USERS TO RUNTIME; SAVE MYSQL USERS TO DISK;"
      - docker exec {{ pxc_container }} mysql -h 127.0.0.1 -P 6032 -u admin -padmin -e "SELECT username, password FROM mysql_users;"
    when: proxysql_hash_passwords | bool

  # Force the exporter to re-handshake against the new auth plugin, otherwise a
  # connection established before the change keeps working and hides the issue.
  # pkill -x matches the process name only; -f would match this bash -c command
  # line too and kill the shell running it (rc=143).
  - name: Stop pmm-agent
    shell: >
      docker exec {{ pxc_container }} bash -c
      "systemctl stop pmm-agent 2>/dev/null; pkill -x pmm-agent 2>/dev/null; sleep 3; true"
    when: proxysql_auth_plugin | length > 0 or proxysql_hash_passwords | bool

  # docker exec WITHOUT -d waits for the exec session's stdout/stderr to close,
  # so a backgrounded agent makes the task hang. -d detaches and returns.
  - name: Start pmm-agent (systemd containers)
    shell: docker exec {{ pxc_container }} bash -c "systemctl start pmm-agent 2>/dev/null || true"
    when: proxysql_auth_plugin | length > 0 or proxysql_hash_passwords | bool

  - name: Start pmm-agent (non-systemd fallback)
    shell: >
      docker exec -d {{ pxc_container }} bash -c
      "pgrep -x pmm-agent >/dev/null ||
       pmm-agent --config-file=/usr/local/percona/pmm/config/pmm-agent.yaml
       >> /var/log/pmm-agent.log 2>&1"
    when: proxysql_auth_plugin | length > 0 or proxysql_hash_passwords | bool

  - name: Wait for pmm-agent to reconnect
    pause:
      seconds: 20
    when: proxysql_auth_plugin | length > 0 or proxysql_hash_passwords | bool

  - name: Execute Service, Sysbench Script inside the PXC pxc_container
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} bash -xe ./client_container_proxysql_setup.sh  > setup_proxy_{{ pxc_version }}.log

  # Report whether proxysql_exporter authenticated (K8SPXC-1830 shows up here as
  # "unexpected resp from server for caching_sha2_password, perform full authentication").
  - name: Check proxysql_exporter status
    shell: >
      docker exec {{ pxc_container }} bash -c
      "sleep 15;
       echo '== proxysql auth plugin ==';
       mysql -h127.0.0.1 -P6032 -uadmin -padmin -Nse \"SELECT variable_name, variable_value FROM global_variables WHERE variable_name LIKE '%authentication_plugin%';\" 2>/dev/null;
       echo '== pmm-admin list ==';
       pmm-admin list | grep -i proxysql;
       echo '== proxysql_up metric (1=exporter authenticated) ==';
       PORT=\$(pmm-admin list | awk '/proxysql_exporter/{print \$NF}');
       curl -s http://127.0.0.1:\$PORT/metrics 2>/dev/null | grep -E '^proxysql_up' || echo 'NO proxysql_up METRIC';
       echo '== agent log (caching_sha2 / full authentication) ==';
       for f in /var/log/pmm-agent.log /usr/local/percona/pmm/pmm-agent.log; do
         [ -f \$f ] && grep -iE 'proxysql_exporter|caching_sha2|full authentication' \$f | tail -20;
       done;
       journalctl -u pmm-agent --no-pager 2>/dev/null | grep -iE 'proxysql_exporter|caching_sha2|full authentication' | tail -20 || true"
    register: proxysql_exporter_status
    changed_when: false
    ignore_errors: true

  - name: Show proxysql_exporter status
    debug:
      var: proxysql_exporter_status.stdout_lines

  - name: Show configured ProxySQL auth plugin
    debug:
      var: proxysql_auth_plugin
