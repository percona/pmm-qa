# This playbook does following:
#   enables Percona testing repository

- hosts: all
  vars:
    pxc_version: "{{ lookup('vars', 'extra_pxc_version', default=lookup('env','PXC_VERSION') | default('8.0', true) ) }}"
    proxysql_version: "{{ lookup('vars', 'extra_proxysql_version', default=lookup('env','PROXYSQL_VERSION') | default('2', true) ) }}"
    proxysql_package: "{{ lookup('vars', 'extra_proxysql_package', default=lookup('env','PROXYSQL_PACKAGE') | default('', true) ) }}"
    pxc_container: "{{ lookup('vars', 'extra_pxc_container', default=lookup('env','PXC_CONTAINER') | default('pxc_container', true) ) }}"
    pmm_server_ip: "{{ lookup('vars', 'extra_pmm_server_ip', default=lookup('env','PMM_SERVER_IP') | default('host.docker.internal', true) ) }}"
    client_version: "{{ lookup('vars', 'extra_client_version', default=lookup('env','CLIENT_VERSION') | default('latest-tarball', true) ) }}"
    admin_password: "{{ lookup('vars', 'extra_admin_password', default=lookup('env','ADMIN_PASSWORD') | default('admin', true) ) }}"
    pmm_qa_branch: "{{ lookup('vars', 'extra_pmm_qa_branch', default=lookup('env','PMM_QA_GIT_BRANCH') | default('main', true) ) }}"
    number_of_nodes: "{{ lookup('vars', 'extra_number_of_nodes', default=lookup('env','PXC_NODES') | default('3', true) ) }}"
    pxc_dev_cluster: "{{ lookup('vars', 'extra_pxc_cluster_name', default=lookup('env','PXC_CLUSTER_NAME') | default('pxc-dev-cluster', true) ) }}"
    query_source: "{{ lookup('vars', 'extra_query_source', default=lookup('env','QUERY_SOURCE') | default('perfschema', true) ) }}"
    debug_client: "{{ lookup('env', 'CLIENT_DEBUG') | default(false, true) | bool }}"
    shard_node_name: "{{ pxc_container }}{{ ('-' ~ lookup('env', 'SHARD_NAME')) if lookup('env', 'SHARD_NAME') else '' }}"
    pxc_repo: "{{ {'5.7': 'pxc-57', '8.0': 'pxc-80', '8.4': 'pxc-84-lts', '9.7': 'pxc-97-lts'}[pxc_version] | default('pxc-80') }}"

  tasks:
  - name: cleanup container for client and DB setup
    shell: >
      docker ps -a --filter "name={{ pxc_container }}" | grep -q . && docker stop {{ pxc_container }} && docker rm -fv {{ pxc_container }}
    ignore_errors: true
    tags:
      - cleanup

  - name: Create pmm-qa network if not exist
    shell: docker network create pmm-qa
    ignore_errors: true

  - name: Fail early when 5.7 is requested on arm64 (no arm64 build exists)
    fail:
      msg: "PXC 5.7 has no arm64 build; use 8.0 or newer on {{ ansible_architecture }}."
    when: pxc_version == "5.7" and ansible_architecture not in ['x86_64', 'amd64']

  - name: Prepare Container for PXC and Proxysql
    shell: >
      docker run -d --name={{ pxc_container }}
      -p 6033:6033
      phusion/baseimage:jammy-1.0.5

  - name: Copy all required Artifacts to the docker pxc_container
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} mkdir -p artifacts
      - docker cp ./client_container_pxc_setup.sh {{ pxc_container }}:/
      - docker cp ./client_container_proxysql_setup.sh {{ pxc_container }}:/
      - docker cp ./client_container_proxysql_upstream_setup.sh {{ pxc_container }}:/
      - docker cp ./pmm3-client-setup.sh {{ pxc_container }}:/

  - name: Get ProxySQL Product package URL based on the version
    shell: cat product_version_download_helper | grep proxysql | grep "# {{ proxysql_version }}" | head -1 | awk -F'# ' '{print $3}'
    register: package
    when: lookup('env', 'PROXYSQL_PACKAGE') == ''

  - name: Set ProxySQL Product URL if environment or paramater are not defined
    set_fact:
      proxysql_package: "{{package.stdout | default(proxysql_package,true)}}"

  - name: Use the arm64 ProxySQL package on arm64 hosts
    set_fact:
      proxysql_package: "{{ proxysql_package | regex_replace('/x86_64/', '/aarch64/') | regex_replace('_amd64\\.deb$', '_arm64.deb') }}"
    when: ansible_architecture not in ['x86_64', 'amd64']

  - name: Get filename from URL for ProxySQL
    shell: basename {{ proxysql_package }}
    register: file_name

  - name: Configure apt inside the container
    include_tasks: ./tasks/configure_container_apt.yml
    vars:
      container_name: "{{ pxc_container }}"

  - name: Install base packages and ProxySQL inside the PXC pxc_container
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} apt-get update
      - docker exec {{ pxc_container }} apt-get -y install wget curl git gnupg2 lsb-release debconf-utils
      - docker exec {{ pxc_container }} apt-get -y install libaio1 libaio-dev libnuma-dev socat
      - docker exec {{ pxc_container }} adduser --disabled-password --gecos "" pxc
      - docker exec {{ pxc_container }} wget {{ proxysql_package }}
      - docker exec {{ pxc_container }} dpkg -i {{ file_name.stdout }}
      - docker exec {{ pxc_container }} apt install -y sysbench

  - name: Install Percona XtraDB Cluster packages from the percona repository
    shell: "{{ item }}"
    with_items:
      - >-
        docker exec {{ pxc_container }} bash -c 'curl -Lf --retry 5 --retry-delay 5
        -o /tmp/percona-release.deb https://repo.percona.com/apt/percona-release_latest.generic_all.deb
        && (dpkg -i /tmp/percona-release.deb || apt-get -y -f install)'
      - docker exec {{ pxc_container }} percona-release enable-only {{ pxc_repo }} release
      - docker exec {{ pxc_container }} apt-get update
      - >-
        docker exec {{ pxc_container }} env DEBIAN_FRONTEND=noninteractive apt-get -y install
        percona-xtradb-cluster-server percona-xtradb-cluster-client
        percona-xtradb-cluster-common percona-xtradb-cluster-test
      # The packaged mysqld carries an apparmor profile that confines it to
      # /var/lib/mysql; the multi-node setup runs several mysqld under /home/pxc,
      # so drop the profile where apparmor is present (a no-op in most containers).
      - >-
        docker exec {{ pxc_container }} bash -c 'if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then
        mkdir -p /etc/apparmor.d/disable
        && ln -sf /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/disable/
        && (apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld 2>/dev/null || true); fi; true'

  - name: Install pmm-client on the pxc_container
    shell: "{{ item }}"
    with_items:
      - docker network connect pmm-qa {{ pxc_container }}
      - >-
        docker exec {{ pxc_container }} bash -x ./pmm3-client-setup.sh --pmm_server_ip {{ pmm_server_ip }} --client_version {{ client_version }} --admin_password {{ admin_password }}{{ (debug_client |
        default(false) | bool) | ternary(' --debug', '') }} --use_metrics_mode no

  - name: Configure PXC for PMM Client if non-tarball install
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} usermod -aG pmm-agent pxc
    when: "'http' not in client_version"

  - name: Execute Setup script inside the PXC pxc_container
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} chmod 1777 /tmp
      - >-
        docker exec --user pxc {{ pxc_container }} bash -xe ./client_container_pxc_setup.sh --pxc_version {{ pxc_version }} --number_of_nodes {{ number_of_nodes }}
        --pxc_dev_cluster {{ pxc_dev_cluster }} --query_source {{query_source}}

  - name: Set Random Number Fact
    set_fact:
      random_number: "{{ (10000 | random) | int }}"

  - name: Start Percona ProxySQL inside the PXC extra_pxc_container
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} bash -c 'sed -i s#3306#'"\$(grep 'port' /home/pxc/PXC/node1.cnf | cut -d= -f2)"'# /etc/proxysql.cnf'
      - docker exec {{ pxc_container }} proxysql -c /etc/proxysql.cnf
      - docker exec {{ pxc_container }} sleep 20
      - docker exec {{ pxc_container }} bash -c 'sed -i s#3306#'"\$(grep 'port' /home/pxc/PXC/node1.cnf | cut -d= -f2)"'# /etc/proxysql-admin.cnf'
      - docker exec {{ pxc_container }} proxysql-admin --config-file=/etc/proxysql-admin.cnf --enable
      - docker exec {{ pxc_container }} sleep 20
      - docker exec {{ pxc_container }} mysql -h 127.0.0.1 -P 6032 -u admin -padmin -e "SET admin-stats_credentials='read_user:read_user';"
      - docker exec {{ pxc_container }} mysql -h 127.0.0.1 -P 6032 -u admin -padmin -e "LOAD ADMIN VARIABLES TO RUNTIME;"
      - docker exec {{ pxc_container }} mysql -h 127.0.0.1 -P 6032 -u admin -padmin -e "SAVE ADMIN VARIABLES TO DISK;"
      - docker exec {{ pxc_container }} pmm-admin add proxysql --username=admin --password=admin --service-name=my-new-proxysql_{{ pxc_container }}_{{ random_number }} --host=127.0.0.1 --port=6032
    register: proxysql_start
    when: pxc_version is version('8.4', '<')
    # The proxysql2 package's postinst can auto-start the daemon during
    # install (observed non-deterministically), so the explicit `proxysql -c
    # ...` start above sometimes finds it already running -- that is the
    # desired end state, not a failure. Any other non-zero exit in this loop
    # still fails the play.
    failed_when: >-
      proxysql_start.rc != 0 and
      'Daemon already running' not in (proxysql_start.stderr | default(''))

  - name: Start upstream ProxySQL inside the PXC extra_pxc_container
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} proxysql -c /etc/proxysql.cnf
      - docker exec --user pxc {{ pxc_container }} bash -xe ./client_container_proxysql_upstream_setup.sh {{ number_of_nodes }}
      - docker exec {{ pxc_container }} pmm-admin add proxysql --username=admin --password=admin --service-name=my-new-proxysql_{{ pxc_container }}_{{ random_number }} --host=127.0.0.1 --port=6032
    when: pxc_version is version('8.4', '>=')

  - name: Execute Service, Sysbench Script inside the PXC pxc_container
    shell: "{{ item }}"
    with_items:
      - docker exec {{ pxc_container }} bash -xe ./client_container_proxysql_setup.sh
