---
# Stage one verified pmm-client package from the host cache into a container,
# so pmm3-client-setup.sh installs it instead of every container downloading
# the same 180 MB from repo.percona.com. Best effort: on any failure the
# container downloads it itself, as before.
# Requires: container_name, client_version.
- name: Stage the pmm-client package for {{ container_name }}
  vars:
    component: >-
      {{ 'experimental' if client_version == '3-dev-latest'
         else 'testing' if client_version == 'pmm3-rc'
         else 'main' if client_version == 'pmm3-latest' or client_version is match('^3\.[0-9]+\.[0-9]+$')
         else '' }}
    pinned_version: "{{ client_version if client_version is match('^3\\.[0-9]+\\.[0-9]+$') else '' }}"
    fetcher: "{{ ([playbook_dir ~ '/scripts', playbook_dir ~ '/../scripts'] | select('exists') | first | default('')) ~ '/fetch-pmm-client-deb.sh' }}"
  when: component | length > 0
  block:
    - name: Read {{ container_name }}'s distro codename
      shell: docker exec {{ container_name }} sh -c 'command -v dpkg >/dev/null && . /etc/os-release && echo "$VERSION_CODENAME"'
      register: stage_codename
      changed_when: false
      failed_when: false

    - name: Fetch and verify the package on the host
      shell: >
        {{ fetcher | quote }} {{ component | quote }} {{ stage_codename.stdout | trim | quote }}
        {{ pmm_client_cache_dir | default('/tmp/pmm-client-cache') | quote }} 900 {{ pinned_version | quote }}
      register: stage_deb
      changed_when: false
      when: stage_codename.stdout | trim | length > 0

    - name: Copy the package into {{ container_name }}
      shell: docker cp {{ stage_deb.stdout_lines[-1] | trim | quote }} {{ container_name }}:/pmm-client.deb
      when: stage_deb is not skipped
  rescue:
    - name: Leave the download to {{ container_name }}
      debug:
        msg: "Could not stage a cached pmm-client for {{ container_name }}; it downloads its own."
