- name: Debug variable backup
  debug:
    var: backup

# The community MySQL container is not provisioned from the Percona repo, so
# percona-release has to be added before XtraBackup can be pulled.
- name: Install percona-release
  shell: |
    docker exec --user root {{ container_name }} wget -q https://repo.percona.com/apt/percona-release_latest.generic_all.deb
    docker exec --user root {{ container_name }} dpkg -i ./percona-release_latest.generic_all.deb
  loop: "{{ range(1, nodes_count | int + 1) | list }}"

- name: Install percona xtrabackup 8.4
  shell: |
    docker exec --user root {{ container_name }} percona-release enable-only tools testing
    docker exec --user root {{ container_name }} apt-get update
    docker exec --user root {{ container_name }} apt-get install -y percona-xtrabackup-84 qpress
  when: mysql_version | replace('_', '') | int == 84
  loop: "{{ range(1, nodes_count | int + 1) | list }}"

- name: Install percona xtrabackup 8.0
  shell: |
    docker exec --user root {{ container_name }} percona-release enable-only tools testing
    docker exec --user root {{ container_name }} apt-get update
    docker exec --user root {{ container_name }} apt-get install -y percona-xtrabackup-80 qpress
  when: mysql_version | replace('_', '') | int == 80
  loop: "{{ range(1, nodes_count | int + 1) | list }}"

# XtraBackup for 9.x ships in its own pxb-<ver>-lts repo; qpress stays in tools.
- name: Install percona xtrabackup 9.x
  shell: |
    docker exec --user root {{ container_name }} percona-release enable-only tools testing
    docker exec --user root {{ container_name }} percona-release enable pxb-{{ mysql_version | replace('_', '') }}-lts release
    docker exec --user root {{ container_name }} apt-get update
    docker exec --user root {{ container_name }} apt-get install -y percona-xtrabackup-{{ mysql_version | replace('_', '') }} qpress
  when: mysql_version | replace('_', '') | int >= 90
  loop: "{{ range(1, nodes_count | int + 1) | list }}"

- name: Install minio for S3 compatible buckets
  include_tasks: ../tasks/setup_minio_container.yml
