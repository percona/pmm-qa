# Test harness for the diff-auth PSMDB stack, kept out of docker-compose-pmm-psmdb.yml
# on purpose: `docker compose ... up -d` must never create the fixed-name "test"
# container (its global name clashes with the other PSMDB stacks running in
# parallel). This file is merged in ONLY for the test run, and only when
# TESTS=yes, via:
#   docker compose -f docker-compose-pmm-psmdb.yml -f docker-compose-test.yml \
#     --profile tests run --rm test pytest ...
services:
  test:
    profiles: ["tests"]
    container_name: test
    hostname: test
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    build:
      dockerfile: ../pmm_psmdb-pbm_setup/Dockerfile-testinfra
      context: .
    volumes:
      - ./test:/test
      - /var/run/docker.sock:/var/run/docker.sock:ro
