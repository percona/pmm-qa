# Compose override for MicroVM / environments without systemd as PID 1.
# Base config lives in qa-integration/pmm_psmdb-pbm_setup (PMM_QA_PSMDB_ROOT).
# No-systemd helpers live in this directory (PMM_QA_PSMDB_MICROVM_ROOT).
services:
  rs101:
    privileged: false
    cgroup: ~
    volumes: !override
      - ${PMM_QA_PSMDB_ROOT}/conf/pbm:/etc/pbm
      - ${MONGOD_RS_CONFIG_DIR:-${PMM_QA_PSMDB_ROOT}/conf/mongod-rs}:/etc/mongod
      - ${PMM_QA_PSMDB_ROOT}/conf/datagen:/etc/datagen:ro
      - /tmp/backup_data:/tmp/backup_data:rw
      - keytabs:/keytabs
      - ${PMM_QA_PSMDB_MICROVM_ROOT}/entrypoint-no-systemd.sh:/entrypoint-no-systemd.sh:ro
      - ${PMM_QA_PSMDB_MICROVM_ROOT}/scripts/systemctl-shim.sh:/usr/local/bin/systemctl:ro
    entrypoint: bash /entrypoint-no-systemd.sh run

  rs102:
    privileged: false
