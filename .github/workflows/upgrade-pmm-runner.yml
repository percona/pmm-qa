name: PMM Upgrade runner

on:
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'PMM Server docker tag to upgrade from'
        default: ''
        type: string
      version:
        description: 'PMM version to upgrade from (3.x.x or pmm3-rc)'
        default: ''
        type: string
      upgrade_tag:
        description: 'PMM Server docker tag to upgrade to'
        default: 'perconalab/pmm-server:3-dev-latest'
        type: string
      pre_upgrade_version:
        description: 'Expected PMM version before upgrade'
        default: ''
        type: string
      upgrade_version:
        description: 'Expected PMM version after upgrade'
        default: ''
        type: string
      upgrade_type:
        description: "Type of upgrade Docker or UI"
        required: true
        default: "docker"
        type: choice
        options:
          - docker
          - ui
      client_tarball_upgrade:
        description: 'Client tarball URL to upgrade to (empty = use repo)'
        default: ''
        type: string
      pmm_qa_branch:
        description: 'pmm-qa branch'
        default: 'main'
        type: string
  workflow_call:
    inputs:
      docker_tag:
        description: 'PMM Server docker tag to upgrade from'
        type: string
        required: true
      version:
        description: 'PMM version to upgrade from (3.x.x or pmm3-rc)'
        type: string
        required: true
      upgrade_tag:
        description: 'PMM Server docker tag to upgrade to'
        type: string
        required: true
      pre_upgrade_version:
        description: 'Expected PMM version before upgrade'
        type: string
        required: true
      upgrade_version:
        description: 'Expected PMM version after upgrade'
        type: string
        required: true
      upgrade_type:
        description: "Type of upgrade Docker or UI"
        required: true
        type: string
      client_tarball_upgrade:
        description: 'Client tarball URL to upgrade to (empty = use repo)'
        default: ''
        type: string
      pmm_qa_branch:
        description: 'pmm-qa branch'
        default: 'main'
        type: string

env:
  ADMIN_PASSWORD: admin
  PMM_URL: http://admin:admin@127.0.0.1
  CLIENT_TARBALL_UPGRADE: ${{ inputs.client_tarball_upgrade || '' }}
  PMM_QA_BRANCH: ${{ inputs.pmm_qa_branch || 'main' }}
  DOCKER_TAG: ${{ inputs.docker_tag }}
  FROM_VERSION: ${{ inputs.version }}
  PRE_UPGRADE_VERSION: ${{ inputs.pre_upgrade_version }}
  UPGRADE_TAG: ${{ inputs.upgrade_tag }}
  UPGRADE_TYPE: ${{ inputs.upgrade_type }}
  UPGRADE_VERSION: ${{ inputs.upgrade_version }}

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve PMM client source
        id: resolve
        shell: bash
        run: |
          echo "$DOCKER_TAG"
          echo "$FROM_VERSION"
          echo "$UPGRADE_TAG"
          echo "$UPGRADE_VERSION"
          echo "$PMM_QA_BRANCH"
          echo "$PRE_UPGRADE_VERSION"
          # 1. all X.Y.Z versions available in the apt pool
          apt_versions=$(curl -s "https://repo.percona.com/pmm3-client/apt/pool/main/p/pmm-client/" \
            | grep -oE 'pmm-client_[0-9]+\.[0-9]+\.[0-9]+' \
            | sed -E 's/pmm-client_//' | sort -Vu)

          echo "apt versions available:"
          echo "$apt_versions"

          # 2. is the requested version installable via apt?
          if grep -qx "$FROM_VERSION" <<< "$apt_versions"; then
            echo "$FROM_VERSION is available in apt — leaving inputs.version unchanged"
            TARBALL_URL="$FROM_VERSION"
          elif [ "$FROM_VERSION" == "pmm3-rc" ]; then
            echo "pmm3-rc is a special dev tag and version: $PRE_UPGRADE_VERSION"
            TARBALL_URL="pmm3-rc"
          else
            echo "$FROM_VERSION not in apt — building tarball URL"
            TARBALL_URL="https://downloads.percona.com/downloads/pmm3/$FROM_VERSION/binary/tarball/pmm-client-$FROM_VERSION-x86_64.tar.gz"

            # verify it exists before committing to it
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$TARBALL_URL")
            if [ "$code" != "200" ]; then
              echo "ERROR: $FROM_VERSION missing from apt AND tarball not found (HTTP $code): url: ${TARBALL_URL}"
              exit 1
            fi
          fi

          echo "CLIENT_INSTALL_VERSION=$TARBALL_URL" >> "$GITHUB_ENV"
          echo "PRE_UPGRADE_BRANCH=pmm-$FROM_VERSION" >> "$GITHUB_ENV"
          
          echo "CLIENT_INSTALL_VERSION set to: $TARBALL_URL"

      - name: Checkout pmm-qa
        uses: actions/checkout@v4
        with:
          repository: percona/pmm-qa
          ref: ${{ env.PMM_QA_BRANCH }}
          path: pmm-qa
      - name: Start PMM Server (old image)
        run: |
          docker network create pmm-qa || true
          docker volume create pmm-volume
          if [[ "$UPGRADE_TYPE" == "ui" ]]; then
            docker run --detach --restart always \
              --network="pmm-qa" \
              -e WATCHTOWER_DEBUG=1 \
              -e WATCHTOWER_HTTP_API_TOKEN=testUpgradeToken \
              -e WATCHTOWER_HTTP_API_UPDATE=1 \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --name watchtower \
              perconalab/watchtower:dev-latest
          
            docker run --detach --restart always --network pmm-qa \
              -e PMM_ENABLE_UPDATES=1 -e PMM_ENABLE_INTERNAL_PG_QAN=1 \
              --publish 80:8080 --publish 443:8443 \
              -e PMM_ENABLE_TELEMETRY=0 \
              -e PMM_DEV_UPDATE_DOCKER_IMAGE="$UPGRADE_TAG" \
              -e PMM_WATCHTOWER_HOST=http://watchtower:8080 \
              -e PMM_WATCHTOWER_TOKEN=testUpgradeToken \
              -e GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION=true \
              --volume pmm-volume:/srv --name pmm-server "$DOCKER_TAG"
          else
            docker run --detach --restart always --network pmm-qa \
              -e PMM_ENABLE_UPDATES=1 -e PMM_ENABLE_INTERNAL_PG_QAN=1 \
              --publish 80:8080 --publish 443:8443 \
              -e PMM_ENABLE_TELEMETRY=0 \
              -e GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION=true \
              --volume pmm-volume:/srv --name pmm-server "$DOCKER_TAG"
          fi

          # shellcheck disable=SC2016 # PMM_URL expands in the inner bash from the step env
          timeout 200 bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" "$PMM_URL/v1/server/readyz")" = 200 ]; do sleep 5; done'

      - name: Cleanup disk space on a worker according to https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Setup databases + clients
        working-directory: pmm-qa/qa-integration/pmm_qa
        run: |
          echo "$CLIENT_INSTALL_VERSION"
          mkdir -p /tmp/backup_data
          chmod 777 /tmp/backup_data
          ./pmm-framework/pmm-framework --parallel \
            --client-version="$CLIENT_INSTALL_VERSION" \
            --pmm-server-password="$ADMIN_PASSWORD" \
            --database pgsql --database ps=8.4 --database psmdb,SETUP_TYPE=sharding --database ssl_psmdb,MINIO=false --database external

      - name: Setup custom queries
        run: |
          PS=$(docker ps -a --format '{{.Names}}' | grep ps_pmm)
          PG=$(docker ps -a --format '{{.Names}}' | grep pgsql_pg)
          COLLECTORS=/usr/local/percona/pmm/collectors
          
          git clone --depth 1 https://github.com/Percona-Lab/pmm-custom-queries
          ls
          docker cp pmm-custom-queries/mysql/.      "$PS:$COLLECTORS/custom-queries/mysql/high-resolution/"
          docker cp pmm-custom-queries/postgresql/. "$PG:$COLLECTORS/custom-queries/postgresql/high-resolution/"
          
          echo 'node_role{role="my_monitored_server_1"} 1' > node_role.prom
          docker cp node_role.prom "$PG:$COLLECTORS/textfile-collector/high-resolution/"
          
          # exporters reload their collectors on restart; pmm-agent respawns them
          docker exec -u root "$PS" pkill -f mysqld_exporter
          docker exec "$PG" pkill -f postgres_exporter
          docker exec "$PG" pkill -f node_exporter
          sleep 5
          docker exec "$PG" ls "$COLLECTORS/custom-queries/postgresql/high-resolution/"
          docker exec "$PS" ls "$COLLECTORS/custom-queries/mysql/high-resolution/"

      - name: Check packages before upgrade
        run: |
          V=$(curl -s --user admin:admin "$PMM_URL/v1/server/version" | jq -r .version | awk -F- '{print $1}')
          python3 pmm-qa/support_scripts/check_upgrade.py -v "$V" -p pre

      - name: Checkout pre upgrade branch
        working-directory: pmm-qa
        run: |
          if [[ "$CLIENT_INSTALL_VERSION" == "pmm3-rc" ]]; then
            git fetch origin "$PMM_QA_BRANCH"
            git checkout FETCH_HEAD
          else
            git fetch origin "$PRE_UPGRADE_BRANCH"
            git checkout FETCH_HEAD
          fi


      - name: Prepare dependencies before upgrade
        working-directory: pmm-qa/e2e_tests
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Pre-upgrade UI tests
        working-directory: pmm-qa/e2e_tests
        env:
          CLIENT_VERSION: ${{ inputs.pre_upgrade_version }}
        run: |
          npx playwright test --grep "@pre-upgrade"

      - name: Docker upgrade (swap server image, keep volume)
        if: ${{ inputs.upgrade_type == 'docker' }}
        run: |
          docker stop pmm-server
          docker pull "$UPGRADE_TAG"
          docker rename pmm-server pmm-server-old
          docker run --detach --restart always --network pmm-qa \
            -e PMM_ENABLE_UPDATES=1 -e PMM_ENABLE_INTERNAL_PG_QAN=1 \
            -e PMM_ENABLE_TELEMETRY=0 \
            -e GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION=true \
            --publish 80:8080 --publish 443:8443 \
            --volumes-from pmm-server-old --name pmm-server "$UPGRADE_TAG"
          # shellcheck disable=SC2016 # PMM_URL expands in the inner bash from the step env
          timeout 200 bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" "$PMM_URL/v1/server/readyz")" = 200 ]; do sleep 5; done'

      - name: UI Upgrade
        if: ${{ inputs.upgrade_type == 'ui' }}
        working-directory: pmm-qa/e2e_tests
        env:
          PMM_SERVER_LATEST: ${{ inputs.upgrade_version }}
        run: |
          npx playwright test --grep "@pmm-upgrade"

      - name: Checkout upgrade branch
        working-directory: pmm-qa
        run: |
          git fetch origin "$PMM_QA_BRANCH"
          git checkout FETCH_HEAD

      - name: Prepare dependencies for upgrade branch
        working-directory: pmm-qa/e2e_tests
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Post-server-upgrade UI tests
        working-directory: pmm-qa/e2e_tests
        env:
          PMM_SERVER_LATEST: ${{ inputs.upgrade_version }}
        run: |
          echo "Latest PMM Version is: $PMM_SERVER_LATEST"
          npx playwright test --grep "@post-server-upgrade"

      - name: Upgrade PMM client in every client container to show logs only if error occurs
        env:
          LATEST_VERSION: ${{ inputs.upgrade_version }}
        run: pmm-qa/support_scripts/upgrade_clients.sh "$LATEST_VERSION"

      - name: Post-client-upgrade UI tests
        working-directory: pmm-qa/e2e_tests
        env:
          PMM_SERVER_LATEST: ${{ inputs.upgrade_version }}
        run: |
          echo "Latest PMM Version is: $PMM_SERVER_LATEST"
          npx playwright test --grep "@post-upgrade|@rta"

      - name: Check packages after upgrade
        run: |
          V=$(curl -s --user admin:admin "$PMM_URL/v1/server/version" | jq -r .version | awk -F- '{print $1}')
          python3 pmm-qa/support_scripts/check_upgrade.py -v "$V" -p post

      - name: Collect logs
        if: always()
        run: |
          curl --insecure "$PMM_URL/logs.zip" --output logs.zip || true
          docker cp pmm-server:/srv/logs srv-logs || true
          tar -zcf srv-logs.tar.gz srv-logs || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-logs-${{ inputs.upgrade_type }}-${{ inputs.version }}
          path: |
            logs.zip
            srv-logs.tar.gz
            pmm-qa/e2e_tests/playwright-report
            pmm-qa/e2e_tests/logs
            pmm-qa/e2e_tests/screenshots
            pmm-qa/e2e_tests/test-results
