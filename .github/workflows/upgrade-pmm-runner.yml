name: PMM Upgrade runner

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/upgrade-pmm-runner.yml'
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'PMM Server image to start from (old)'
        default: 'percona/pmm-server:3.0.0'
        type: string
      docker_tag_upgrade:
        description: 'PMM Server image to upgrade to (new)'
        default: 'perconalab/pmm-server:3-dev-latest'
        required: true
        type: string
      client_version:
        description: 'PMM Client version to start with (x.y.z | 3-dev-latest | pmm3-rc | https...tar.gz)'
        default: 'latest-tarball'
        type: string
      pmm_server_latest:
        description: 'Expected version after upgrade (for check_client_upgrade.py)'
        required: true
        type: string
      client_repository:
        description: 'pmm3-client repo channel for client upgrade'
        default: 'release'
        type: choice
        options: [experimental, testing, release]
      client_tarball_upgrade:
        description: 'Client tarball URL to upgrade to (empty = use repo)'
        default: ''
        type: string
      pmm_qa_branch:
        description: 'pmm-qa branch'
        default: 'main'
        type: string
      pre_upgrade_branch:
        description: 'Branch for pmm-qa repo to run tests before upgrade'
        type: string
      upgrade_type:
        description: 'PMM Upgrade type'
        default: 'docker'
        type: choice
        options: [ docker, UI ]

env:
  ADMIN_PASSWORD: admin
  PMM_URL: http://admin:admin@127.0.0.1
  DOCKER_TAG: ${{ inputs.docker_tag || 'percona/pmm-server:3.0.0' }}
  DOCKER_TAG_UPGRADE: ${{ inputs.docker_tag_upgrade || 'perconalab/pmm-server:3-dev-latest' }}
  CLIENT_VERSION: ${{ inputs.client_version || 'latest-tarball' }}
  PMM_SERVER_LATEST: ${{ inputs.pmm_server_latest || '3-dev-latest' }}
  CLIENT_REPOSITORY: ${{ inputs.client_repository || 'release' }}
  CLIENT_TARBALL_UPGRADE: ${{ inputs.client_tarball_upgrade || '' }}
  PMM_QA_BRANCH: ${{ inputs.pmm_qa_branch || 'main' }}
  PRE_UPGRADE_BRANCH: ${{ inputs.pre_upgrade_branch || format('pmm-{0}', inputs.client_version) }}
  UPGRADE_TYPE: ${{ inputs.upgrade_type || 'docker' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
    steps:
      - name: Compute latest 5 minor versions
        id: set
        shell: bash
        run: |
          VERSIONS=$(curl -s "https://hub.docker.com/v2/repositories/percona/pmm-server/tags?page_size=100" \
            | jq -r '.results[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            | sed -E 's/\.[0-9]+$//' \
            | sort -Vru \
            | head -5 \
            | sed 's/$/.0/' \
            | jq -R . | jq -sc .)
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
          echo "Matrix versions: $VERSIONS"
  upgrade:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}
    steps:
      - name: Checkout pmm-qa
        uses: actions/checkout@v4
        with:
          repository: percona/pmm-qa
          ref: ${{ env.PMM_QA_BRANCH }}
          path: pmm-qa
      - name: Get PMM Versions
        run: |
          FLOOR=$(curl -s "https://hub.docker.com/v2/repositories/percona/pmm-server/tags?page_size=100" \
            | jq -r '.results[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            | sed -E 's/\.[0-9]+$//' \
            | sort -Vru \
            | sed -n '5p' \
            | sed 's/$/.0/')
          echo "FLOOR=$FLOOR"
          curl -s "https://hub.docker.com/v2/repositories/percona/pmm-server/tags?page_size=100" \
            | jq -r '.results[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            | sort -Vr \
            | awk -v floor="$FLOOR" '{print} $0==floor{exit}'
      - name: Resolve PMM client source
        shell: bash
        run: |
          # 1. all X.Y.Z versions available in the apt pool
          apt_versions=$(curl -s "https://repo.percona.com/pmm3-client/apt/pool/main/p/pmm-client/" \
            | grep -oE 'pmm-client_[0-9]+\.[0-9]+\.[0-9]+' \
            | sed -E 's/pmm-client_//' | sort -Vu)

          echo "apt versions available:"
          echo "$apt_versions"

          # 2. is the requested version installable via apt?
          if grep -qx "$CLIENT_VERSION" <<< "$apt_versions"; then
            echo "$CLIENT_VERSION is available in apt — leaving CLIENT_VERSION unchanged"
          else
            echo "$CLIENT_VERSION not in apt — building tarball URL"
            TARBALL_URL="https://downloads.percona.com/downloads/pmm3/${CLIENT_VERSION}/binary/tarball/pmm-client-${CLIENT_VERSION}-x86_64.tar.gz"

            # verify it exists before committing to it
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$TARBALL_URL")
            if [ "$code" != "200" ]; then
              echo "ERROR: $CLIENT_VERSION missing from apt AND tarball not found (HTTP $code)"
              exit 1
            fi

            # 3. assign the URL to CLIENT_VERSION for later steps
            echo "CLIENT_VERSION=$TARBALL_URL" >> "$GITHUB_ENV"
            echo "CLIENT_VERSION reassigned to: $TARBALL_URL"
          fi
      - name: Start PMM Server (old image)
        run: |
          docker network create pmm-qa || true
          docker volume create pmm-volume
          docker run --detach --restart always --network pmm-qa \
            -e PMM_ENABLE_UPDATES=1 -e PMM_ENABLE_INTERNAL_PG_QAN=1 \
            --publish 80:8080 --publish 443:8443 \
            --volume pmm-volume:/srv --name pmm-server "$DOCKER_TAG"
          timeout 200 bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" "$PMM_URL/v1/server/readyz")" = 200 ]; do sleep 5; done'
          # TODO: watchtower + platform-dev env vars only needed for UI-triggered updates.

      - name: Cleanup disk space on a worker according to https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Setup npm modules for e2e tests
        working-directory: pmm-qa/codeceptjs-e2e
        run: |
          npm ci
          npx playwright install --with-deps
          envsubst < env.list > env.generated.list

      - name: Setup databases + clients
        working-directory: pmm-qa/qa-integration/pmm_qa
        run: |
          mkdir -m 777 -p /tmp/backup_data
          ./pmm-framework/pmm-framework --parallel \
            --client-version="$CLIENT_VERSION" \
            --pmm-server-password="$ADMIN_PASSWORD" \
            --database pgsql --database ps=8.4 --database psmdb,SETUP_TYPE=sharding --database ssl_psmdb,MINIO=false --database external

      - name: Setup custom queries
        run: |
          PS=$(docker ps -a --format '{{.Names}}' | grep ps_pmm)
          PG=$(docker ps -a --format '{{.Names}}' | grep pgsql_pg)
          COLLECTORS=/usr/local/percona/pmm/collectors
          
          git clone --depth 1 https://github.com/Percona-Lab/pmm-custom-queries
          ls
          docker cp pmm-custom-queries/mysql/.      "$PS:$COLLECTORS/custom-queries/mysql/high-resolution/"
          docker cp pmm-custom-queries/postgresql/. "$PG:$COLLECTORS/custom-queries/postgresql/high-resolution/"
          
          echo 'node_role{role="my_monitored_server_1"} 1' > node_role.prom
          docker cp node_role.prom "$PG:$COLLECTORS/textfile-collector/high-resolution/"
          
          # exporters reload their collectors on restart; pmm-agent respawns them
          docker exec -u root "$PS" pkill -f mysqld_exporter
          docker exec "$PG" pkill -f postgres_exporter
          docker exec "$PG" pkill -f node_exporter
          sleep 5
          ls -la
          echo $PS
          echo $PG
          docker exec $PG ls $COLLECTORS/custom-queries/postgresql/high-resolution/
          docker exec $PS ls $COLLECTORS/custom-queries/postgresql/high-resolution/

      - name: Check packages before upgrade
        run: |
          V=$(curl -s --user admin:admin "$PMM_URL/v1/server/version" | jq -r .version | awk -F- '{print $1}')
          python3 pmm-qa/support_scripts/check_upgrade.py -v "$V" -p pre

      - name: Checkout pre upgrade branch
        working-directory: pmm-qa
        run: |
          git fetch origin $PRE_UPGRADE_BRANCH
          git checkout FETCH_HEAD

      - name: Prepare dependencies before upgrade
        working-directory: pmm-qa/e2e_tests
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Pre-upgrade UI tests
        working-directory: pmm-qa/e2e_tests
        run: |
          npx playwright test --grep "@pre-upgrade"

      - name: Checkout upgrade branch
        working-directory: pmm-qa
        run: |
          git fetch origin "$PMM_QA_BRANCH"
          git checkout FETCH_HEAD

      - name: Docker upgrade (swap server image, keep volume)
        if: ${{ inputs.upgrade_type == 'docker' }}
        run: |
          docker stop pmm-server
          docker pull "$DOCKER_TAG_UPGRADE"
          docker rename pmm-server pmm-server-old
          docker run --detach --restart always --network pmm-qa \
            -e PMM_ENABLE_UPDATES=1 -e PMM_ENABLE_INTERNAL_PG_QAN=1 \
            --publish 80:8080 --publish 443:8443 \
            --volumes-from pmm-server-old --name pmm-server "$DOCKER_TAG_UPGRADE"
          timeout 200 bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" "$PMM_URL/v1/server/readyz")" = 200 ]; do sleep 5; done'

      - name: Post-server-upgrade UI tests
        working-directory: pmm-qa/e2e_tests
        run: npx playwright test --grep "@post-upgrade"

      - name: Upgrade PMM client in every client container to show logs only if error occurs
        run: |
          docker ps
          for c in $(docker ps --format '{{.Names}}' | grep -Ev '^(pmm-server|pmm-server-old|watchtower|ldap-server|kerberos)$'); do
            echo "== upgrading client in $c =="
            log=$(mktemp)
            set +e
            {
              if [ -n "$CLIENT_TARBALL_UPGRADE" ]; then
                docker exec "$c" sh -c 'command -v wget >/dev/null || (command -v dnf >/dev/null && dnf install -y wget || apt-get install -y wget)'
                docker exec "$c" wget -qO /pmm-client.tar.gz "$CLIENT_TARBALL_UPGRADE"
                docker exec "$c" sh -c 'cd / && tar -zxpf /pmm-client.tar.gz && d=$(ls -1td pmm-client*/ | head -n1) && rm -rf /usr/local/bin/pmm-client && mv -f "$d" /usr/local/bin/pmm-client && bash -x /usr/local/bin/pmm-client/install_tarball -u'
              else
                docker exec "$c" percona-release enable-only pmm3-client "$CLIENT_REPOSITORY"
                docker exec "$c" sh -c 'command -v apt >/dev/null && apt install -y pmm-client || dnf install -y pmm-client'
              fi
              docker exec "$c" sh -c 'systemctl restart pmm-agent 2>/dev/null || { pkill -x pmm-agent || true; nohup pmm-agent --config-file=/usr/local/percona/pmm/config/pmm-agent.yaml >/var/log/pmm-agent.log 2>&1 & }'
            } >"$log" 2>&1
            status=$?
            set -e
            if [ $status -ne 0 ]; then
              echo "!! upgrade failed in $c, showing logs:"
              cat "$log"
              rm -f "$log"
              exit $status
            fi
            echo "== upgrade succeeded in $c =="
            rm -f "$log"
          done

      - name: Check client after upgrade
        run: python3 pmm-qa/support_scripts/check_client_upgrade.py "$PMM_SERVER_LATEST"

      - name: Post-client-upgrade UI tests
        working-directory: pmm-qa/e2e_tests
        run: npx playwright test --grep "@post-upgrade|@rta"

      - name: Check packages after upgrade
        run: |
          V=$(curl -s --user admin:admin "$PMM_URL/v1/server/version" | jq -r .version | awk -F- '{print $1}')
          python3 pmm-qa/support_scripts/check_upgrade.py -v "$V" -p post

      - name: Collect logs
        if: always()
        run: |
          curl --insecure "$PMM_URL/logs.zip" --output logs.zip || true
          docker cp pmm-server:/srv/logs srv-logs || true
          tar -zcf srv-logs.tar.gz srv-logs || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-logs
          path: |
            logs.zip
            srv-logs.tar.gz
            pmm-qa/e2e_tests/playwright-report
            pmm-qa/e2e_tests/logs
            pmm-qa/e2e_tests/screenshots
            pmm-qa/e2e_tests/test-results
            pmm-qa/codeceptjs-e2e/tests/output/*.png
            pmm-qa/codeceptjs-e2e/tests/output/trace/*.zip
            pmm-qa/codeceptjs-e2e/logs