name: PMM_PSMDB_PBM_FULL

on:
  workflow_dispatch:
    inputs:
      pmm_qa_branch:
        description: 'Branch of PMM QA'
        default: 'main'
        required: false
        type: string
      pmm_client_version:
        description: 'PMM Client version string (e.g. pmm3-rc)'
        default: 'latest-tarball'
        required: false
        type: string
      pmm_server_image:
        description: 'PMM Server docker image'
        default: 'perconalab/pmm-server:3-dev-latest'
        required: false
        type: string

  workflow_call:
    inputs:
      pmm_qa_branch:
        required: false
        type: string
      pmm_client_version:
        required: false
        type: string
      pmm_server_image:
        required: false
        type: string

jobs:
  test:
    name: ${{ matrix.setup.name }} with PSMDB ${{ matrix.psmdb }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        psmdb: ['6.0', '7.0', '8.0', '8.3']
        setup:
          - name: Replica set
            database: psmdb
            tests: pbm
          - name: Sharded cluster
            database: psmdb
            options: ',SETUP_TYPE=sharding'
            tests: pbm
          - name: Auth
            database: ssl_psmdb
            tests: diffauth
    env:
      # The tests log in to PMM Server as admin:$ADMIN_PASSWORD.
      ADMIN_PASSWORD: password
      PMM_CLIENT_VERSION: ${{ inputs.pmm_client_version || 'latest-tarball' }}
      PMM_SERVER_IMAGE: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.pmm_qa_branch || 'main' }}

      - name: Start PMM Server
        working-directory: qa-integration/pmm_psmdb-pbm_setup
        run: |
          docker network create qa-integration
          docker compose -f docker-compose-pmm.yaml up -d pmm-server

      - name: Set up ${{ matrix.setup.name }}
        working-directory: qa-integration/pmm_qa/pmm-framework
        run: ./pmm-framework --client-version "$PMM_CLIENT_VERSION" --database "${{ matrix.setup.database }}=${{ matrix.psmdb }}${{ matrix.setup.options }}"

      - name: Set up bats
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/bats-core/bats-core.git /opt/bats
          sudo /opt/bats/install.sh /usr/local

      - name: Run tests
        run: bats -T psmdb_pbm_auth_tests/${{ matrix.setup.tests }}.bats

      - name: Container logs
        if: failure()
        run: |
          docker logs pmm-server || true
          docker logs psmdb-server || true
          docker logs rs101 || true
