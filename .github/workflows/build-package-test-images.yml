# Builds the eight systemd-capable OS images that pmm3-package-tests-matrix.yml
# runs the package playbooks in, and publishes them to GHCR as one package,
# package_tests, tagged by OS: package_tests:ol8, package_tests:debian13, ... Each
# image is booted and checked before it is pushed, so a broken one never gets a tag.
# The databases package_tests/docker/database-versions lists for each OS come
# preinstalled.
#
# Those OS tags are the only tags. The matrix also calls this when run with
# build_images, which republishes them from the branch it runs on before testing.
#
# Each OS tag is multi-arch. Each OS is built natively on an amd64 and an arm64
# runner and pushed by digest alone; publish then joins the two digests under the
# OS tag, and only once both have built, so no OS ever loses an architecture.
name: Build package test images

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-package-test-images
  cancel-in-progress: false

env:
  # pmm3-package-tests-matrix.yml pulls package_tests:<os> from the same place.
  IMAGE_REPO: ghcr.io/percona/pmm-qa

jobs:
  build:
    name: ${{ matrix.os.name }}-${{ matrix.arch }}
    # A fork cannot push to percona's registry namespace.
    if: github.repository == 'percona/pmm-qa'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 5 # more than this and GHCR starts rejecting the pushes
      matrix:
        arch: [amd64, arm64]
        # Keep this list in sync with publish below, pmm3-package-tests-matrix.yml
        # and package_tests/docker/database-versions.
        # privileged: matches how the test matrix runs each image, so the check here
        # reflects the real thing.
        os:
          - { name: ol8, base: 'oraclelinux:8', family: rpm, privileged: false }
          - { name: ol9, base: 'oraclelinux:9', family: rpm, privileged: false }
          - { name: ol10, base: 'oraclelinux:10', family: rpm, privileged: true }
          - { name: debian12, base: 'debian:12', family: deb, privileged: true }
          - { name: debian13, base: 'debian:13', family: deb, privileged: true }
          - { name: ubuntu2204, base: 'ubuntu:22.04', family: deb, privileged: true }
          - { name: ubuntu2404, base: 'ubuntu:24.04', family: deb, privileged: true }
          - { name: ubuntu2604, base: 'ubuntu:26.04', family: deb, privileged: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Percona Server's Debian postinst runs mysqld to initialize its data directory,
      # and the runner's own MySQL AppArmor profile, matched by binary path, would
      # confine it too. The boot check below then starts it unconfined, as the
      # test matrix does.
      - name: Unload the host mysqld AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld && echo "unloaded"
          else
            echo "nothing to unload"
          fi

      # sudo everywhere: rootless and root podman have separate image stores, so a
      # rootless build would be invisible to the root-run container below.
      # The source label links each package to this repository, so it inherits
      # the repository's access and the test matrix can pull it with GITHUB_TOKEN.
      - name: Build the image
        run: |
          sudo podman build \
            --file "package_tests/docker/Dockerfile.${{ matrix.os.family }}" \
            --build-arg "BASE_IMAGE=${{ matrix.os.base }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --tag "staged:${{ matrix.os.name }}" \
            package_tests/docker

      - name: Boot it and check systemd comes up
        env:
          PRIVILEGED: ${{ matrix.os.privileged }}
        run: |
          PRIV=""
          [ "$PRIVILEGED" = "true" ] && PRIV="--privileged"
          # shellcheck disable=SC2086
          sudo podman run -d --name probe --systemd=always $PRIV "staged:${{ matrix.os.name }}"

          sudo podman exec probe bash -c '
            for i in $(seq 1 90); do
              state=$(systemctl is-system-running 2>/dev/null)
              case "$state" in
                running|degraded) echo "systemd is $state after ${i}s"; break ;;
              esac
              if [ "$i" -eq 90 ]; then
                echo "systemd never came up (last state: $state)"
                systemctl list-jobs --no-pager
                exit 1
              fi
              sleep 1
            done

            for tool in ip ps git wget sudo gpg2 ansible; do
              command -v "$tool" >/dev/null || { echo "missing: $tool"; exit 1; }
            done
            ansible --version | head -1'

          sudo podman rm -f probe

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | sudo podman login ghcr.io -u "$GHCR_USER" --password-stdin

      # No tag here: a tag pushed per architecture would point the OS tag at one
      # of them until publish ran. skopeo pushes the OCI layout byte for byte, so the
      # digest read from it is the digest the registry stores.
      - name: Push by digest
        env:
          OS: ${{ matrix.os.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          # The arm64 runner image lists "associated container tools", not skopeo by name.
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }

          name="${IMAGE_REPO}/package_tests"
          oci="${RUNNER_TEMP}/oci"
          sudo podman push "staged:${OS}" "oci:${oci}:image"
          digest=$(sudo jq -r '.manifests[0].digest' "${oci}/index.json")

          # GHCR rate-limits concurrent pushes, so back off and try again.
          for attempt in 1 2 3 4 5; do
            sudo skopeo copy --preserve-digests "oci:${oci}:image" "docker://${name}@${digest}" && break
            [ "$attempt" -lt 5 ] || { echo "push failed after 5 attempts"; exit 1; }
            echo "push failed, retrying in $((attempt * 20))s"
            sleep "$((attempt * 20))"
          done

          echo "$digest" > "digest-${OS}-${ARCH}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.os.name }}-${{ matrix.arch }}
          path: digest-${{ matrix.os.name }}-${{ matrix.arch }}
          retention-days: 1

  # Runs for every OS even when some builds failed, so one broken OS or
  # architecture holds back only its own tag.
  publish:
    name: publish ${{ matrix.os }}
    needs: build
    if: ${{ !cancelled() && github.repository == 'percona/pmm-qa' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        os: [ol8, ol9, ol10, debian12, debian13, ubuntu2204, ubuntu2404, ubuntu2604]
    steps:
      # A failed build uploads nothing; the next step says which one is missing.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: digest-${{ matrix.os }}-*
          merge-multiple: true
          path: digests

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | sudo podman login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Publish package_tests:${{ matrix.os }}
        env:
          OS: ${{ matrix.os }}
        run: |
          name="${IMAGE_REPO}/package_tests"
          for arch in amd64 arm64; do
            [ -s "digests/digest-${OS}-${arch}" ] || { echo "no ${arch} image was built, so :${OS} stays as it is"; exit 1; }
          done

          sudo podman manifest create images
          for arch in amd64 arm64; do
            sudo podman manifest add images "docker://${name}@$(cat "digests/digest-${OS}-${arch}")"
          done

          for attempt in 1 2 3 4 5; do
            sudo podman manifest push --all images "docker://${name}:${OS}" && break
            [ "$attempt" -lt 5 ] || { echo "push failed after 5 attempts"; exit 1; }
            echo "push failed, retrying in $((attempt * 20))s"
            sleep "$((attempt * 20))"
          done
