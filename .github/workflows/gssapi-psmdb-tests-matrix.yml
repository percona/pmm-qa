name: "PSMDB GSSAPI E2E Tests Matrix"

on:
  workflow_dispatch:
    inputs:
      pmm_qa_branch:
        description: 'qa-integration repository branch(for setup)'
        default: 'main'
        required: false
        type: string
      pmm_server_image:
        description: 'PMM Server docker image'
        default: 'perconalab/pmm-server:3-dev-latest'
        required: true
        type: string
      pmm_client_image:
        description: 'pmm-client docker image'
        default: 'perconalab/pmm-client:3-dev-latest'
        required: false
        type: string
      pmm_client_version_ol8:
        description: 'ol8 pmm-client tarball URL'
        default: 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol8-latest.tar.gz'
        required: false
        type: string
      pmm_client_version_ol9:
        description: 'ol9 pmm-client tarball URL'
        default: 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol9-latest.tar.gz'
        required: false
        type: string
      expected_version:
        description: 'expected pmm-client version'
        required: true
        type: string
      repository:
        description: "Select Repo for package testing to install PMM Server and client"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - testing
          - experimental
      sha:
        description: "SHA (leave default if running manually)"
        default: 'null'
        required: false
        type: string

  workflow_call:
    inputs:
      pmm_qa_branch:
        required: false
        type: string
      pmm_server_image:
        required: true
        type: string
      pmm_client_image:
        required: false
        type: string
      pmm_client_version_ol8:
        required: false
        type: string
      pmm_client_version_ol9:
        required: false
        type: string
      repository:
        required: false
        type: string
      expected_version:
        required: false
        type: string
      sha:
        required: false
        type: string

jobs:
  mongo_bm_ol8:
    name: 'OL8 PSMDB E2E tests'
    uses: ./.github/workflows/runner-e2e-tests-codeceptjs.yml
    secrets: inherit
    with:
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version_ol8 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol8-latest.tar.gz' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-client:3-dev-latest' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      setup_services: '--database psmdb,COMPOSE_PROFILES=extra,OL_VERSION=8,GSSAPI=true'
      tags_for_tests: '@bm-mongo'

  mongo_bm_ol9:
    name: 'OL9 PSMDB E2E tests'
    uses: ./.github/workflows/runner-e2e-tests-codeceptjs.yml
    secrets: inherit
    with:
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version_ol9 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol9-latest.tar.gz' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-client:3-dev-latest' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      setup_services: '--database psmdb,COMPOSE_PROFILES=extra,OL_VERSION=9,GSSAPI=true'
      tags_for_tests: '@bm-mongo'

  mongo_exporter_ol8:
    name: 'OL8 PSMDB E2E tests'
    uses: ./.github/workflows/runner-e2e-tests-codeceptjs.yml
    secrets: inherit
    with:
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version_ol8 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol8-latest.tar.gz' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-client:3-dev-latest' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      setup_services: '--database psmdb,OL_VERSION=8,GSSAPI=true'
      tags_for_tests: '@mongodb-exporter'

  mongo_exporter_ol9:
    name: 'OL9 PSMDB E2E tests'
    uses: ./.github/workflows/runner-e2e-tests-codeceptjs.yml
    secrets: inherit
    with:
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version_ol9 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol9-latest.tar.gz' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-client:3-dev-latest' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      setup_services: '--database psmdb,OL_VERSION=9,GSSAPI=true'
      tags_for_tests: '@mongodb-exporter'

  psmdb_replica_ol8:
    name: 'OL8 PSMDB E2E tests'
    uses: ./.github/workflows/runner-e2e-tests-codeceptjs.yml
    secrets: inherit
    with:
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version_ol8 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol8-latest.tar.gz' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-client:3-dev-latest' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      setup_services: '--database psmdb,OL_VERSION=8,GSSAPI=true'
      tags_for_tests: '@pmm-psmdb-replica-integration'

  psmdb_replica_ol9:
    name: 'OL9 PSMDB E2E tests'
    uses: ./.github/workflows/runner-e2e-tests-codeceptjs.yml
    secrets: inherit
    with:
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version_ol9 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol9-latest.tar.gz' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-client:3-dev-latest' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      setup_services: '--database psmdb,OL_VERSION=9,GSSAPI=true'
      tags_for_tests: '@pmm-psmdb-replica-integration'

  psmdb_rta_ol8:
    name: 'OL8 PSMDB E2E tests'
    uses: ./.github/workflows/runner-e2e-tests-playwright.yml
    secrets: inherit
    with:
      pmm_server_version: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version_ol8 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol8-latest.tar.gz' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      setup_services: '--database psmdb,OL_VERSION=8,GSSAPI=true'
      pmm_test_flag: '@rta'
      workers: 1

  psmdb_rta_ol9:
    name: 'OL9 PSMDB E2E tests'
    uses: ./.github/workflows/runner-e2e-tests-playwright.yml
    secrets: inherit
    with:
      pmm_server_version: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version_ol9 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol9-latest.tar.gz' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      setup_services: '--database psmdb,OL_VERSION=9,GSSAPI=true'
      pmm_test_flag: '@rta'
      workers: 1

### CLI Integration tests
  psmdb_6_replica-tests_ol8:
    name: 'OL8 CLI / Integration'
    uses: ./.github/workflows/runner-integration-cli-tests.yml
    secrets: inherit
    with:
      sha: ${{ inputs.sha || github.event.pull_request.head.sha ||  'null' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-client:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version_ol8 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol8-latest.tar.gz' }}
      cli_tag: '@psmdb'
      services_list: '--database psmdb=6.0,SETUP_TYPE=pss,OL_VERSION=8'
      test_name: 'PSMDB Replica 6.x'

  psmdb_7_replica-tests_ol8:
    name: 'OL8 CLI / Integration'
    uses: ./.github/workflows/runner-integration-cli-tests.yml
    secrets: inherit
    with:
      sha: ${{ inputs.sha || github.event.pull_request.head.sha ||  'null' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-client:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version_ol8 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol8-latest.tar.gz' }}
      cli_tag: '@psmdb'
      services_list: '--database psmdb=7.0,SETUP_TYPE=pss,OL_VERSION=8'
      test_name: 'PSMDB Replica 7.x'

  psmdb_8_replica-tests_ol8:
    name: 'OL8 CLI / Integration'
    uses: ./.github/workflows/runner-integration-cli-tests.yml
    secrets: inherit
    with:
      sha: ${{ inputs.sha || github.event.pull_request.head.sha ||  'null' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-client:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version_ol8 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol8-latest.tar.gz' }}
      cli_tag: '@psmdb'
      services_list: '--database psmdb=8.0,SETUP_TYPE=pss,OL_VERSION=8'
      test_name: 'PSMDB Replica 8.x'

  psmdb_6_replica-tests_ol9:
    name: 'OL9 CLI / Integration'
    uses: ./.github/workflows/runner-integration-cli-tests.yml
    secrets: inherit
    with:
      sha: ${{ inputs.sha || github.event.pull_request.head.sha ||  'null' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-client:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version_ol9 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol9-latest.tar.gz' }}
      cli_tag: '@psmdb'
      services_list: '--database psmdb=6.0,SETUP_TYPE=pss,OL_VERSION=9'
      test_name: 'PSMDB Replica 6.x'

  psmdb_7_replica-tests_ol9:
    name: 'OL9 CLI / Integration'
    uses: ./.github/workflows/runner-integration-cli-tests.yml
    secrets: inherit
    with:
      sha: ${{ inputs.sha || github.event.pull_request.head.sha ||  'null' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-client:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version_ol9 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol9-latest.tar.gz' }}
      cli_tag: '@psmdb'
      services_list: '--database psmdb=7.0,SETUP_TYPE=pss,OL_VERSION=9'
      test_name: 'PSMDB Replica 7.x'

  psmdb_8_replica-tests_ol9:
    name: 'OL9 CLI / Integration'
    uses: ./.github/workflows/runner-integration-cli-tests.yml
    secrets: inherit
    with:
      sha: ${{ inputs.sha || github.event.pull_request.head.sha ||  'null' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      pmm_client_image: ${{ inputs.pmm_client_image || 'perconalab/pmm-client:3-dev-latest' }}
      pmm_client_version: ${{ inputs.pmm_client_version_ol9 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol9-latest.tar.gz' }}
      cli_tag: '@psmdb'
      services_list: '--database psmdb=8.0,SETUP_TYPE=pss,OL_VERSION=9'
      test_name: 'PSMDB Replica 8.x'

  # The nightly passes the repository and tag its other suites use: dev-latest
  # or "release candidate", and 3-dev-latest or 3.9.1-rc. The package matrix
  # takes a percona-release channel and a version, and reads the version itself
  # for experimental and release when it is empty.
  package_test_inputs:
    name: Package Test inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      install_repo: ${{ steps.map.outputs.install_repo }}
      pmm_version: ${{ steps.map.outputs.pmm_version }}
    steps:
      - id: map
        env:
          REPOSITORY: ${{ inputs.repository || 'release' }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          case "$REPOSITORY" in
            dev-latest) repo=experimental ;;
            'release candidate') repo=testing ;;
            *) repo=$REPOSITORY ;;
          esac
          version=${EXPECTED_VERSION%%-*}
          [[ "$version" =~ ^3\.[0-9]+\.[0-9]+$ ]] || version=''
          echo "install_repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "pmm_version=${version}" >> "$GITHUB_OUTPUT"

  mongo_package_tests_integration_ol8:
    name: Package Test - OL 8
    needs: package_test_inputs
    uses: ./.github/workflows/pmm3-package-tests-matrix.yml
    secrets: inherit
    with:
      os: 'ol8'
      arch: 'amd64'
      test: 'pmm3-client_integration_tarball_gssapi'
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      install_repo: ${{ needs.package_test_inputs.outputs.install_repo }}
      pmm_version: ${{ needs.package_test_inputs.outputs.pmm_version }}
      metrics_mode: "auto"
      tarball: ${{ inputs.pmm_client_version_ol8 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol8-latest.tar.gz' }}

  mongo_package_tests_integration_ol9:
    name: Package Test - OL 9
    needs: package_test_inputs
    uses: ./.github/workflows/pmm3-package-tests-matrix.yml
    secrets: inherit
    with:
      os: 'ol9'
      arch: 'amd64'
      test: 'pmm3-client_integration_tarball_gssapi'
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      install_repo: ${{ needs.package_test_inputs.outputs.install_repo }}
      pmm_version: ${{ needs.package_test_inputs.outputs.pmm_version }}
      metrics_mode: "auto"
      tarball: ${{ inputs.pmm_client_version_ol9 || 'https://s3.us-east-2.amazonaws.com/pmm-build-cache/PR-BUILDS/pmm-client/pmm-client-dynamic-ol9-latest.tar.gz' }}
