name: Build and Push Docker Image for PMM QA Framework

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image:
        description: 'Which image to build'
        required: true
        type: choice
        options:
          - percona-server-mysql
          - mysql-community
          - percona-distribution-postgresql
          - postgresql-community
          - percona-server-mongodb
          - mongodb
          - valkey
      version:
        description: 'Version to tag (e.g. 1.11.0). Leave empty to auto-bump minor.'
        required: false
        default: ''
      db_version:
        description: 'Database version to build/tag (e.g. 8.0, 8.4, 5.7). Applies to any image.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: percona/pmm-qa

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image config
        id: cfg
        run: |
          BASE="qa_framework/docker_images"
          case "${{ github.event.inputs.image }}" in
            percona-server-mysql)
              NAME="percona-server-mysql"
              DIR="$BASE/percona_server_for_mysql"
              ;;
            mysql-community)
              NAME="mysql-community"
              DIR="$BASE/mysql-community"
              ;;
            percona-distribution-postgresql)
              NAME="percona-distribution-postgresql"
              DIR="$BASE/percona-distribution-postgresql"
              ;;
            postgresql-community)
              NAME="postgresql-community"
              DIR="$BASE/postgresql-community"
              ;;
            percona-server-mongodb)
              NAME="percona-server-mongodb"
              DIR="$BASE/percona-server-mongodb"
              ;;
            mongodb)
              NAME="mongodb"
              DIR="$BASE/mongodb"
              ;;
            valkey)
              NAME="valkey"
              DIR="$BASE/valkey"
              ;;
            *)
              echo "Unknown image: ${{ github.event.inputs.image }}"
              exit 1
              ;;
          esac
          FILE="$DIR/Dockerfile"
          CONTEXT="$DIR"
          echo "name=$NAME"       >> "$GITHUB_OUTPUT"
          echo "file=$FILE"       >> "$GITHUB_OUTPUT"
          echo "context=$CONTEXT" >> "$GITHUB_OUTPUT"

          # Version handling: db_version is free-text and usable by any image.
          # Every image receives DB_VERSION as a build arg (Dockerfiles may ignore it);
          # percona-server-mysql additionally derives its repo/base/package args.
          DBV="${{ github.event.inputs.db_version }}"
          FLAVOR="$DBV"
          {
            echo "build_args<<EOF"
            [ -n "$DBV" ] && echo "DB_VERSION=${DBV}"
            if [ "$NAME" = "percona-server-mysql" ]; then
              PSV="${DBV:-8.0}"
              case "$PSV" in
                8.4) echo "BASE_IMAGE=antmelekhin/docker-systemd:ubuntu-24.04"; echo "PS_REPO=ps-84-lts"; echo "PS_PKG_SUFFIX=" ;;
                5.7) echo "BASE_IMAGE=antmelekhin/docker-systemd:ubuntu-22.04"; echo "PS_REPO=ps-57";     echo "PS_PKG_SUFFIX=-5.7" ;;
                *)   echo "BASE_IMAGE=antmelekhin/docker-systemd:ubuntu-24.04"; echo "PS_REPO=ps-80";     echo "PS_PKG_SUFFIX=" ;;
              esac
              FLAVOR="$PSV"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "Resolved: image=$NAME file=$FILE context=$CONTEXT flavor=${FLAVOR:-none}"

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
            echo "Using provided version: $VERSION"
          else
            ORG="${GITHUB_REPOSITORY%/*}"          # percona
            PKG="${GITHUB_REPOSITORY#*/}"          # pmm-qa
        
            # Page through all published versions, extract every tag,
            # keep only strict X.Y.Z, pick the highest.
            page=1
            all_tags=""
            while :; do
              resp=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "/orgs/${ORG}/packages/container/${PKG}/versions?per_page=100&page=${page}" \
                2>/dev/null || echo "[]")
              # stop on empty page or error/no-package
              count=$(echo "$resp" | jq 'if type=="array" then length else 0 end')
              [ "$count" -eq 0 ] && break
              tags=$(echo "$resp" | jq -r '.[].metadata.container.tags[]?')
              all_tags="${all_tags}"$'\n'"${tags}"
              page=$((page + 1))
            done
        
            LATEST=$(echo "$all_tags" \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n1)
            LATEST=${LATEST:-0.0.0}
            MAJOR=$(echo "$LATEST" | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            VERSION="${MAJOR}.$((MINOR + 1)).0"
            echo "Highest published: $LATEST -> new: $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble tags
        id: tags
        run: |
          IMG="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ steps.cfg.outputs.name }}"
          VER="${{ steps.version.outputs.version }}"
          FLAVOR="${{ steps.cfg.outputs.flavor }}"
          {
            echo "tags<<EOF"
            if [ -n "$FLAVOR" ]; then
              # e.g. percona-server-mysql:8.0  and  :8.0-1.11.0
              echo "${IMG}:${FLAVOR}"
              echo "${IMG}:${FLAVOR}-${VER}"
            else
              echo "${IMG}:latest"
              echo "${IMG}:${VER}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.cfg.outputs.context }}
          file: ${{ steps.cfg.outputs.file }}
          push: true
          build-args: ${{ steps.cfg.outputs.build_args }}
          tags: ${{ steps.tags.outputs.tags }}
