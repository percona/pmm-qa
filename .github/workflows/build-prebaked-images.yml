# Builds the prebaked images pmm-framework runs (PS, MySQL, PXC with ProxySQL,
# PSMDB, HAProxy, Valkey, the External exporters, Percona Distribution for
# PostgreSQL with and without TLS, and PGDG PostgreSQL) and publishes them to
# ghcr.io/percona/pmm-qa/<engine>:<version>, so a CI job pulls a ready image
# instead of spending 90-160 s building one. Each
# image is started and checked before it is pushed, so a broken build never
# replaces a working tag, and each cell publishes on its own.
#
# Tags: :<version> only. To roll back, revert the change and let this rebuild.
# Keep the matrix in sync with the build_*_image functions in
# qa-integration/pmm_qa/pmm-framework/lib/images.sh.
name: Build prebaked database images

on:
  schedule:
    - cron: '23 3 * * 1' # Mondays, off the hour
  workflow_dispatch:
  push:
    # TEMPORARY: Pre-Baked-Images-POC publishes from the branch for the first
    # live test. Remove it before merging to main.
    branches: [main, Pre-Baked-Images-POC]
    paths:
      - qa-integration/pmm_qa/pmm-framework/images/**
      - qa-integration/pmm_qa/pmm-framework/lib/images.sh
      - qa-integration/pmm_qa/pmm-framework/build-images
      # What images/psmdb/Dockerfile copies from its build context.
      - qa-integration/pmm_psmdb-pbm_setup/keyfile
      - qa-integration/pmm_psmdb-pbm_setup/conf/sysconfig/**
      - qa-integration/pmm_psmdb-pbm_setup/conf/krb/**
      - qa-integration/pmm_psmdb-pbm_setup/conf/mongos/mongos.service
      - .github/workflows/build-prebaked-images.yml

permissions:
  contents: read

concurrency:
  group: build-prebaked-images
  cancel-in-progress: false

jobs:
  # Rebuild only the engines a push touched. A schedule or manual run, a push
  # whose previous commit is unknown (a new branch or a force-push), or a change
  # to the shared build logic rebuilds all of them.
  plan:
    # A fork's schedule must not try to publish into percona's registry.
    if: github.repository == 'percona/pmm-qa'
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.pick.outputs.engines }}
      cells: ${{ steps.pick.outputs.cells }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the engines to build
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          all='["ps","mysql","pxc-proxysql","psmdb","haproxy","external","valkey","pdpgsql","pgsql","ssl-pdpgsql"]'
          if [ "$EVENT" != push ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            engines=$all
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            if grep -qE '^(qa-integration/pmm_qa/pmm-framework/(lib/images\.sh|build-images)|\.github/workflows/build-prebaked-images\.yml)$' <<<"$changed"; then
              engines=$all
            else
              # Only the files each image bakes in: a setup.sh edit rebuilds nothing.
              picked=()
              images=qa-integration/pmm_qa/pmm-framework/images
              pick() { if grep -qE "$2" <<<"$changed"; then picked+=("\"$1\""); fi; }
              pick ps "^$images/ps/"
              pick mysql "^$images/mysql/Dockerfile$"
              pick pxc-proxysql "^$images/pxc/(Dockerfile|pmm-pxc)$"
              pick psmdb "^($images/psmdb/Dockerfile|qa-integration/pmm_psmdb-pbm_setup/)"
              pick haproxy "^$images/haproxy/Dockerfile$"
              pick external "^$images/external/Dockerfile$"
              pick valkey "^$images/valkey/Dockerfile$"
              pick pdpgsql "^$images/pdpgsql/Dockerfile$"
              pick ssl-pdpgsql "^$images/pdpgsql/ssl/"
              pick pgsql "^$images/pgsql/(Dockerfile|pg_stat_statements_setup\.sh|pgsm_run_queries\.sh)$"
              engines="[$(IFS=,; echo "${picked[*]}")]"
            fi
          fi
          # PSMDB tags pair a major with an Oracle Linux release.
          cells=$(jq -c '[.[] as $e | (if $e == "psmdb" then ["6.0-ol8", "6.0-ol9", "7.0-ol8", "7.0-ol9", "8.0-ol8", "8.0-ol9"]
            elif $e == "haproxy" then ["ol9"]
            elif $e == "external" then ["1.58.0-0.7.10"]
            elif $e == "valkey" then ["7", "8"]
            elif $e == "pdpgsql" or $e == "pgsql" then ["14", "15", "16", "17", "18"]
            elif $e == "ssl-pdpgsql" then ["14", "15", "16", "17"]
            else ["5.7", "8.0", "8.4", "9.7"] end)[] | {engine: $e, version: .}]' <<<"$engines")
          echo "engines=$engines" >>"$GITHUB_OUTPUT"
          echo "cells=$cells" >>"$GITHUB_OUTPUT"
          echo "Building: \`$engines\`" >>"$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.engine }}:${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.cells != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      max-parallel: 5 # GHCR starts rejecting concurrent pushes beyond this
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cells) }}
    env:
      IMAGE: pmm-qa/${{ matrix.engine }}:${{ matrix.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Build the image
        run: bash qa-integration/pmm_qa/pmm-framework/build-images '${{ matrix.engine }}=${{ matrix.version }}'

      - name: Start it and check it works
        env:
          ENGINE: ${{ matrix.engine }}
          VERSION: ${{ matrix.version }}
        run: |
          if [ "$ENGINE" = pdpgsql ]; then
            # systemd starts PostgreSQL with pg_stat_monitor preloaded.
            docker run -d --name probe --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw "$IMAGE"
            for i in $(seq 1 60); do
              docker exec -u postgres probe pg_isready -q 2>/dev/null && break
              if [ "$i" -eq 60 ]; then
                docker exec probe journalctl -u "postgresql@$VERSION-main" --no-pager | tail -30
                exit 1
              fi
              sleep 1
            done
            docker exec -u postgres probe psql -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pg_stat_monitor' -c 'SELECT pg_stat_monitor_version()'
            docker exec probe sh -c 'patroni --version && etcd --version && pgbackrest version'
          elif [ "$ENGINE" = ssl-pdpgsql ]; then
            # The image ships no certificates; make a set as setup_ssl_pdpgsql does.
            docker run -d --name probe "$IMAGE"
            docker exec probe sh -ceu "cd /artifacts && bash create_certs.sh >/dev/null 2>&1
              cp -a certificates/. /var/lib/postgresql/$VERSION/main/
              chown -R postgres:postgres /var/lib/postgresql/$VERSION/main
              chmod -R 0700 /var/lib/postgresql/$VERSION/main
              service postgresql start"
            docker exec -e PGPASSWORD=pmm probe psql -v ON_ERROR_STOP=1 'host=127.0.0.1 user=pmm dbname=postgres sslmode=require' \
              -c 'SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()' -c 'SELECT count(*) FROM pg_stat_statements'
          elif [ "$ENGINE" = pgsql ]; then
            docker run -d --name probe "$IMAGE"
            docker exec probe service postgresql start
            docker exec -u postgres probe psql -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM pg_stat_statements'
          elif [ "$ENGINE" = valkey ]; then
            docker run --rm "$IMAGE" sh -c 'valkey-server --version && valkey-cli --version'
          elif [ "$ENGINE" = external ]; then
            docker run --rm --entrypoint sh "$IMAGE" -c 'redis_exporter --version && process-exporter --version'
          elif [ "$ENGINE" = haproxy ]; then
            docker run --rm --entrypoint haproxy "$IMAGE" -vv | grep prometheus-exporter
          elif [ "$ENGINE" = psmdb ]; then
            # mongod needs the mongod.conf compose mounts, so check the tools run.
            docker run --rm "$IMAGE" sh -c 'mongod --version && mongos --version && pbm version && command -v mgodatagen'
          elif [ "$ENGINE" = pxc-proxysql ]; then
            # The full cluster: three nodes synced and ProxySQL seeing all of them.
            docker run -d --init --name probe "$IMAGE"
            docker exec --user root probe pmm-pxc start
            docker exec probe sysbench --version
          else
            docker run -d --name probe -e MYSQL_ROOT_PASSWORD=probe "$IMAGE"
            for i in $(seq 1 90); do
              if docker exec -e MYSQL_PWD=probe probe mysql -uroot -h127.0.0.1 -e 'SELECT VERSION()'; then
                break
              fi
              if [ "$i" -eq 90 ]; then
                docker logs probe
                exit 1
              fi
              sleep 1
            done
            docker exec probe sysbench --version
            # PS 9.7 has no compatible XtraBackup; setup_ps refuses BACKUP=true there.
            if [ "$ENGINE" = ps ] && [ "$VERSION" != 9.7 ]; then
              docker exec --user root probe xtrabackup --version
            fi
          fi
          docker rm -fv probe 2>/dev/null || true

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Publish
        id: push
        env:
          ENGINE: ${{ matrix.engine }}
          VERSION: ${{ matrix.version }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY}/${ENGINE}"
          docker tag "$IMAGE" "${name}:${VERSION}"

          for attempt in 1 2 3 4 5; do
            if docker push "${name}:${VERSION}"; then
              break
            fi
            [ "$attempt" -lt 5 ] || { echo "push failed after 5 attempts"; exit 1; }
            echo "push failed, retrying in $((attempt * 20))s"
            sleep "$((attempt * 20))"
          done

          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${name}:${VERSION}")
          digest=${digest#*@}
          echo "name=${name}" >>"$GITHUB_OUTPUT"
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"
          echo "- \`${name}:${VERSION}\` \`${digest}\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          # Kept in GitHub's attestation store only; pushing them to GHCR adds
          # a sha256-<digest> package version for every image built.
          push-to-registry: false

  # A registry cannot overwrite an image: each push is a new digest, and the
  # one its tag moved off stays behind. Keep only the versions carrying one of
  # the engine's current tags; everything else -- untagged images, old dated
  # tags, sha256-<digest> attestations -- is deleted.
  cleanup:
    name: prune ${{ matrix.engine }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
    steps:
      - name: Delete the versions no current tag points at
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: orgs/${{ github.repository_owner }}/packages/container/pmm-qa%2F${{ matrix.engine }}/versions
          ENGINE: ${{ matrix.engine }}
          CELLS: ${{ needs.plan.outputs.cells }}
        run: |
          keep=$(jq -c --arg e "$ENGINE" '[.[] | select(.engine == $e) | .version]' <<<"$CELLS")
          [ "$keep" != "[]" ] || { echo "no current tags for $ENGINE; refusing to delete"; exit 1; }
          gh api --paginate "$VERSIONS" |
            jq -r --argjson keep "$keep" '.[] | select(all(.metadata.container.tags[]; IN($keep[]) | not)) | .id' |
            while read -r id; do
              gh api -X DELETE "$VERSIONS/$id"
              echo "deleted version $id"
            done