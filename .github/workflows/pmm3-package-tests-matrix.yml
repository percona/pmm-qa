# Called from another workflow, the calling job must grant contents: read and
# packages: read. From another repository, pass pmm_qa_ref.
name: PMM package tests matrix

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system ("all" runs every OS)'
        type: choice
        default: all
        options:
          [all, ol8, ol9, ol10, debian12, debian13, ubuntu2204, ubuntu2404, ubuntu2604]
      arch:
        description: 'CPU architecture ("all" runs both). arm64 needs a pmm-server
          image built for arm64, such as perconalab/pmm-server:3-dev-latest.'
        type: choice
        default: amd64
        options: [amd64, arm64, all]
      test:
        description: 'Playbook ("all" runs every test)'
        type: choice
        default: all
        options:
          - all
          - pmm3-client_integration
          - pmm3-client_integration_auth_config
          - pmm3-client_integration_auth_register
          - pmm3-client_integration_custom_path
          - pmm3-client_integration_custom_port
          - pmm3-client_integration_upgrade
          - pmm3-client_integration_upgrade_custom_path
          - pmm3-client_integration_upgrade_custom_port
          - pmm3-client_integration_tarball_gssapi
      pmm_server_image:
        description: 'PMM Server image (Jenkins DOCKER_VERSION)'
        default: 'perconalab/pmm-server:3-dev-latest'
      install_repo:
        description: 'Client packages: dev-latest (experimental), release candidate (testing)
          or release. upgrade and upgrade_custom_port install the latest release and upgrade
          to this, so they cannot pass when it is also "release".'
        type: choice
        default: dev-latest
        options: [dev-latest, release candidate, release]
      pmm_version:
        description: 'Version the playbook asserts, or a pmm-server tag that names it
          (3.9.1-rc); it must match what install_repo ships. Empty, or a tag naming no
          version (3-dev-latest), reads it from pmm-submodules v3 (dev-latest) or the
          newest percona/pmm-client tag (release). release candidate has no source: set it.'
        default: ''
      metrics_mode:
        description: 'Metrics mode (Jenkins METRICS_MODE)'
        type: choice
        default: auto
        options: [auto, push, pull]
      tarball:
        description: 'Client tarball link or FB-code for amd64 cells. Empty installs
          from packages.'
        default: ''
      tarball_arm64:
        description: 'Client tarball link or FB-code for arm64 cells. Empty installs
          from packages.'
        default: ''
      admin_password:
        description: 'PMM Server admin password'
        default: 'pmm3admin!'
      attempts:
        description: 'Attempts per cell. A failed attempt is retried from scratch,
          on a fresh client and PMM Server; 1 means no retry.'
        type: choice
        default: '2'
        options: ['1', '2', '3']
  # The workflow_dispatch inputs again, with their defaults. There are no choice
  # lists here: os, arch, test, install_repo and metrics_mode take the values of
  # the options above.
  workflow_call:
    inputs:
      os:
        type: string
        default: all
      arch:
        type: string
        default: amd64
      test:
        type: string
        default: all
      pmm_server_image:
        type: string
        default: 'perconalab/pmm-server:3-dev-latest'
      install_repo:
        type: string
        default: dev-latest
      pmm_version:
        type: string
        default: ''
      metrics_mode:
        type: string
        default: auto
      tarball:
        type: string
        default: ''
      tarball_arm64:
        type: string
        default: ''
      admin_password:
        type: string
        default: 'pmm3admin!'
      attempts:
        type: number
        default: 2
      pmm_qa_ref:
        description: 'pmm-qa branch, tag or commit to test. Empty means the
          caller''s own commit when it is in pmm-qa, and main when it is not.'
        type: string
        default: ''

permissions:
  contents: read

# A new push to a pull request supersedes the matrix it started; nothing else is
# cancelled. A called run sees its caller's github context, pull_request
# event included, so it is told apart by workflow_ref, and grouped by the caller's
# run and its inputs, since a caller may call it more than once.
concurrency:
  group: >-
    pmm3-package-tests-${{ startsWith(github.workflow_ref, format('{0}/.github/workflows/pmm3-package-tests-matrix.yml@', github.repository))
    && github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)
    || format('{0}-{1}-{2}-{3}-{4}-{5}', github.run_id, inputs.os, inputs.arch, inputs.test, inputs.install_repo, inputs.pmm_server_image) }}
  cancel-in-progress: >-
    ${{ startsWith(github.workflow_ref, format('{0}/.github/workflows/pmm3-package-tests-matrix.yml@', github.repository))
    && github.event_name == 'pull_request' }}

env:
  # build-package-test-images.yml publishes package_tests:<os> there.
  CLIENT_IMAGE_REPO: ghcr.io/percona/pmm-qa
  SERVER_IMAGE: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
  INSTALL_REPO: ${{ inputs.install_repo || 'dev-latest' }}
  METRICS_MODE: ${{ inputs.metrics_mode || 'auto' }}
  ADMIN_PASSWORD: ${{ inputs.admin_password || 'pmm3admin!' }}
  TARBALL_AMD64: ${{ inputs.tarball }}
  TARBALL_ARM64: ${{ inputs.tarball_arm64 }}
  ATTEMPTS: ${{ inputs.attempts || '2' }}
  # A caller in another repository makes github.repository its own. An empty ref
  # leaves checkout on the commit the run is for.
  PMM_QA_REPO: ${{ endsWith(github.repository, '/pmm-qa') && github.repository || 'percona/pmm-qa' }}
  PMM_QA_REF: ${{ inputs.pmm_qa_ref || (!endsWith(github.repository, '/pmm-qa') && 'main' || '') }}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      server_image: ${{ steps.server.outputs.image }}
      install_repo: ${{ steps.repo.outputs.channel }}
      pmm_version: ${{ steps.version.outputs.version }}
      pmm_qa_sha: ${{ steps.qa.outputs.sha }}
    steps:
      # A branch such as main could move on before the last cell checks it out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PMM_QA_REPO }}
          ref: ${{ env.PMM_QA_REF }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Pin pmm-qa to a commit
        id: qa
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pin pmm-server to a digest
        id: server
        env:
          ARCHES: ${{ inputs.arch || 'amd64' }}
        run: |
          image=$(skopeo inspect --retry-times 3 --format '{{.Name}}@{{.Digest}}' "docker://${SERVER_IMAGE}")
          echo "image=${image}" >> "$GITHUB_OUTPUT"

          # Caught here rather than in every arm64 cell, at the pull or as an exec
          # format error. Release images, such as percona/pmm-server:3, are amd64 only.
          if [ "$ARCHES" != amd64 ]; then
            arch=$(skopeo --override-arch arm64 inspect --retry-times 3 --format '{{.Architecture}}' "docker://${image}" || true)
            if [ "$arch" != arm64 ]; then
              echo "::error::${SERVER_IMAGE} has no arm64 build; run with arch=amd64 or a multi-arch pmm-server image."
              exit 1
            fi
          fi

      # The playbook installs Kerberos only on the RedHat family, and its client
      # tarballs (pmm-client-dynamic-<os>) are built for ol8 and ol9.
      - name: Check the OS supports the GSSAPI playbook
        if: inputs.test == 'pmm3-client_integration_tarball_gssapi' && inputs.os != 'ol8' && inputs.os != 'ol9'
        run: |
          echo "::error::pmm3-client_integration_tarball_gssapi runs only on os=ol8 or os=ol9"
          exit 1

      - name: Map install_repo to its percona-release channel
        id: repo
        run: |
          case "$INSTALL_REPO" in
            dev-latest) channel=experimental ;;
            'release candidate') channel=testing ;;
            release) channel=release ;;
            *)
              echo "::error::install_repo must be dev-latest, release candidate or release, not '${INSTALL_REPO}'"
              exit 1 ;;
          esac
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Resolve the expected client version
        id: version
        env:
          VERSION: ${{ inputs.pmm_version }}
        run: |
          # A pmm-server tag works too: 3.9.1-rc asserts 3.9.1, and 3-dev-latest,
          # naming no version, counts as empty.
          case "$VERSION" in
            3.*) VERSION=${VERSION%%-*} ;;
            *[!0-9.]*) VERSION='' ;;
          esac
          if [ -z "$VERSION" ]; then
            case "$INSTALL_REPO" in
              dev-latest)
                VERSION=$(curl -fsS --retry 3 https://raw.githubusercontent.com/Percona-Lab/pmm-submodules/v3/VERSION) ;;
              release)
                VERSION=$(skopeo list-tags --retry-times 3 docker://docker.io/percona/pmm-client \
                  | jq -r '.Tags[]' | grep -E '^3\.[0-9]+\.[0-9]+$' | sort -V | tail -n1) ;;
              *)
                echo "::error::install_repo=${INSTALL_REPO} has no version to read; set pmm_version"
                exit 1 ;;
            esac
          fi
          if ! [[ "$VERSION" =~ ^3\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::'${VERSION}' is not a PMM 3 version"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.os }}-${{ matrix.arch }} / ${{ matrix.test }}
    needs: prepare
    # 22.04 until PSMDB ships 8.0.35: 8.0.32 won't start on the 24.04 images' kernel 7.0 (SERVER-121912)
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    # Up to three attempts, each held to the Jenkins job's 90 minutes.
    timeout-minutes: 300
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Keep the OS list in sync with build-package-test-images.yml.
        # The continuation lines must keep this indentation: YAML only folds a >-
        # block onto one line while every line shares the same indent.
        os: >-
          ${{ fromJSON((inputs.os || 'all') == 'all'
          && '["ol8","ol9","ol10","debian12","debian13","ubuntu2204","ubuntu2404","ubuntu2604"]'
          || format('["{0}"]', inputs.os)) }}
        arch: >-
          ${{ fromJSON((inputs.arch || 'amd64') == 'all'
          && '["amd64","arm64"]'
          || format('["{0}"]', inputs.arch || 'amd64')) }}
        test: >-
          ${{ fromJSON((inputs.test || 'all') == 'all'
          && '["pmm3-client_integration","pmm3-client_integration_auth_config","pmm3-client_integration_auth_register",
          "pmm3-client_integration_custom_path","pmm3-client_integration_custom_port","pmm3-client_integration_upgrade",
          "pmm3-client_integration_upgrade_custom_path","pmm3-client_integration_upgrade_custom_port"]'
          || format('["{0}"]', inputs.test)) }}
    steps:
      # So the pull works whether or not the packages have been made public: they
      # are linked to this repository, so its GITHUB_TOKEN can read them. A caller
      # in another repository brings its own token and needs them public.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # GHCR answers 403 now and then when all 64 cells hit it at once, which
          # otherwise loses a whole cell on a single unlucky request.
          for attempt in 1 2 3 4 5; do
            if echo "$GHCR_TOKEN" | sudo podman login ghcr.io -u "$GHCR_USER" --password-stdin; then
              exit 0
            fi
            echo "login failed, retrying in $((attempt * 10))s"
            sleep "$((attempt * 10))"
          done
          echo "could not log in to GHCR after 5 attempts"
          exit 1

      # Pulled here, with the same backoff, so that a 403 costs a retry rather than
      # the cell. Both `podman run` steps below then start from a local image.
      - name: Pull the client and server images
        env:
          CLIENT_IMAGE: ${{ env.CLIENT_IMAGE_REPO }}/package_tests:${{ matrix.os }}
          SERVER_IMAGE: ${{ needs.prepare.outputs.server_image }}
        run: |
          for image in "$CLIENT_IMAGE" "$SERVER_IMAGE"; do
            for attempt in 1 2 3 4 5; do
              sudo podman pull "$image" && break
              if [ "$attempt" -eq 5 ]; then echo "could not pull $image"; exit 1; fi
              echo "pull of $image failed, retrying in $((attempt * 10))s"
              sleep "$((attempt * 10))"
            done
          done

      # The host mysqld AppArmor profile also confines the container's mysqld, so it can't log its temp root password.
      - name: Unload the host mysqld AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld && echo "unloaded"
          else
            echo "nothing to unload"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PMM_QA_REPO }}
          ref: ${{ needs.prepare.outputs.pmm_qa_sha }}
          path: pmm-qa
          persist-credentials: false

      - name: Run ${{ matrix.test }}
        env:
          CLIENT_IMAGE: ${{ env.CLIENT_IMAGE_REPO }}/package_tests:${{ matrix.os }}
          SERVER_IMAGE: ${{ needs.prepare.outputs.server_image }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          TEST: ${{ matrix.test }}
          INSTALL_REPO: ${{ needs.prepare.outputs.install_repo }}
          PMM_VERSION: ${{ needs.prepare.outputs.pmm_version }}
        run: bash pmm-qa/.github/scripts/package-test-cell.sh

      - name: Upload logs from failed attempts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.test }}
          path: |
            ansible-*.log
            diagnostics-*.log
            pmm-summary-*.zip
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true

      # The script tears down after every attempt; this covers a cancelled or
      # timed-out one.
      - name: Tear down
        if: always()
        run: |
          sudo podman rm -f --ignore ldap-server || true
          sudo podman rm -f --ignore client pmm-server || true
          sudo podman volume rm -f pmm-data || true

  report:
    name: summary
    needs: [prepare, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record what this run tested
        env:
          RESOLVED: ${{ needs.prepare.outputs.server_image }}
          CHANNEL: ${{ needs.prepare.outputs.install_repo }}
          VERSION: ${{ needs.prepare.outputs.pmm_version }}
          REF: ${{ env.PMM_QA_REF || github.ref_name }}
          QA_SHA: ${{ needs.prepare.outputs.pmm_qa_sha }}
          ARCHES: ${{ inputs.arch || 'amd64' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## PMM package tests matrix

          | setting | value |
          |---|---|
          | pmm-server | \`${SERVER_IMAGE}\` |
          | install_repo | \`${INSTALL_REPO}\` (\`${CHANNEL}\`) |
          | pmm_version | \`${VERSION}\` |
          | tarball (amd64) | \`${TARBALL_AMD64:-none}\` |
          | tarball (arm64) | \`${TARBALL_ARM64:-none}\` |
          | arch | \`${ARCHES}\` |
          EOF
