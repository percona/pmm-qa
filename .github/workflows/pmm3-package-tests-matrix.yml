# The Jenkins pmm3-package-tests-matrix jobs (amd64 and arm64), on GitHub Actions:
# 8 playbooks x 8 operating systems = 64 cells per architecture, each on its own
# runner with its own PMM Server and its own systemd-capable client container. A
# failed cell is retried from scratch (.github/scripts/package-test-cell.sh).
# Debian 11 is left out: past its end of life, its security archive is gone from
# deb.debian.org.
#
# The playbooks run unmodified. Everything OS-specific lives in the prebuilt client
# images, built from package_tests/docker/ by build-package-test-images.yml.
name: PMM package tests matrix

on:
  pull_request:
    branches: [main]
    # 64 cells of up to 90 minutes each, so only for changes that can affect them.
    # A pull request run never builds images, so a change to them alone has
    # nothing new to test.
    paths:
      - 'package_tests/**'
      - '!package_tests/docker/**'
      - 'qa-integration/pmm_qa/tasks/**'
      - '.github/workflows/pmm3-package-tests-matrix.yml'
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system ("all" runs every OS)'
        type: choice
        default: all
        options:
          [all, ol8, ol9, ol10, debian12, debian13, ubuntu2204, ubuntu2404, ubuntu2604]
      arch:
        description: 'CPU architecture ("all" runs both). arm64 needs a pmm-server
          image built for arm64, such as perconalab/pmm-server:3-dev-latest.'
        type: choice
        default: amd64
        options: [amd64, arm64, all]
      test:
        description: 'Playbook ("all" runs every test)'
        type: choice
        default: all
        options:
          - all
          - pmm3-client_integration
          - pmm3-client_integration_auth_config
          - pmm3-client_integration_auth_register
          - pmm3-client_integration_custom_path
          - pmm3-client_integration_custom_port
          - pmm3-client_integration_upgrade
          - pmm3-client_integration_upgrade_custom_path
          - pmm3-client_integration_upgrade_custom_port
      pmm_server_image:
        description: 'PMM Server image (Jenkins DOCKER_VERSION)'
        default: 'perconalab/pmm-server:3-dev-latest'
      install_repo:
        description: 'Client repo channel. upgrade and upgrade_custom_port install the
          latest release and upgrade to this, so they cannot pass when it is also "release".'
        type: choice
        default: experimental
        options: [experimental, testing, release]
      pmm_version:
        description: 'Version the playbook asserts; it must match what install_repo
          ships. Empty reads it from pmm-submodules v3 (experimental) or the newest
          percona/pmm-client tag (release). testing has no source: set it.'
        default: ''
      metrics_mode:
        description: 'Metrics mode (Jenkins METRICS_MODE)'
        type: choice
        default: auto
        options: [auto, push, pull]
      tarball:
        description: 'Client tarball link or FB-code for amd64 cells. Empty installs
          from packages.'
        default: ''
      tarball_arm64:
        description: 'Client tarball link or FB-code for arm64 cells. Empty installs
          from packages.'
        default: ''
      admin_password:
        description: 'PMM Server admin password'
        default: 'pmm3admin!'
      attempts:
        description: 'Attempts per cell. A failed attempt is retried from scratch,
          on a fresh client and PMM Server; 1 means no retry.'
        type: choice
        default: '2'
        options: ['1', '2', '3']
      build_images:
        description: 'Rebuild and republish the client images (package_tests:<os>)
          from this ref before testing.'
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request supersedes its running matrix; dispatched runs
# each get their own group and are never cancelled.
concurrency:
  group: pmm3-package-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # build-package-test-images.yml publishes package_tests:<os> there.
  CLIENT_IMAGE_REPO: ghcr.io/percona/pmm-qa
  # A pull_request run has no inputs, so each falls back to its dispatch default.
  SERVER_IMAGE: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
  INSTALL_REPO: ${{ inputs.install_repo || 'experimental' }}
  METRICS_MODE: ${{ inputs.metrics_mode || 'auto' }}
  ADMIN_PASSWORD: ${{ inputs.admin_password || 'pmm3admin!' }}
  TARBALL_AMD64: ${{ inputs.tarball }}
  TARBALL_ARM64: ${{ inputs.tarball_arm64 }}
  ATTEMPTS: ${{ inputs.attempts || '2' }}

jobs:
  # Resolved once so every cell tests the same pmm-server build and asserts the
  # same version, even when a moving tag like 3-dev-latest is rebuilt while cells
  # are still queued.
  prepare:
    name: resolve inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      server_image: ${{ steps.server.outputs.image }}
      pmm_version: ${{ steps.version.outputs.version }}
    steps:
      # skopeo's docker:// transport expands a short name to docker.io itself, and
      # the fully qualified name it prints spares podman its short-name lookup.
      - name: Pin pmm-server to a digest
        id: server
        env:
          ARCHES: ${{ inputs.arch || 'amd64' }}
        run: |
          image=$(skopeo inspect --retry-times 3 --format '{{.Name}}@{{.Digest}}' "docker://${SERVER_IMAGE}")
          echo "image=${image}" >> "$GITHUB_OUTPUT"

          # Caught here rather than in every arm64 cell, at the pull or as an exec
          # format error. Release images, such as percona/pmm-server:3, are amd64 only.
          if [ "$ARCHES" != amd64 ]; then
            arch=$(skopeo --override-arch arm64 inspect --retry-times 3 --format '{{.Architecture}}' "docker://${image}" || true)
            if [ "$arch" != arm64 ]; then
              echo "::error::${SERVER_IMAGE} has no arm64 build; run with arch=amd64 or a multi-arch pmm-server image."
              exit 1
            fi
          fi

      - name: Resolve the expected client version
        id: version
        env:
          VERSION: ${{ inputs.pmm_version }}
        run: |
          if [ -z "$VERSION" ]; then
            case "$INSTALL_REPO" in
              experimental)
                VERSION=$(curl -fsS --retry 3 https://raw.githubusercontent.com/Percona-Lab/pmm-submodules/v3/VERSION) ;;
              release)
                VERSION=$(skopeo list-tags --retry-times 3 docker://docker.io/percona/pmm-client \
                  | jq -r '.Tags[]' | grep -E '^3\.[0-9]+\.[0-9]+$' | sort -V | tail -n1) ;;
              *)
                echo "::error::install_repo=${INSTALL_REPO} has no version to read; set pmm_version"
                exit 1 ;;
            esac
          fi
          if ! [[ "$VERSION" =~ ^3\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::'${VERSION}' is not a PMM 3 version"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Record what this run is testing
        env:
          # Passed as env rather than interpolated into the heredoc below, which is
          # unquoted and would otherwise execute a value containing $(...).
          RESOLVED: ${{ steps.server.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          REF: ${{ github.ref_name }}@${{ github.sha }}
          BUILD: ${{ inputs.build_images || false }}
          ARCHES: ${{ inputs.arch || 'amd64' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## PMM package tests matrix

          | setting | value |
          |---|---|
          | pmm-server | \`${SERVER_IMAGE}\` |
          | resolved | \`${RESOLVED}\` |
          | install_repo | \`${INSTALL_REPO}\` |
          | pmm_version | \`${VERSION}\` |
          | metrics_mode | \`${METRICS_MODE}\` |
          | tarball (amd64) | \`${TARBALL_AMD64:-none}\` |
          | tarball (arm64) | \`${TARBALL_ARM64:-none}\` |
          | pmm-qa | \`${REF}\` |
          | arch | \`${ARCHES}\` |
          | build_images | \`${BUILD}\` |
          EOF

  images:
    name: build images
    needs: prepare
    if: inputs.build_images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-package-test-images.yml

  test:
    name: ${{ matrix.os }}-${{ matrix.arch }} / ${{ matrix.test }}
    needs: [prepare, images]
    # Runs whether images succeeded, failed or was skipped. An OS whose image did
    # not build is tested on its previous image.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Up to three attempts, each held to the Jenkins job's 90 minutes.
    timeout-minutes: 300
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Keep the OS list in sync with build-package-test-images.yml.
        # The continuation lines must keep this indentation: YAML only folds a >-
        # block onto one line while every line shares the same indent.
        os: >-
          ${{ fromJSON((inputs.os || 'all') == 'all'
          && '["ol8","ol9","ol10","debian12","debian13","ubuntu2204","ubuntu2404","ubuntu2604"]'
          || format('["{0}"]', inputs.os)) }}
        arch: >-
          ${{ fromJSON((inputs.arch || 'amd64') == 'all'
          && '["amd64","arm64"]'
          || format('["{0}"]', inputs.arch || 'amd64')) }}
        test: >-
          ${{ fromJSON((inputs.test || 'all') == 'all'
          && '["pmm3-client_integration","pmm3-client_integration_auth_config","pmm3-client_integration_auth_register",
          "pmm3-client_integration_custom_path","pmm3-client_integration_custom_port","pmm3-client_integration_upgrade",
          "pmm3-client_integration_upgrade_custom_path","pmm3-client_integration_upgrade_custom_port"]'
          || format('["{0}"]', inputs.test)) }}
    steps:
      # So the pull works whether or not the packages have been made public: they
      # are linked to this repository, so its GITHUB_TOKEN can read them.
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # GHCR answers 403 now and then when all 64 cells hit it at once, which
          # otherwise loses a whole cell on a single unlucky request.
          for attempt in 1 2 3 4 5; do
            if echo "$GHCR_TOKEN" | sudo podman login ghcr.io -u "$GHCR_USER" --password-stdin; then
              exit 0
            fi
            echo "login failed, retrying in $((attempt * 10))s"
            sleep "$((attempt * 10))"
          done
          echo "could not log in to GHCR after 5 attempts"
          exit 1

      # Pulled here, with the same backoff, so that a 403 costs a retry rather than
      # the cell. Both `podman run` steps below then start from a local image.
      - name: Pull the client and server images
        env:
          CLIENT_IMAGE: ${{ env.CLIENT_IMAGE_REPO }}/package_tests:${{ matrix.os }}
          SERVER_IMAGE: ${{ needs.prepare.outputs.server_image }}
        run: |
          for image in "$CLIENT_IMAGE" "$SERVER_IMAGE"; do
            for attempt in 1 2 3 4 5; do
              sudo podman pull "$image" && break
              if [ "$attempt" -eq 5 ]; then echo "could not pull $image"; exit 1; fi
              echo "pull of $image failed, retrying in $((attempt * 10))s"
              sleep "$((attempt * 10))"
            done
          done

      # Runners come with MySQL installed, and AppArmor matches profiles by binary
      # path -- so the host profile also confines the mysqld in our container and
      # stops it writing its log. The playbook reads the temporary root password
      # from that log, so without this MySQL quietly ends up with no password.
      - name: Unload the host mysqld AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld && echo "unloaded"
          else
            echo "nothing to unload"
          fi

      # Checked out on the runner and copied in, rather than cloned inside the
      # container, so a run tests its own commit -- the pull request's merge commit,
      # or the branch it was dispatched from -- instead of main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pmm-qa
          persist-credentials: false

      # Starts the client and PMM Server, runs the playbook, and on a failure tears
      # both down and tries again from scratch, up to ATTEMPTS times. The step
      # fails only if every attempt did, so a caller waiting on the run sees the
      # final result.
      - name: Run ${{ matrix.test }}
        env:
          CLIENT_IMAGE: ${{ env.CLIENT_IMAGE_REPO }}/package_tests:${{ matrix.os }}
          SERVER_IMAGE: ${{ needs.prepare.outputs.server_image }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          TEST: ${{ matrix.test }}
          PMM_VERSION: ${{ needs.prepare.outputs.pmm_version }}
          # Percona Server has no el10 release build yet. Empty elsewhere,
          # which leaves the playbook on its own default.
          PS_REPOSITORY: ${{ matrix.os == 'ol10' && 'testing' || '' }}
        run: bash pmm-qa/.github/scripts/package-test-cell.sh

      - name: Record the result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          attempts=$(cat attempts.txt 2>/dev/null || echo 1)
          echo "${{ matrix.os }}-${{ matrix.arch }}|${{ matrix.test }}|${RESULT}|${attempts}" \
            > "result-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.test }}.txt"

      # overwrite: a re-run of a failed cell replaces its first attempt's result,
      # which upload-artifact otherwise refuses to do, failing the re-run.
      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.test }}
          path: result-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.test }}.txt
          retention-days: 7
          overwrite: true

      # ansible -vvv is far too big to read in the browser and is exactly what you
      # want when something fails. Uploaded whenever an attempt failed, including
      # one a retry then cleared, so a flaky playbook leaves a trace.
      - name: Upload logs from failed attempts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.test }}
          path: |
            ansible-*.log
            diagnostics-*.log
            pmm-summary-*.zip
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

      # The script tears down after every attempt; this covers a cancelled or
      # timed-out one.
      - name: Tear down
        if: always()
        run: |
          sudo podman rm -f client pmm-server || true
          sudo podman volume rm -f pmm-data || true

  report:
    name: summary
    needs: [prepare, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # If every cell died before reporting there is nothing to download; let the
        # next step say so rather than failing here.
        continue-on-error: true
        with:
          pattern: result-*
          merge-multiple: true
          path: results

      - name: Render the results grid
        run: |
          declare -A result tries
          for f in results/*.txt; do
            [ -e "$f" ] || continue
            IFS='|' read -r os test status attempts < "$f"
            result["$os/$test"]=$status
            tries["$os/$test"]=${attempts:-1}
          done

          if [ ${#result[@]} -eq 0 ]; then
            echo 'No results were produced -- no cell got as far as reporting.' \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Rows and columns come from what actually ran, so a filtered run gets a
          # small table and there is no OS or playbook list to keep in sync here.
          # -V keeps ol8 before ol10; the playbook names already sort correctly.
          oses=$(printf '%s\n' "${!result[@]}" | cut -d/ -f1 | sort -uV)
          tests=$(printf '%s\n' "${!result[@]}" | cut -d/ -f2 | sort -u)

          header="| OS-arch |"; divider="|---|"
          for t in $tests; do
            header+=" ${t#pmm3-client_} |"
            divider+="---|"
          done

          # A pass that took a retry is marked, so flakiness stays visible.
          passed=0; retried=0; failed=0; missing=0; body=""
          for os in $oses; do
            row="| \`$os\` |"
            for t in $tests; do
              case "${result[$os/$t]:-}" in
                success)
                  passed=$((passed + 1))
                  if [ "${tries[$os/$t]}" -gt 1 ]; then
                    row+=" 🔁 |"; retried=$((retried + 1))
                  else
                    row+=" ✅ |"
                  fi ;;
                failure) row+=" ❌ |"; failed=$((failed + 1)) ;;
                *)       row+=" · |";  missing=$((missing + 1)) ;;
              esac
            done
            body+="$row"$'\n'
          done

          retry_note=''; note=''
          if [ "$retried" -gt 0 ]; then retry_note=" (${retried} on a retry, marked 🔁)"; fi
          if [ "$missing" -gt 0 ]; then note=", ${missing} not run"; fi

          {
            echo
            echo '### Results'
            echo
            echo "$header"
            echo "$divider"
            printf '%s' "$body"
            echo
            echo "**${passed} passed${retry_note}, ${failed} failed${note}**"
            if [ "$failed" -gt 0 ] || [ "$retried" -gt 0 ]; then
              echo
              # shellcheck disable=SC2016  # backticks are markdown, not a subshell
              echo 'Each failed attempt attaches its logs to a `logs-<os>-<arch>-<test>` artifact.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$failed" -eq 0 ]
