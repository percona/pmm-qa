name: PMM Upgrade

on:
  workflow_dispatch:
    inputs:
      pmm_qa_branch:
        description: 'pmm-qa branch'
        default: 'main'
        type: string
  workflow_call:
    inputs:
      pmm_qa_branch:
        description: 'pmm-qa branch'
        default: 'main'
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      rc_version: ${{ steps.set.outputs.rc_version }}
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Compute upgrade matrix (last 6 releases)
        id: set
        shell: bash
        run: |
          VERSIONS=$(curl -fsS 'https://hub.docker.com/v2/repositories/percona/pmm-server/tags?page_size=100' \
            | jq -r '.results[].name | select(test("^3\\.[0-9]+\\.[0-9]+$"))' | sort -V | tail -6)
          RC_VERSION=$(curl -fsS 'https://hub.docker.com/v2/repositories/perconalab/pmm-server/tags?page_size=100&name=rc&ordering=last_updated' \
            | jq -r 'first(.results[].name | select(test("-rc$")))')
          DEV_LATEST_VERSION=$(curl -fsS https://raw.githubusercontent.com/Percona-Lab/pmm-submodules/refs/heads/v3/VERSION)
          echo "rc_version=perconalab/pmm-server:$RC_VERSION" >> "$GITHUB_OUTPUT"
          MATRIX=$(jq -Rnc --arg rc_tag "perconalab/pmm-server:$RC_VERSION" --arg rc_ver "${RC_VERSION%-rc*}" --arg dev_ver "$DEV_LATEST_VERSION" '
            [inputs | {version: ., docker_tag: ("percona/pmm-server:" + .), upgrade_tag: $rc_tag, upgrade_version: $rc_ver, pre_upgrade_version: .}] as $ga
            | {docker: ([{version: "pmm3-rc", docker_tag: $rc_tag, upgrade_tag: "perconalab/pmm-server:3-dev-latest", upgrade_version: $dev_ver, pre_upgrade_version: $rc_ver}] + $ga),
               ui: [$ga[] | select(.version | split(".")[1] | tonumber < 9)]}' <<< "$VERSIONS")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  upgrade-docker:
    name: Docker way upgrade for PMM
    uses: ./.github/workflows/upgrade-pmm-runner.yml
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix).docker }}
    with:
      docker_tag: ${{ matrix.docker_tag }}
      version: ${{ matrix.version }}
      upgrade_tag: ${{ matrix.upgrade_tag }}
      upgrade_version: ${{ matrix.upgrade_version }}
      upgrade_type: docker
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      rc_version: ${{ needs.prepare.outputs.rc_version }}
      pre_upgrade_version: ${{ matrix.pre_upgrade_version }}

  upgrade-ui:
    name: UI way upgrade for PMM
    uses: ./.github/workflows/upgrade-pmm-runner.yml
    needs: prepare
    # An empty include fails the job; skip once none of the last 6 releases is below 3.9.
    if: fromJSON(needs.prepare.outputs.matrix).ui[0] != null
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix).ui }}
    with:
      docker_tag: ${{ matrix.docker_tag }}
      version: ${{ matrix.version }}
      upgrade_tag: ${{ matrix.upgrade_tag }}
      upgrade_version: ${{ matrix.upgrade_version }}
      upgrade_type: ui
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      rc_version: ${{ needs.prepare.outputs.rc_version }}
      pre_upgrade_version: ${{ matrix.pre_upgrade_version }}
