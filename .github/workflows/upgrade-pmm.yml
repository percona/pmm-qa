name: PMM Upgrade

on:
  workflow_dispatch:
    inputs:
      pmm_qa_branch:
        description: 'pmm-qa branch'
        default: 'main'
        type: string
      pmm_image_tag:
        description: 'Tag under test (perconalab/pmm-server:<tag>). A tag with -rc also adds the RC -> 3-dev-latest leg.'
        default: '3-dev-latest'
        type: string
  workflow_call:
    inputs:
      pmm_qa_branch:
        description: 'pmm-qa branch'
        default: 'main'
        type: string
      pmm_image_tag:
        description: 'Tag under test (perconalab/pmm-server:<tag>). A tag with -rc also adds the RC -> 3-dev-latest leg.'
        default: '3-dev-latest'
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Compute upgrade matrix (last 5 minor versions)
        id: set
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.pmm_image_tag }}
        run: |
          VERSIONS=$(curl -fsS 'https://hub.docker.com/v2/repositories/percona/pmm-server/tags?page_size=100' \
            | jq -r '[.results[].name | select(test("^3\\.[0-9]+\\.[0-9]+$")) | split(".") | map(tonumber)]
                | (map(.[1]) | unique | .[-5:]) as $minors
                | map(select(.[1] | IN($minors[]))) | sort[] | map(tostring) | join(".")')
          DEV_LATEST_VERSION=$(curl -fsS https://raw.githubusercontent.com/Percona-Lab/pmm-submodules/refs/heads/v3/VERSION)
          UPGRADE_TAG="perconalab/pmm-server:$IMAGE_TAG"
          if [[ "$IMAGE_TAG" == *-rc* ]]; then
            UPGRADE_VERSION=${IMAGE_TAG%-rc*}
            CLIENT_REPOSITORY=
            RC_TAG=$UPGRADE_TAG
          else
            UPGRADE_VERSION=$DEV_LATEST_VERSION
            CLIENT_REPOSITORY=experimental
            RC_TAG=
          fi
          MATRIX=$(jq -Rnc --arg upgrade_tag "$UPGRADE_TAG" --arg upgrade_ver "$UPGRADE_VERSION" --arg client_repo "$CLIENT_REPOSITORY" \
            --arg rc_tag "$RC_TAG" --arg dev_ver "$DEV_LATEST_VERSION" '
            def supports_ui_upgrade: split(".") | map(tonumber) as [$major, $minor]
              | $major < 3 or ($major == 3 and ($minor // 0) < 9);
            (if $client_repo != "" then {client_upgrade_repository: $client_repo} else {} end) as $client
            | [inputs | {version: ., docker_tag: ("percona/pmm-server:" + .), upgrade_tag: $upgrade_tag, upgrade_version: $upgrade_ver,
                pre_upgrade_version: .} + $client] as $ga
            # Only an RC under test gets the RC -> 3-dev-latest leg; on dev builds the newest -rc tag is stale or already GA.
            | (if $rc_tag == "" then [] else [{version: "pmm3-rc", docker_tag: $rc_tag, upgrade_tag: "perconalab/pmm-server:3-dev-latest",
                upgrade_version: $dev_ver, pre_upgrade_version: $upgrade_ver}] end) as $rc
            | {docker: ($rc + $ga),
               ui: [$ga[] | select(.version | supports_ui_upgrade)]}' <<< "$VERSIONS")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  upgrade-docker:
    name: Docker way upgrade for PMM
    uses: ./.github/workflows/upgrade-pmm-runner.yml
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix).docker }}
    with:
      docker_tag: ${{ matrix.docker_tag }}
      version: ${{ matrix.version }}
      upgrade_tag: ${{ matrix.upgrade_tag }}
      upgrade_version: ${{ matrix.upgrade_version }}
      upgrade_type: docker
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pre_upgrade_version: ${{ matrix.pre_upgrade_version }}
      client_upgrade_repository: ${{ matrix.client_upgrade_repository }}

  upgrade-ui:
    name: UI way upgrade for PMM
    uses: ./.github/workflows/upgrade-pmm-runner.yml
    needs: prepare
    # An empty include fails the job; skip once none of the last 5 minors is below 3.9.
    if: fromJSON(needs.prepare.outputs.matrix).ui[0] != null
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix).ui }}
    with:
      docker_tag: ${{ matrix.docker_tag }}
      version: ${{ matrix.version }}
      upgrade_tag: ${{ matrix.upgrade_tag }}
      upgrade_version: ${{ matrix.upgrade_version }}
      upgrade_type: ui
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pre_upgrade_version: ${{ matrix.pre_upgrade_version }}
      client_upgrade_repository: ${{ matrix.client_upgrade_repository }}
