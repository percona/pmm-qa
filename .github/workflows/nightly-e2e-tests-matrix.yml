name: "Nightly E2E tests Matrix (remote PMM Server)"
# Triggered by Jenkins (pmm3-ui-tests-nightly-gha.groovy) once the PMM Server
# is up. Fans out one setup shard per group of client setups and one job per
# tag bucket, so each worker only runs the tests it has data for.

on:
  workflow_dispatch:
    inputs:
      pmm_server_address:
        description: "Hostname/IP of the externally-managed PMM Server (no scheme). Example: 12.34.56.78"
        required: true
        type: string
      admin_password:
        description: "Admin password configured on the remote PMM Server"
        required: false
        default: 'admin'
        type: string
      pmm_qa_branch:
        description: "Branch for pmm-qa repository to checkout"
        required: false
        default: 'main'
        type: string
      pmm_client_version:
        description: "PMM Client version (latest-tarball|pmm3-rc|x.xx.x|https://...)"
        required: false
        default: 'latest-tarball'
        type: string
      pmm_server_image:
        description: "PMM Server docker container version (image-name:version-tag)"
        required: false
        default: 'perconalab/pmm-server:3-dev-latest'
        type: string
      launchable_confidence:
        description: "Launchable subset confidence percentage"
        required: false
        default: '100%'
        type: string
      installation_type:
        description: "PMM Server installation type (docker|ami|helm|ha)"
        required: false
        default: 'docker'
        type: string

  workflow_call:
    inputs:
      pmm_server_address:
        required: true
        type: string
      admin_password:
        required: false
        default: 'admin'
        type: string
      pmm_qa_branch:
        required: false
        default: 'main'
        type: string
      pmm_client_version:
        required: false
        default: 'latest-tarball'
        type: string
      pmm_server_image:
        required: false
        default: 'perconalab/pmm-server:3-dev-latest'
        type: string
      launchable_confidence:
        required: false
        default: '100%'
        type: string
      installation_type:
        required: false
        default: 'docker'
        type: string
    secrets:
      LAUNCHABLE_TOKEN:
        required: false
      GH_TOKEN:
        required: false
      INVESTIGATOR_ROUTINE_TOKEN:
        required: false

jobs:
  # One shard provisions its whole `setup_services` list on a single runner:
  # the setup runner passes --parallel, so a shard costs its slowest member
  # rather than the sum. That grouping is the point of these five shards --
  # fourteen single-setup shards plus the three consumers below claimed
  # seventeen runners per nightly run, and a few concurrent runs exhausted the
  # org's GHA job allowance, leaving every shard queued instead of provisioning.
  #
  # Setups that may not share a shard. Three pairs cannot share a host at all,
  # because each holds a fixed container name or host port for as long as it is
  # up, so the second one fails in either order:
  #   * PSMDB with PSMDB      -- docker-compose-rs.yaml and
  #     docker-compose-sharded.yaml both pin container_name rs101..rs203 and
  #     publish host port 27027 (preflight refuses this pair)
  #   * EXTERNAL with VALKEY  -- both publish host port 6379 (refused too)
  #   * PXC with PXC          -- container pxc_proxysql_pmm_<ver> and host port
  #     6033 are fixed; preflight only downgrades this pair to sequential,
  #     which does not save it
  # Two more can run one after another but not at once, so preflight downgrades
  # a shard holding either to sequential -- and a sequential shard costs the sum
  # of its setups rather than its slowest one, which defeats the grouping:
  #   * PS with PS or MYSQL   -- they share the $HOME/mysql_cluster_data staging
  #     directory that each run wipes, and each probes for a free host port from
  #     3306 (find_first_empty_docker_port), so concurrent runs race
  #   * PDPGSQL with PDPGSQL  -- the same, for $HOME/pgsql_cluster_data
  setup:
    name: "setup / ${{ matrix.shard_name }}"
    strategy:
      fail-fast: true
      matrix:
        include:
          - shard_name: mysql-psmdb-pgsql
            setup_services: '--database mysql --database psmdb,SETUP_TYPE=pss --database pgsql'
          - shard_name: ps-gr-pxc-valkey
            setup_services: '--database ps,SETUP_TYPE=gr --database pxc --database valkey'
          - shard_name: ps-replication-psmdb-sharded
            setup_services: '--database ps,SETUP_TYPE=replication --database psmdb,SETUP_TYPE=sharding'
          - shard_name: ps-myrocks-pdpgsql-patroni-external
            setup_services: '--database ps,QUERY_SOURCE=slowlog,MY_ROCKS=true --database pdpgsql,SETUP_TYPE=patroni --database external'
          - shard_name: extra-pxc-pdpgsql-haproxy
            setup_services: '--database pxc --database pdpgsql --database haproxy'

    uses: ./.github/workflows/runner-e2e-tests-codeceptjs-remote-nightly-setup.yml
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    with:
      pmm_server_address: ${{ inputs.pmm_server_address }}
      admin_password: ${{ inputs.admin_password || 'admin' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pmm_client_version: ${{ inputs.pmm_client_version || 'latest-tarball' }}
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      setup_services: ${{ matrix.setup_services }}
      shard_name: ${{ matrix.shard_name }}
      # 3: the two CodeceptJS `test_execution / ...` jobs plus the Playwright
      # `test_execution / playwright ...` job below. The setup shards poll by
      # job-name prefix "test execution / " to know when it's safe to finish
      # waiting -- undercounting here lets a shard finish (and its runner
      # terminate) while a still-running consumer job needs it.
      expected_test_jobs: 3

  test_execution:
    name: "test execution / ${{ matrix.tags_for_tests }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - tags_for_tests: '@qan|@valkey-nightly|@permissions-nightly|@pt-summary-nightly|@pbm-nightly'
          - tags_for_tests: '@nightly'
    uses: ./.github/workflows/runner-e2e-tests-codeceptjs-remote-nightly-tests.yml
    secrets:
      LAUNCHABLE_TOKEN: ${{ secrets.LAUNCHABLE_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    with:
      pmm_server_address: ${{ inputs.pmm_server_address }}
      admin_password: ${{ inputs.admin_password || 'admin' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pmm_client_version: ${{ inputs.pmm_client_version || 'latest-tarball' }}
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      tags_for_tests: ${{ matrix.tags_for_tests }}
      expected_setup_jobs: 5
      workers: 1
      launchable_confidence: ${{ inputs.launchable_confidence || '100%' }}
      installation_type: ${{ inputs.installation_type || 'docker' }}

  # Migrated CodeceptJS scenarios keep their original tag bucket so coverage
  # stays equivalent once the CodeceptJS source retires. `--grep` is a regex:
  # add a migrated tag to the alternation, not as a matrix entry (a runner per
  # tag, plus `expected_test_jobs` above). Not `@nightly` -- here it also marks
  # tests owned by other jobs whose services these shards never provision.
  test_execution_playwright:
    # Name must start with "test execution / " -- the setup shards' own wait
    # step (runner-e2e-tests-codeceptjs-remote-nightly-setup.yml) polls jobs
    # by that literal prefix to count consumers; anything else is invisible
    # to it and the shard can finish/terminate while this job still needs it.
    name: "test execution / playwright ${{ matrix.tags_for_tests }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - tags_for_tests: '@annotations|@menu'
    uses: ./.github/workflows/runner-e2e-tests-playwright-remote-nightly-tests.yml
    secrets:
      LAUNCHABLE_TOKEN: ${{ secrets.LAUNCHABLE_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    with:
      pmm_server_address: ${{ inputs.pmm_server_address }}
      admin_password: ${{ inputs.admin_password || 'admin' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pmm_client_version: ${{ inputs.pmm_client_version || 'latest-tarball' }}
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      tags_for_tests: ${{ matrix.tags_for_tests }}
      expected_setup_jobs: 5
      workers: 1
      launchable_confidence: ${{ inputs.launchable_confidence || '100%' }}
      installation_type: ${{ inputs.installation_type || 'docker' }}

  notify_investigator:
    name: Fire Investigator routine
    needs:
      - setup
      - test_execution
      - test_execution_playwright
    if: >
      !cancelled() &&
      github.workflow == 'Nightly E2E tests Matrix (remote PMM Server)' &&
      github.ref_name == github.event.repository.default_branch &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: ./.github/actions/notify-investigator
        with:
          routine-token: ${{ secrets.INVESTIGATOR_ROUTINE_TOKEN }}
