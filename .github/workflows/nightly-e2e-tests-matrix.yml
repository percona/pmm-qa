name: "Nightly E2E tests Matrix (remote PMM Server)"
# Triggered by Jenkins (pmm3-ui-tests-nightly-gha.groovy) once the PMM Server
# is up. Fans out one setup shard per group of client setups and one job per
# tag bucket, so each worker only runs the tests it has data for.

on:
  workflow_dispatch:
    inputs:
      pmm_server_address:
        description: "Hostname/IP of the externally-managed PMM Server (no scheme). Example: 12.34.56.78"
        required: true
        type: string
      admin_password:
        description: "Admin password configured on the remote PMM Server"
        required: false
        default: 'admin'
        type: string
      pmm_qa_branch:
        description: "Branch for pmm-qa repository to checkout"
        required: false
        default: 'main'
        type: string
      pmm_client_version:
        description: "PMM Client version (latest-tarball|pmm3-rc|x.xx.x|https://...)"
        required: false
        default: 'latest-tarball'
        type: string
      pmm_server_image:
        description: "PMM Server docker container version (image-name:version-tag)"
        required: false
        default: 'perconalab/pmm-server:3-dev-latest'
        type: string
      launchable_confidence:
        description: "Launchable subset confidence percentage"
        required: false
        default: '100%'
        type: string
      installation_type:
        description: "PMM Server installation type (docker|ami|helm|ha)"
        required: false
        default: 'docker'
        type: string

  workflow_call:
    inputs:
      pmm_server_address:
        required: true
        type: string
      admin_password:
        required: false
        default: 'admin'
        type: string
      pmm_qa_branch:
        required: false
        default: 'main'
        type: string
      pmm_client_version:
        required: false
        default: 'latest-tarball'
        type: string
      pmm_server_image:
        required: false
        default: 'perconalab/pmm-server:3-dev-latest'
        type: string
      launchable_confidence:
        required: false
        default: '100%'
        type: string
      installation_type:
        required: false
        default: 'docker'
        type: string
    secrets:
      LAUNCHABLE_TOKEN:
        required: false
      GH_TOKEN:
        required: false
      INVESTIGATOR_ROUTINE_TOKEN:
        required: false

jobs:
  # One runner per shard, and three of the five also run a tag bucket instead of
  # sitting idle while separate test runners do it. The databases live on the
  # shard's own runner, so a test bucket placed here is already next to data it
  # would otherwise reach over the network -- and the three runners that used to
  # host nothing but a browser are gone.
  #
  # fail-fast is off because a bucket failing its tests must not cancel the
  # shards whose databases the other buckets are still querying. A failed setup
  # still stops every bucket: nothing runs tests until all five shards pass
  # 'Barrier: setup complete', and that wait aborts the moment a sibling's setup
  # job ends in failure.
  shard:
    # The box in the UI has to say what the shard runs, not just which databases
    # it hosts -- three of these also run a tag bucket.
    name: "${{ matrix.shard_name }}${{ matrix.tags_for_tests && format(' + {0}', matrix.tags_for_tests) || ' (databases only)' }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_name: mysql-psmdb-pgsql
            setup_services: '--database mysql --database psmdb,SETUP_TYPE=pss --database pgsql'
            tags_for_tests: '@qan|@valkey-nightly|@permissions-nightly|@pt-summary-nightly|@pbm-nightly'
            tests_framework: codeceptjs
          - shard_name: ps-gr-pxc-valkey
            setup_services: '--database ps,SETUP_TYPE=gr --database pxc --database valkey'
            tags_for_tests: '@nightly'
            tests_framework: codeceptjs
          - shard_name: ps-replication-psmdb-sharded
            setup_services: '--database ps,SETUP_TYPE=replication --database psmdb,SETUP_TYPE=sharding'
            tags_for_tests: '@nightly'
            tests_framework: playwright
          - shard_name: ps-myrocks-pdpgsql-patroni-external
            setup_services: '--database ps,QUERY_SOURCE=slowlog,MY_ROCKS=true --database pdpgsql,SETUP_TYPE=patroni --database external'
            tags_for_tests: ''
            tests_framework: ''
          - shard_name: extra-pxc-pdpgsql-haproxy
            setup_services: '--database pxc --database pdpgsql --database haproxy'
            tags_for_tests: ''
            tests_framework: ''

    uses: ./.github/workflows/runner-e2e-tests-remote-nightly-shard.yml
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      LAUNCHABLE_TOKEN: ${{ secrets.LAUNCHABLE_TOKEN }}
    with:
      pmm_server_address: ${{ inputs.pmm_server_address }}
      admin_password: ${{ inputs.admin_password || 'admin' }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch || 'main' }}
      pmm_client_version: ${{ inputs.pmm_client_version || 'latest-tarball' }}
      pmm_server_image: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      setup_services: ${{ matrix.setup_services }}
      shard_name: ${{ matrix.shard_name }}
      tags_for_tests: ${{ matrix.tags_for_tests }}
      tests_framework: ${{ matrix.tests_framework }}
      launchable_confidence: ${{ inputs.launchable_confidence || '100%' }}
      installation_type: ${{ inputs.installation_type || 'docker' }}
      workers: 1
      # Both counts are read by the two barrier waits. Undercutting the first
      # lets a bucket start against a half-provisioned fleet; undercutting the
      # second lets a shard finish -- terminating its runner and its databases --
      # while another bucket is still querying them.
      expected_setup_jobs: 5
      expected_test_shards: 3

  notify_investigator:
    name: Fire Investigator routine
    needs:
      - shard
    if: >
      !cancelled() &&
      github.workflow == 'Nightly E2E tests Matrix (remote PMM Server)' &&
      github.ref_name == github.event.repository.default_branch &&
      contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: ./.github/actions/notify-investigator
        with:
          routine-token: ${{ secrets.INVESTIGATOR_ROUTINE_TOKEN }}
