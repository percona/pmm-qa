---
name: runner-e2e-tests-playwright-podman

on:
  workflow_dispatch:
    inputs:
      pmm_qa_branch:
        description: 'Branch for the pmm-qa repository.'
        type: string
        default: 'main'
        required: true
      pmm_test_flag:
        description: 'Flag to run only specific portion of the tests.'
        type: string
        required: false
        default: '@user-password'
      pmm_server_image:
        description: 'PMM Server image run under podman'
        type: string
        default: 'perconalab/pmm-server:3-dev-latest'
        required: true
      pmm_client_version:
        description: 'Version of the pmm client used for testing'
        type: string
        default: 'latest-tarball'
        required: true
      pmm_client_image:
        description: 'pmm-client docker image used by the client containers'
        type: string
        required: false
      setup_services:
        description: 'Clients for pmm-server'
        type: string
        default: '--database ps --database psmdb'
        required: true
      workers:
        description: 'Number of workers for Playwright tests'
        type: number
        default: 1
        required: false

  workflow_call:
    inputs:
      pmm_qa_branch:
        type: string
        required: true
      pmm_test_flag:
        type: string
        required: false
      pmm_server_image:
        type: string
        required: true
      pmm_client_version:
        type: string
        required: true
      pmm_client_image:
        type: string
        required: false
      setup_services:
        type: string
        required: false
      workers:
        type: number
        required: false
      sha:
        type: string
        required: false

jobs:
  tests:
    # Mongo Replica setup fails on ubuntu-latest, so this is pinned like the
    # CodeceptJS podman runner it was derived from.
    name: "podman e2e tests: ${{ inputs.pmm_test_flag || '' }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      SHA: ${{ inputs.sha || 'null' }}

      PMM_TEST_FLAG: ${{ inputs.pmm_test_flag }}

      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PMM_QA_BRANCH: ${{ inputs.pmm_qa_branch || github.event.inputs.pmm_qa_branch || 'main' }}
      PMM_QA_GIT_BRANCH: ${{ inputs.pmm_qa_branch || github.event.inputs.pmm_qa_branch || 'main' }}
      DOCKER_VERSION: ${{ inputs.pmm_server_image || github.event.inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      CLIENT_DOCKER_VERSION: ${{ inputs.pmm_client_image || github.event.inputs.pmm_client_image || 'perconalab/pmm-client:3-dev-latest' }}
      PMM_CLIENT_VERSION: ${{ inputs.pmm_client_version || github.event.inputs.pmm_client_version || 'latest-tarball' }}
      WIZARD_ARGS: ${{ inputs.setup_services || github.event.inputs.setup_services || '' }}
      ADMIN_PASSWORD: 'admin-password'
      WORKERS: ${{ inputs.workers || 1 }}

    steps:
      - name: PMM server version ${{ inputs.pmm_server_image }} and UI tests for flag "${{ inputs.pmm_test_flag }}" on pmm-qa branch ${{ inputs.pmm_qa_branch }}
        if: ${{ github.event_name != 'pull_request' && env.SHA != 'null' }}
        uses: percona/gh-action-github-status-action@v1
        continue-on-error: true
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: "${{ env.PMM_TEST_FLAG }} podman UI tests"
          description: "Test execution ${{ job.status }}"
          state: "pending"
          repository: ${{ github.repository }}
          target_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          sha: ${{ env.SHA }}

      - name: Checkout pmm-qa repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.PMM_QA_BRANCH }}
          repository: percona/pmm-qa
          path: ./pmm-qa

      - name: Setup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates dirmngr ansible libaio1 libaio-dev libnuma-dev libncurses6 socat sysbench
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv 8919F6BD2B48D754
          echo "deb https://packages.clickhouse.com/deb stable main" | sudo tee \
              /etc/apt/sources.list.d/clickhouse.list
          . /etc/os-release
          echo "deb https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/stable/xUbuntu_${VERSION_ID}/ /" | sudo tee \
              /etc/apt/sources.list.d/devel:kubic:libcontainers:stable.list
          curl -L "https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/stable/xUbuntu_${VERSION_ID}/Release.key" | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y clickhouse-client podman
          sudo curl -s https://raw.githubusercontent.com/datacharmer/dbdeployer/master/scripts/dbdeployer-install.sh | bash
          ls -la
          pushd ./pmm-qa
          wget https://raw.githubusercontent.com/Percona-QA/percona-qa/master/get_download_link.sh
          chmod +x get_download_link.sh
          popd
          sudo sysctl net.ipv4.ip_unprivileged_port_start=80

      - name: Setup PMM3-Server
        # yamllint disable rule:line-length
        # ExecStart below is a systemd unit line inside a heredoc, not
        # shell; systemd owns its own continuation syntax.
        run: |
          mkdir -p ~/.config/systemd/user/
          cat > ~/.config/systemd/user/pmm-server.service <<EOF
          [Unit]
          Description=pmm-server
          Wants=network-online.target
          After=network-online.target
          After=nss-user-lookup.target nss-lookup.target
          After=time-sync.target

          [Service]
          Type=simple

          # set environment for this unit
          Environment=PMM_HTTP_PORT=80
          Environment=PMM_PUBLIC_PORT=443
          Environment=PMM_VOLUME_NAME=%N
          Environment=PMM_SERVER_IMAGE=docker.io/${{ env.DOCKER_VERSION }}
          Environment=PMM_ENV_FILE=%h/.config/pmm-server/pmm-server.env

          # optional env file that could override previous env settings for this unit
          EnvironmentFile=-%h/.config/pmm-server/env

          ExecStart=/usr/bin/podman run --rm --replace=true --name=%N -p \${PMM_PUBLIC_PORT}:8443/tcp -p \${PMM_HTTP_PORT}:8080/tcp --ulimit=host --volume=\${PMM_VOLUME_NAME}:/srv --env-file=\${PMM_ENV_FILE} --health-cmd=none --health-interval=disable \${PMM_SERVER_IMAGE}
          ExecStop=/usr/bin/podman stop -t 10 %N
          Restart=on-failure
          RestartSec=20

          [Install]
          Alias=%N
          WantedBy=default.target

          EOF

          mkdir -p ~/.config/pmm-server/
          cat > ~/.config/pmm-server/pmm-server.env <<EOF
          DISABLE_UPDATES=1
          #ENABLE_DBAAS=1
          PMM_DEBUG=1
          PMM_ENABLE_INTERNAL_PG_QAN=1
          GF_SECURITY_ADMIN_PASSWORD=${{ env.ADMIN_PASSWORD }}
          PERCONA_TEST_SAAS_HOST=check-dev.percona.com:443
          PMM_DEV_PERCONA_PLATFORM_PUBLIC_KEY=RWTg+ZmCCjt7O8eWeAmTLAqW+1ozUbpRSKSwNTmO+exlS5KEIPYWuYdX
          PMM_DEV_PERCONA_PLATFORM_ADDRESS=https://check-dev.percona.com:443
          PERCONA_TEST_TELEMETRY_INTERVAL=10s
          PERCONA_TEST_TELEMETRY_RETRY_BACKOFF=10s

          EOF

          systemctl --user enable --now pmm-server

          export CONTAINER_NAME="pmm-server"
          export LOGS="pmm-managed entered RUNNING state"
          attempt=0
          while [ $attempt -le 3 ]; do
            attempt=$(( attempt + 1 ))
            echo "Waiting for ${CONTAINER_NAME} to be up (attempt: $attempt)..."
            result=$(systemctl --user status ${CONTAINER_NAME})
            if grep "${LOGS}" <<< "$result" ; then
              echo "${CONTAINER_NAME} is ready!"
              break
            fi
            sleep 10
          done;
          # shellcheck disable=SC2016
          # Deliberately unexpanded: the inner bash -c does the expanding, and
          # curl's %{http_code} must reach curl literally.
          timeout 100 bash -c 'while [[ "$(curl -s -o /dev/null -w "%{http_code}" --user "admin:${ADMIN_PASSWORD}" http://127.0.0.1/v1/server/readyz)" != "200" ]]; do sleep 5; done'

        # yamllint enable rule:line-length
      - name: Print Podman logs on failure
        if: ${{ failure() }}
        run: |
          echo "---systemctl-status---"
          systemctl --user status pmm-server || true
          echo "---systemctl-status---"
          echo "---podman-logs---"
          podman logs pmm-server 2>&1 || true
          echo "---podman-logs---"
          echo "---journal-logs---"
          journalctl --user -u pmm-server --no-pager -n 100 || true
          echo "---journal-logs---"

      - name: Install playwright
        working-directory: ./pmm-qa/e2e_tests/
        run: |
          npm ci
          npx playwright install-deps
          npx playwright install chromium

      - name: 'Create report name'
        if: always()
        run: |
          job_tag=$(echo "${{ env.PMM_TEST_FLAG }}" | sed -e "s/@//" -e "s/|/-/g")
          report_name="podman-$job_tag"
          echo "$report_name"
          echo "REPORT_NAME=$report_name" >> "$GITHUB_ENV"

      - name: Setup PMM-Client
        working-directory: ./pmm-qa/qa-integration/pmm_qa
        run: sudo bash -x pmm3-client-setup.sh --pmm_server_ip 127.0.0.1 --client_version ${{ env.PMM_CLIENT_VERSION }} --admin_password ${{ env.ADMIN_PASSWORD }} --use_metrics_mode no

      # PMM Server is a podman container publishing to the host, while
      # pmm-framework starts the monitored databases under docker. They reach
      # the server over the docker0 bridge address, not 127.0.0.1, so this
      # keeps the CodeceptJS podman runner's --pmm-server-ip rather than the
      # docker runner's form.
      - name: Run Setup for E2E Tests
        working-directory: pmm-qa/qa-integration/pmm_qa
        run: |
          HOST_IP=$(ip -4 addr show docker0 | awk '/inet / {print $2}' | cut -d/ -f1)
          export HOST_IP
          ./pmm-framework/pmm-framework --parallel --verbosity-level=2 --pmm-server-ip="$HOST_IP" --pmm-server-password=${{ env.ADMIN_PASSWORD }} ${{ env.WIZARD_ARGS }}

      # Podman publishes PMM on plain http port 80, so PMM_UI_URL has to be set
      # explicitly -- playwright.config.ts would otherwise fall back to
      # http://localhost/.
      - name: 'Run UI tests: ${{ env.PMM_TEST_FLAG }}'
        working-directory: pmm-qa/e2e_tests/
        env:
          PMM_UI_URL: 'http://127.0.0.1/'
        run: npx playwright test --grep "${{ env.PMM_TEST_FLAG }}"

      - name: Download logs
        if: always()
        working-directory: pmm-qa/e2e_tests
        run: |
          curl --insecure http://admin:${{ env.ADMIN_PASSWORD }}@127.0.0.1/logs.zip --output logs.zip
          unzip logs.zip -d logs

      - name: Generate and Attach the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPORT_NAME }}
          path: |
            ./pmm-qa/e2e_tests/playwright-report
            ./pmm-qa/e2e_tests/screenshots
            ./pmm-qa/e2e_tests/logs

      - name: Create status check
        uses: percona/gh-action-github-status-action@v1
        if: ${{ github.event_name != 'pull_request' && env.SHA != 'null' && always() }}
        continue-on-error: true
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          context: "${{ env.PMM_TEST_FLAG }} podman UI tests"
          description: "Test execution ${{ job.status }}"
          state: ${{ job.status }}
          repository: ${{ github.repository }}
          target_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          sha: ${{ env.SHA }}
