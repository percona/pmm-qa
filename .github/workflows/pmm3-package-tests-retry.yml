# Re-runs the failed jobs of a PMM package tests matrix run once, each on a fresh
# runner with a fresh PMM Server and client container. A failed playbook cannot
# simply be run again where it failed: its first attempt has already changed the
# MySQL root password and registered its services with PMM Server.
#
# workflow_run only fires for workflow files on the default branch, so this does
# nothing until it is merged.
name: PMM package tests retry

on:
  workflow_run:
    workflows: [PMM package tests matrix]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    name: re-run failed jobs
    # Once only: the second attempt's completion fires this again.
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run the failed jobs of run ${{ github.event.workflow_run.id }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # A failed "resolve inputs" means inputs no second attempt can fix, such
          # as install_repo=testing without a pmm_version.
          failed=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name]')
          echo "failed jobs: $failed"
          if jq -e 'index("resolve inputs")' <<<"$failed" >/dev/null; then
            echo "resolve inputs failed, so there is nothing to retry"
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
