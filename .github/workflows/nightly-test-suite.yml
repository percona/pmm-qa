name: "Nightly Test Suite"

# The GitHub Actions half of the nightly, in one dispatch -- the Jenkins
# orchestrator drives this and its own suites. pmm_image_tag names the images
# every job below runs, so the same workflow serves a release candidate and the
# dev build.

on:
  workflow_dispatch:
    inputs:
      pmm_image_tag:
        description: 'Tag under test, used verbatim as perconalab/pmm-server:<tag> and pmm-client:<tag>. E.g. 3-dev-latest, 3.9.1-rc, 3.9.1-rc2612.'
        required: false
        default: '3-dev-latest'
        type: string
      pmm_client_tarball_ol8:
        description: 'OL8 pmm-client dynamic tarball URL (from client autobuild)'
        required: false
        default: 'https://pmm-build-cache.s3.us-east-2.amazonaws.com/PR-BUILDS/pmm-client/pmm-client-dynamic-ol8-latest.tar.gz'
        type: string
      pmm_client_tarball_ol9:
        description: 'OL9 pmm-client dynamic tarball URL (from client autobuild)'
        required: false
        default: 'https://pmm-build-cache.s3.us-east-2.amazonaws.com/PR-BUILDS/pmm-client/pmm-client-dynamic-ol9-latest.tar.gz'
        type: string
      pmm_qa_branch:
        description: 'PMM QA branch'
        required: false
        default: 'main'
        type: string
      pxc_version:
        description: 'PMM_PROXYSQL: PXC version or VERSIONS URL'
        required: false
        default: '8.0'
        type: string
      pxc_glibc:
        description: 'PMM_PROXYSQL: glibc suffix (e.g. 2.35)'
        required: false
        default: '2.35'
        type: string
      pdpgsql_version:
        description: 'PMM_PDPGSQL: major version (15, 16, 17, …)'
        required: false
        default: '17'
        type: string
      skip_compatibility:
        description: 'Skip backward-compatibility CLI matrix (patch RCs)'
        required: false
        default: false
        type: boolean

jobs:
  resolve:
    name: Resolve build under test
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      server_image: ${{ steps.pick.outputs.server_image }}
      client_image: ${{ steps.pick.outputs.client_image }}
      client_version: ${{ steps.pick.outputs.client_version }}
      repository: ${{ steps.pick.outputs.repository }}
    steps:
      - id: pick
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.pmm_image_tag }}
        run: |
          set -euo pipefail
          # The tag is taken as given -- nothing is appended to it. A tag
          # carrying -rc selects the release-candidate package repositories,
          # any other tag the dev ones.
          if [[ "$IMAGE_TAG" == *-rc* ]]; then
            repository='release candidate'
            client_version=pmm3-rc
          else
            repository=dev-latest
            client_version=latest-tarball
          fi
          {
            echo "server_image=perconalab/pmm-server:${IMAGE_TAG}"
            echo "client_image=perconalab/pmm-client:${IMAGE_TAG}"
            echo "client_version=${client_version}"
            echo "repository=${repository}"
          } >> "$GITHUB_OUTPUT"

  get_compat_versions:
    name: GA pmm-client tags (pmm-version-getter)
    needs: resolve
    uses: ./.github/workflows/pmm-version-getter.yml
    with:
      repository: ${{ needs.resolve.outputs.repository }}
      matrix_range: '5'

  plan:
    name: Compatibility matrix (percona/pmm-client)
    needs: get_compat_versions
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      compat_matrix: ${{ steps.pick.outputs.compat_matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          VERSIONS_JSON: ${{ needs.get_compat_versions.outputs.version_matrix }}
        run: |
          set -euo pipefail
          n="$(echo "$VERSIONS_JSON" | jq 'length')"
          if [[ "$n" -lt 1 ]]; then
            echo '::error::pmm-version-getter returned no GA tags for compatibility (check Docker Hub).'
            exit 1
          fi
          tarballs=https://downloads.percona.com/downloads/pmm3
          compat_matrix_json="$(echo "$VERSIONS_JSON" | jq --arg t "$tarballs" \
            'map({version: ., image: ("percona/pmm-client:" + .), tarball: "\($t)/\(.)/binary/tarball/pmm-client-\(.)-x86_64.tar.gz"})')"
          {
            echo "compat_matrix<<__COMPAT_MATRIX_EOF__"
            echo "$compat_matrix_json"
            echo "__COMPAT_MATRIX_EOF__"
          } >> "$GITHUB_OUTPUT"

  cli_integration_tests:
    name: CLI integration (pmm-cli-integration-tests)
    needs: [plan, resolve]
    uses: ./.github/workflows/integration-cli-tests.yml
    secrets:
      LAUNCHABLE_TOKEN: ${{ secrets.LAUNCHABLE_TOKEN }}
    with:
      pmm_qa_branch: ${{ inputs.pmm_qa_branch }}
      pmm_server_image: ${{ needs.resolve.outputs.server_image }}
      pmm_client_image: ${{ needs.resolve.outputs.client_image }}
      pmm_client_version: ${{ needs.resolve.outputs.client_version }}

  compatibility_integration_tests:
    if: ${{ !inputs.skip_compatibility }}
    name: Compatibility CLI (${{ matrix.version }})
    needs: [plan, resolve]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.compat_matrix) }}
    uses: ./.github/workflows/integration-cli-tests.yml
    secrets:
      LAUNCHABLE_TOKEN: ${{ secrets.LAUNCHABLE_TOKEN }}
    with:
      pmm_qa_branch: ${{ inputs.pmm_qa_branch }}
      pmm_server_image: ${{ needs.resolve.outputs.server_image }}
      pmm_client_image: ${{ matrix.image }}
      pmm_client_version: ${{ matrix.tarball }}

  e2e_tests_matrix:
    name: E2E Tests Matrix (CodeceptJS)
    needs: [plan, resolve]
    uses: ./.github/workflows/e2e-tests-matrix.yml
    secrets: inherit
    with:
      pmm_server_image: ${{ needs.resolve.outputs.server_image }}
      pmm_client_image: ${{ needs.resolve.outputs.client_image }}
      pmm_client_version: ${{ needs.resolve.outputs.client_version }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch }}

  helm_tests:
    name: pmm3-helm
    needs: [plan, resolve]
    uses: ./.github/workflows/helm-tests.yml
    secrets: inherit
    with:
      server_image: ${{ needs.resolve.outputs.server_image }}
      client_image: ${{ needs.resolve.outputs.client_image }}
      pmm_chart_branch: latest
      pmm_qa_branch: ${{ inputs.pmm_qa_branch }}

  gssapi_tests:
    name: GSSAPI Tests Matrix
    needs: [plan, resolve]
    uses: ./.github/workflows/gssapi-psmdb-tests-matrix.yml
    secrets: inherit
    with:
      pmm_server_image: ${{ needs.resolve.outputs.server_image }}
      pmm_client_image: ${{ needs.resolve.outputs.client_image }}
      pmm_qa_branch: ${{ inputs.pmm_qa_branch }}
      pmm_client_version_ol8: ${{ inputs.pmm_client_tarball_ol8 }}
      pmm_client_version_ol9: ${{ inputs.pmm_client_tarball_ol9 }}
      repository: ${{ needs.resolve.outputs.repository }}
      expected_version: ${{ inputs.pmm_image_tag }}

  qa_integration_psmdb_pbm_full:
    name: PMM_PSMDB_PBM_FULL
    needs: [plan, resolve]
    uses: ./.github/workflows/PMM_PSMDB_PBM_FULL.yml
    with:
      pmm_qa_branch: ${{ inputs.pmm_qa_branch }}
      pmm_client_version: ${{ needs.resolve.outputs.client_version }}
      pmm_server_image: ${{ needs.resolve.outputs.server_image }}

  qa_integration_proxysql:
    name: PMM_PROXYSQL
    needs: [plan, resolve]
    uses: ./.github/workflows/PMM_PROXYSQL.yaml
    with:
      pmm_qa_branch: ${{ inputs.pmm_qa_branch }}
      pxc_version: ${{ inputs.pxc_version }}
      pxc_glibc: ${{ inputs.pxc_glibc }}
      pmm_server_image: ${{ needs.resolve.outputs.server_image }}
      pmm_client_version: ${{ needs.resolve.outputs.client_version }}

  qa_integration_pdpgsql:
    name: PMM_PDPGSQL
    needs: [plan, resolve]
    uses: ./.github/workflows/PMM_PDPGSQL.yaml
    with:
      pmm_qa_branch: ${{ inputs.pmm_qa_branch }}
      pdpgsql_version: ${{ inputs.pdpgsql_version }}
      pmm_server_image: ${{ needs.resolve.outputs.server_image }}
      pmm_client_version: ${{ needs.resolve.outputs.client_version }}

  report:
    name: Publish nightly report
    if: ${{ always() }}
    needs:
      - cli_integration_tests
      - compatibility_integration_tests
      - e2e_tests_matrix
      - helm_tests
      - gssapi_tests
      - qa_integration_psmdb_pbm_full
      - qa_integration_proxysql
      - qa_integration_pdpgsql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: nightly
      - name: Build and publish report
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IMAGE_TAG: ${{ inputs.pmm_image_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nightly/ci/build_report.sh > "$RUNNER_TEMP/run.json"
          cat "$RUNNER_TEMP/run.json"
          nightly/ci/publish_report.sh "$RUNNER_TEMP/run.json"
