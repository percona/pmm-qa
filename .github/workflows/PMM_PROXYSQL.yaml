name: PMM_PROXYSQL

on:
  workflow_dispatch:
    inputs:
      pmm_qa_branch:
        description: 'Branch of PMM QA'
        default: 'main'
        required: false
        type: string
      pxc_version:
        description: 'PXC major (8.0, packaged), release (8.0.33-25, its TESTING tarball) or VERSIONS URL (its PXC80_VER tarball)'
        default: 'https://github.com/Percona-QA/package-testing/blob/master/VERSIONS'
        required: true
        type: string
      pxc_glibc:
        description: 'PXC tarball glibc suffix; the PXC image is UBI9, glibc 2.34'
        default: '2.34'
        required: true
        type: string
      pmm_server_image:
        description: 'PMM Server image, example: perconalab/pmm-server:3-dev-latest'
        default: 'perconalab/pmm-server:3-dev-latest'
        required: false
        type: string
      pmm_client_version:
        description: 'PMM Client version (3-dev-latest|pmm3-rc|x.xx.x|https...)'
        default: 'latest-tarball'
        required: false
        type: string

  workflow_call:
    inputs:
      pmm_qa_branch:
        required: false
        type: string
      pxc_version:
        required: false
        type: string
      pxc_glibc:
        required: false
        type: string
      pmm_server_image:
        required: false
        type: string
      pmm_client_version:
        required: false
        type: string

jobs:
  PMM_PXC_TEST:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      ADMIN_PASSWORD: 'admin'
      # Not PXC_VERSION: pmm-framework reads that and accepts only a major.
      PXC_INPUT: ${{ inputs.pxc_version || '8.0' }}
      PXC_GLIBC: ${{ inputs.pxc_glibc || '2.34' }}
      PMM_SERVER_IMAGE: ${{ inputs.pmm_server_image || 'perconalab/pmm-server:3-dev-latest' }}
      PMM_CLIENT_VERSION: ${{ inputs.pmm_client_version || 'latest-tarball' }}

    steps:
      - name: Pick the PXC version and tarball
        run: |
          release=$PXC_INPUT
          if [[ $release == http* ]]; then
            release=$(curl -fsSL https://raw.githubusercontent.com/Percona-QA/package-testing/master/VERSIONS | sed -n 's/^PXC80_VER="\(.*\)"/\1/p')
            [[ -n $release ]] || { echo "PXC80_VER not found in VERSIONS"; exit 1; }
          fi
          echo "PXC_MAJOR=$(cut -d. -f1-2 <<<"$release")" >> "$GITHUB_ENV"
          if [[ $release == *.*.* ]]; then
            echo "PXC_TARBALL_PATH=https://downloads.percona.com/downloads/TESTING/pxc-$release.1/Percona-XtraDB-Cluster_$release.1_Linux.x86_64.glibc$PXC_GLIBC.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Run the PMM Server container
        run: docker run --detach --restart always -p 443:8443 -p 8081:8080 --name pmm-server ${{ env.PMM_SERVER_IMAGE }}

      - name: Checkout pmm-qa
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.pmm_qa_branch || 'main' }}

      - name: Export path to qa-integration tree
        working-directory: qa-integration
        run: echo "PATH_TO_PMM_QA=$(pwd)" >> "$GITHUB_ENV"

      - name: Run Setup for E2E Tests
        working-directory: qa-integration/pmm_qa
        run: |
          mkdir -p /tmp/backup_data
          chmod 777 /tmp/backup_data
          ./pmm-framework/pmm-framework --parallel --pmm-server-password=${{ env.ADMIN_PASSWORD }} --client-version=${{ env.PMM_CLIENT_VERSION }} \
            --database "PXC=${PXC_MAJOR}${PXC_TARBALL_PATH:+,TARBALL=$PXC_TARBALL_PATH}"

      - name: Install npx dependencies
        working-directory: codeceptjs-e2e
        run: npm ci && npx playwright install --with-deps && npx codeceptjs def pr.codecept.js

      - name: Run the Integration tests of PXC
        working-directory: codeceptjs-e2e
        run: |
          export PMM_UI_URL="http://127.0.0.1:8081/"
          npx codeceptjs run -c pr.codecept.js tests/qa-integration/pmm_pxc_integration_test.js
