version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies

updates:
  - package-ecosystem: npm
    directories:
      - /cli
      - /codeceptjs-e2e
      - /e2e_tests
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
