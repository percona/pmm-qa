version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /cli
      - /codeceptjs-e2e
      - /e2e_tests
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    labels:
      - dependencies
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
