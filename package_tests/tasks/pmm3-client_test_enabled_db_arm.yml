# Encapsulates "enabled_db" variable initialization

# Percona Server comes with the test environment rather than the playbook
# (docker/percona-server-versions sets its version per OS), so it is listed
# whenever it is installed, as ps-<series>.
- name: Find the installed Percona Server
  command: /usr/sbin/mysqld --version
  register: mysqld_version
  changed_when: false
  failed_when: false

- name: Set Databases list for arm
  set_fact:
    enabled_db: "{{ db_list|select|list }}"
  vars:
    db_list:
## Percona Server for MySQL
      - "{{ ('ps-' ~ (mysqld_version.stdout | regex_search('\\d+\\.\\d+'))) if mysqld_version.rc == 0 else '' }}"
