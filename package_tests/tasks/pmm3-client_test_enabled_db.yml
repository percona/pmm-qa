# Encapsulates "enabled_db" variable initialization

# docker/database-versions is the source of truth for the databases the test
# environment provides. Each line for this OS becomes <database>-<version>, such
# as ps-8.4, and the playbook then expects that database to be installed.
- name: Read the databases docker/database-versions lists for this OS
  command: bash {{ playbook_dir }}/docker/install-databases.sh --list
  register: database_versions
  changed_when: false

- name: Set Databases list
  set_fact:
    enabled_db: "{{ (database_versions.stdout_lines + db_list) | select | list }}"
  vars:
    db_list:
# Debian
## Percona Server for MongoDB
      - "{{ (ansible_distribution == 'Debian' and ansible_distribution_major_version|int == 11) | ternary('psmdb-70','') }}"
      - "{{ (ansible_distribution == 'Debian' and ansible_distribution_major_version|int == 12) | ternary('psmdb-80','') }}"
#      - "{{ (ansible_distribution == 'Debian' and ansible_distribution_major_version|int == 13) | ternary('psmdb-80','') }}"
## Valkey
      - "{{ (ansible_distribution == 'Debian' and ansible_distribution_major_version|int == 11) | ternary('valkey-91','') }}"
      - "{{ (ansible_distribution == 'Debian' and ansible_distribution_major_version|int == 12) | ternary('valkey-91','') }}"
      - "{{ (ansible_distribution == 'Debian' and ansible_distribution_major_version|int == 13) | ternary('valkey-91','') }}"
# Ubuntu
## Percona Server for MongoDB
      - "{{ (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version|int == 22) | ternary('psmdb-80','') }}"
      - "{{ (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version|int == 24) | ternary('psmdb-80','') }}"
#      - "{{ (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version|int == 26) | ternary('psmdb-80','') }}"
## Valkey
      - "{{ (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version|int == 22) | ternary('valkey-91','') }}"
      - "{{ (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version|int == 24) | ternary('valkey-91','') }}"
      - "{{ (ansible_distribution == 'Ubuntu' and ansible_distribution_major_version|int == 26) | ternary('valkey-91','') }}"
# RedHat
## Percona Server for MongoDB
      - "{{ (ansible_os_family == 'RedHat' and ansible_distribution != 'Amazon' and ansible_distribution_major_version|int == 8) | ternary('psmdb-80','') }}"
      - "{{ (ansible_os_family == 'RedHat' and ansible_distribution != 'Amazon' and ansible_distribution_major_version|int == 9) | ternary('psmdb-80','') }}"
#      - "{{ (ansible_os_family == 'RedHat' and ansible_distribution != 'Amazon' and ansible_distribution_major_version|int == 10) | ternary('psmdb-80','') }}"
## Valkey
      - "{{ (ansible_os_family == 'RedHat' and ansible_distribution != 'Amazon' and ansible_distribution_major_version|int == 8) | ternary('valkey-91','') }}"
      - "{{ (ansible_os_family == 'RedHat' and ansible_distribution != 'Amazon' and ansible_distribution_major_version|int == 9) | ternary('valkey-8','') }}"
      - "{{ (ansible_os_family == 'RedHat' and ansible_distribution != 'Amazon' and ansible_distribution_major_version|int == 10) | ternary('valkey-91','') }}"
