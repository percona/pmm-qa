# PSMDB 8.0.21-8.0.34 refuses to start on kernel 6.19 and later whenever tcmalloc
# runs with per-CPU caches ("MongoDB cannot start: Linux kernel versions 6.19 and
# newer...", SERVER-121912; 8.0.35 exempts the fixed kernels). Failing rseq with
# ENOSYS turns per-CPU caches off on every OS. Clearing GLIBC_TUNABLES is not
# enough: glibc 2.28 on OL8 never registers rseq, so tcmalloc always gets it.
- name: Keep tcmalloc per-CPU caches off for mongod on kernel {{ ansible_kernel }}
  when: ansible_kernel is version('6.19', '>=')
  block:
    - name: Create the mongod drop-in directory
      file:
        path: /etc/systemd/system/mongod.service.d
        state: directory
        mode: '0755'

    - name: Add the mongod drop-in that fails rseq
      copy:
        dest: /etc/systemd/system/mongod.service.d/kernel-rseq.conf
        mode: '0644'
        content: |
          [Service]
          SystemCallFilter=~rseq
          SystemCallErrorNumber=ENOSYS

    - name: Reload systemd units
      systemd:
        daemon_reload: true
