# The PSMDB unit sets GLIBC_TUNABLES=glibc.pthread.rseq=0 so tcmalloc uses per-CPU
# caches, and PSMDB 8.0.21-8.0.34 then refuses to start on kernel 6.19 and later
# ("MongoDB cannot start: Linux kernel versions 6.19 and newer...", SERVER-121912;
# 8.0.35 exempts the fixed kernels). With the variable cleared glibc keeps rseq,
# tcmalloc falls back to per-thread caches, and the startup check passes.
- name: Clear GLIBC_TUNABLES for mongod on kernel {{ ansible_kernel }}
  when: ansible_kernel is version('6.19', '>=')
  block:
    - name: Create the mongod drop-in directory
      file:
        path: /etc/systemd/system/mongod.service.d
        state: directory
        mode: '0755'

    - name: Add the mongod drop-in that clears GLIBC_TUNABLES
      copy:
        dest: /etc/systemd/system/mongod.service.d/kernel-rseq.conf
        mode: '0644'
        content: |
          [Service]
          Environment=GLIBC_TUNABLES=

    - name: Reload systemd units
      systemd:
        daemon_reload: true
