<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeceptJS Migration</title>
<style>
  body { margin: 0; padding: 40px 16px; font: 400 14px/1.5 system-ui, sans-serif; color: #4a5566; background: #f6f7f9; }
  @media (prefers-color-scheme: dark) { body { color: #b1bac8; background: #0f1218; } }
</style>
</head>
<body>
<p id="status">Loading the migration dashboard…</p>
<script>
// The page lives on the CodeceptJS-migration branch with its data, so it changes without a gh-pages commit.
fetch('https://raw.githubusercontent.com/percona/pmm-qa/CodeceptJS-migration/migration/dashboard/index.html', { cache: 'no-store' })
  .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
  .then((html) => { document.open(); document.write(html); document.close(); })
  .catch((e) => { document.getElementById('status').textContent = `Could not load the migration dashboard (${e.message}).`; });
</script>
</body>
</html>
